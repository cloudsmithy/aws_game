データベース","role":"DynamoDB、RDS または Aurora に注文を書き込み","intro":"サーバーレスのキーバリュー型およびドキュメント型データベース","what":"サーバーレスのキーバリュー型およびドキュメント型データベース：ミリ秒単位で読み書きでき、オンデマンドモードはリクエスト単位で課金、データは自動的に複数の AZ に保存されます。グローバルテーブルを使えば複数のリージョンで同時に読み書きできます。","uses":"ユーザーセッション、ショッピングカート、ゲームデータ、高い同時実行性が求められるワークロード","why":"アクセスパターンが決まっていて、同時アクセスが非常に多いときに使います：管理するデータベースサーバーがなく、読み書きのレイテンシーはミリ秒単位で安定しています","rent0":48},{"k":"rds","n":"RDS","g":"データベース","role":"DynamoDB、RDS または Aurora に注文を書き込み","intro":"マネージドなリレーショナルデータベース","what":"マネージドなリレーショナルデータベース：MySQL、PostgreSQL、MariaDB、Oracle、SQL Server、Db2 に対応し、バックアップ、パッチ適用、フェイルオーバーを代行します。マルチ AZ 配置では別の AZ にスタンバイインスタンスを置きます。","uses":"従来型の業務システム、EC サイトの注文データベース","why":"リレーショナルデータベースが必要だけれど、自分で運用したくないときに使います：バックアップ、パッチ適用、マルチ AZ のフェイルオーバーはすべてマネージドで、選べるエンジンが最も多いです","rent0":56},{"k":"aurora","n":"Aurora","g":"データベース","role":"DynamoDB、RDS または Aurora に注文を書き込み","intro":"Amazon Web Services が独自に開発したクラウドネイティブなリレーショナルデータベースで、MySQL および PostgreSQL と互換性があります","what":"Amazon Web Services が独自に開発したクラウドネイティブなリレーショナルデータベースで、MySQL および PostgreSQL と互換性があります：データは 3 つの AZ に 6 つのコピーとして保存され、リードレプリカは最大 15 個。Aurora Serverless v2 は負荷に応じて自動でスケールし、Global Database はリージョンをまたいで使えます。","uses":"高い同時実行性が求められる基幹業務データベース","why":"より高いパフォーマンスと可用性を備えた MySQL や PostgreSQL が必要なときに選びます：ストレージは自動で 3 つの AZ にまたがり、リードレプリカの遅延も小さく抑えられます","rent0":56}],"choose":"キーでの読み書きで同時アクセスが非常に多いなら DynamoDB を選びます。SQL とトランザクションが必要なら Aurora（パフォーマンスと可用性がより高い）か RDS（エンジンが多く、より安い）を選びます"}],"icons":{"ec2":"data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iODBweCIgaGVpZ2h0PSI4MHB4IiB2aWV3Qm94PSIwIDAgODAgODAiIHZlcnNpb249IjEuMSIgeG1sbnM9Imh0dHA6Ly93d3cudzMub3JnLzIwMDAvc3ZnIiB4bWxuczp4bGluaz0iaHR0cDovL3d3dy53My5vcmcvMTk5OS94bGluayI+IDxnIGlkPSJJY29uLUFyY2hpdGVjdHVyZS82NC9BcmNoX0FtYXpvbi1FQzJfNjQiIHN0cm9rZT0ibm9uZSIgc3Ryb2tlLXdpZHRoPSIxIiBmaWxsPSJub25lIiBmaWxsLXJ1bGU9ImV2ZW5vZGQiPiA8ZyBpZD0iSWNvbi1BcmNoaXRlY3R1cmUtQkcvNjQvQ29tcHV0ZSIgZmlsbD0iI0VENzEwMCI+IDxyZWN0IGlkPSJSZWN0YW5nbGUiIHg9IjAiIHk9IjAiIHdpZHRoPSI4MCIgaGVpZ2h0PSI4MCI+PC9yZWN0PiA8L2c+IDxwYXRoIGQ9Ik0
