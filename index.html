<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>亚马逊云科技大富翁</title>
<style>
:root{
  --ink:#16191f;--ink2:#232f3e;--mut:#545b64;--mut2:#687078;--line:#d5dbdb;--line2:#eaeded;--bg:#f2f3f3;
  --orange:#ec7211;--blue:#0972d3;--red:#d13212;--green:#1d8102;--focus:#0972d3;
  --sans:'Amazon Ember',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{font-family:var(--sans);font-size:14px;color:var(--ink);background:var(--bg)}
.muted{color:var(--mut2)}
svg{flex:none}
img.awsi{display:block}

/* ---------- 按钮：亚马逊云科技控制台样式 ---------- */
button{font:inherit;font-weight:700;font-size:14px;cursor:pointer;border-radius:2px;padding:4px 18px;min-height:32px;background:#fff;color:var(--mut);border:1px solid var(--mut);
  display:inline-flex;align-items:center;justify-content:center;gap:6px}
button:hover:not(:disabled){background:#fafafa;color:var(--ink);border-color:var(--ink)}
button:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
button:disabled{background:#fff;color:#aab7b8;border-color:#d5dbdb;cursor:not-allowed}
button svg{width:16px;height:16px}
button.pri{background:var(--orange);border-color:var(--orange);color:#fff}
button.pri:hover:not(:disabled){background:#eb5f07;border-color:#eb5f07;color:#fff}
button.pri:disabled{background:#fff;color:#aab7b8;border-color:#d5dbdb}
button.danger{background:var(--red);border-color:var(--red);color:#fff}
button.ghost{border-color:var(--line);color:var(--mut)}
button.lg{min-height:38px;font-size:15px;padding:6px 26px}
button.sm{padding:1px 12px;min-height:26px;font-size:12px}
input[type=number],textarea,.names input{font:inherit;background:#fff;color:var(--ink);border:1px solid #aab7b8;border-radius:2px;padding:5px 8px}
input[type=number]{width:110px;font-variant-numeric:tabular-nums}
input:focus-visible,textarea:focus-visible{outline:2px solid var(--focus);outline-offset:0;border-color:var(--focus)}
textarea{width:100%;margin-top:4px}
table{border-collapse:collapse;width:100%;font-size:13px}
td,th{border-bottom:1px solid var(--line2);padding:6px 8px;text-align:left;vertical-align:top}
th{color:var(--mut);font-weight:700;font-size:12px;background:#fafafa}

/* ---------- 架构图分组框 ---------- */
.grp{position:relative;border:1px solid var(--gc,#879596);background:#fff}
.grp.dash{border-style:dashed}
.grp>.gt{position:absolute;top:-1px;left:-1px;display:flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--gc,#232f3e);background:#fff;padding-right:8px}
.grp>.gt img.awsi{width:24px;height:24px}
.grp>.gb{padding:30px 12px 12px}

/* ---------- 开局页 ---------- */
#setup{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.setup-box{background:#fff;border:1px solid var(--line);border-radius:0;padding:26px 30px;width:min(740px,100%);box-shadow:0 1px 1px rgba(0,28,36,.3),1px 1px 1px rgba(0,28,36,.15)}
.gtitle{display:flex;align-items:center;gap:12px}
.gtitle img.awsi{width:44px;height:44px}
.gtitle h1{margin:0;font-size:26px;font-weight:700;line-height:1.15}
.gtitle .sub{font-size:13px;color:var(--mut2);font-weight:400}
.setup-head p{margin:14px 0 0;line-height:1.6;color:var(--mut)}
.sec{margin-top:22px}
.sec h5{margin:0 0 8px;font-size:14px;font-weight:700}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tiles:has(#winRounds){grid-template-columns:repeat(2,1fr)}
.tile{position:relative;display:block;border:2px solid #aab7b8;background:#fff;border-radius:8px;padding:11px 13px 11px 36px;cursor:pointer}
.tile::before{content:'';position:absolute;left:12px;top:14px;width:14px;height:14px;border-radius:50%;border:2px solid #7d8998;background:#fff}
.tile>input[type=radio]{position:absolute;opacity:0;pointer-events:none}
.tile b{display:block;font-size:14px}
.tile span{display:block;font-size:12px;color:var(--mut2);margin-top:3px;line-height:1.5}
.tile span input{width:64px;padding:1px 6px;margin-right:2px}
.tile:has(>input:checked){border-color:var(--blue);background:#f1faff}
.tile:has(>input:checked)::before{border:5px solid var(--blue)}
.tile:has(>input:focus-visible){outline:2px solid var(--focus);outline-offset:2px}
.tiles.np{grid-template-columns:repeat(3,110px)}
.names{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.nrow{display:flex;align-items:center;gap:8px}
.nrow input{flex:1;min-width:0}
.switch{display:flex;align-items:center;gap:10px;margin-top:22px;cursor:pointer;position:relative}
.switch input{position:absolute;opacity:0}
.switch .tg{width:32px;height:18px;border-radius:999px;background:#7d8998;position:relative;flex:none}
.switch .tg::after{content:'';position:absolute;left:2px;top:2px;width:14px;height:14px;border-radius:50%;background:#fff;transition:transform .15s}
.switch input:checked+.tg{background:var(--blue)}
.switch input:checked+.tg::after{transform:translateX(14px)}
.switch input:focus-visible+.tg{outline:2px solid var(--focus);outline-offset:2px}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.btns.end{justify-content:flex-end}

/* 编号圆圈 = 玩家棋子 */
.pawn{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:50%;background:var(--pc);color:#fff;font-weight:700;font-size:12px;flex:none;line-height:1}

/* ---------- 棋盘 = AWS Cloud 分组 ---------- */
#game{display:flex;gap:20px;padding:16px;align-items:flex-start;justify-content:center;flex-wrap:wrap}
#game[hidden]{display:none}
.frame{position:relative;background:#fff;border:2px solid var(--ink2);padding:40px 14px 14px;flex:none}
.frame>.gt{position:absolute;top:-2px;left:-2px;display:flex;align-items:center;gap:8px;font-weight:700;font-size:14px;background:#fff;padding-right:10px}
.frame>.gt img.awsi{width:32px;height:32px}
#board{container-type:inline-size;display:grid;grid-template-columns:1.5fr repeat(9,1fr) 1.5fr;grid-template-rows:1.5fr repeat(9,1fr) 1.5fr;
  width:min(calc(100vh - 88px),calc(100vw - 480px));min-width:620px;aspect-ratio:1;gap:.35cqw}

/* ---------- 格子 ---------- */
.sq{position:relative;background:#fff;color:var(--ink);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.25cqw;padding:1.4cqw .3cqw .4cqw;cursor:pointer;overflow:hidden}
.sq:hover{background:#f7f9fa}
.sq:focus-visible{outline:2px solid var(--focus);outline-offset:1px;z-index:3}
.sq.g{border:.16cqw solid var(--gc)}
.sq.g.dash{border-style:dashed}
.sq.l,.sq.r{flex-direction:row;justify-content:flex-start;gap:.5cqw;padding:1.3cqw .5cqw .3cqw}
.glab{position:absolute;top:0;left:0;font-size:.82cqw;font-weight:700;color:var(--gc);background:#fff;padding:0 .35cqw .05cqw 0;line-height:1.25}
.art{position:relative;flex:none}
.art img.awsi{width:3.5cqw;height:3.5cqw}
.sq.l .art img.awsi,.sq.r .art img.awsi{width:3.1cqw;height:3.1cqw}
.txt{display:flex;flex-direction:column;align-items:center;gap:.15cqw;min-width:0}
.sq.l .txt,.sq.r .txt{align-items:flex-start}
.nm{font-size:.98cqw;line-height:1.15;text-align:center;word-break:keep-all;overflow-wrap:normal}
.sq.l .nm,.sq.r .nm{text-align:left;font-size:.92cqw}
.pr{font-size:.88cqw;color:var(--mut2);font-variant-numeric:tabular-nums}
.pr.neg{color:var(--red);font-weight:700}
.lvb{display:inline-flex;align-items:center;gap:.2cqw;font-size:.75cqw;font-weight:700;line-height:1;padding:.12cqw .3cqw;border:.12cqw dashed;white-space:nowrap}
.lvb img.awsi{width:1cqw;height:1cqw}
.lvb.az{color:#147eba;border-color:#147eba}
.lvb.asg{color:#ed7100;border-color:#ed7100}
.lvb.reg{color:#00a4a6;border-color:#00a4a6}
.own{position:absolute;top:0;right:0;min-width:1.55cqw;height:1.55cqw;background:var(--oc);color:#fff;font-size:.85cqw;font-weight:700;display:flex;align-items:center;justify-content:center}
.sq.owned{background:color-mix(in srgb,var(--oc) 6%,#fff)}
.sq.last{box-shadow:inset 0 0 0 .3cqw var(--orange)}
.toks{position:absolute;left:0;right:0;bottom:.35cqw;display:flex;justify-content:center;gap:.15cqw;z-index:2}
.art .toks{left:auto;right:-1.1cqw;bottom:-.5cqw;flex-direction:column-reverse;gap:.1cqw}
.sq .pawn{width:1.75cqw;height:1.75cqw;font-size:.95cqw;box-shadow:0 0 0 .15cqw #fff}
.sq.corner{gap:.3cqw;padding:.6cqw}
.corner .art img.awsi{width:4.2cqw;height:4.2cqw}
.corner .nm{font-size:1.35cqw;font-weight:700}
.corner .pr{font-size:.95cqw}

/* ---------- 中央画布 ---------- */
#center{grid-row:2/11;grid-column:2/11;display:grid;grid-template-rows:auto auto auto minmax(0,1fr);gap:1.4cqw;padding:1cqw 1.4cqw;cursor:default;min-height:0}
.c-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.c-head .gtitle h1{font-size:2.1cqw}
.c-head .gtitle img.awsi{width:3.2cqw;height:3.2cqw}
.c-head .sub{font-size:12px}
.meta{display:flex;gap:6px}
.tablezone{display:grid;grid-template-columns:1fr 1.7fr 1fr;gap:1.4cqw}
.tablezone .grp>.gb{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;min-height:100%;padding:34px 10px 12px}
.tablezone .grp{display:flex;flex-direction:column}
.deckic img.awsi{width:48px;height:48px}
.deck-n{font-size:13px;color:var(--mut)}
.dice{display:flex;gap:10px}
.die{width:44px;height:44px;border:1.5px solid var(--ink2);border-radius:4px;background:#fff;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);padding:6px}
.die i{width:7px;height:7px;border-radius:50%;background:var(--ink2);place-self:center;visibility:hidden}
.die i.on{visibility:visible}
.dice.idle .die{opacity:.35}
.dice.rolling .die{animation:roll .45s ease-out}
@keyframes roll{0%{transform:rotate(-120deg)}100%{transform:none}}
.who{display:flex;align-items:center;gap:8px;font-size:15px}
.who b{font-weight:700}
.who .cash{color:var(--green);font-weight:700;font-variant-numeric:tabular-nums}
.st{font-size:12.5px;color:var(--mut);text-align:center}
.actions{display:flex;flex-direction:column;align-items:center;gap:8px}
.actions .row{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.lower{display:grid;grid-template-columns:1fr 13.5cqw;gap:1.4cqw;min-height:0}
.lower .grp{display:flex;flex-direction:column;min-height:0}
.lower .grp>.gb{flex:1;min-height:0;overflow:auto;padding-top:30px}
.log{font-size:13px;line-height:1.6}
.log div{padding:2px 0;border-bottom:1px solid var(--line2)}
.legend{font-size:12px;line-height:1.5;display:flex;flex-direction:column;gap:7px}
.legend .row{display:flex;align-items:center;gap:6px}
.legend .lvb{font-size:11px;padding:1px 5px;border-width:1.5px}
.legend .lvb img.awsi{width:13px;height:13px}
.legend .own{position:static;width:16px;height:16px;min-width:16px;font-size:11px}
.legend .sw{width:22px;height:14px;border:2px solid var(--gc)}

/* ---------- 玩家 = AWS Account 分组 ---------- */
#side{width:390px;display:flex;flex-direction:column;gap:22px;max-height:calc(100vh - 32px);overflow:auto;padding:10px 6px 10px}
.pl{border-color:var(--pc);border-width:2px;flex:none}
.pl>.gt{top:-2px;left:-2px;color:var(--ink)}
.pl.cur{box-shadow:0 0 0 3px var(--orange)}
.pl.dead{opacity:.5;filter:grayscale(1)}
.pl .gb{padding:32px 12px 12px;display:flex;flex-direction:column;gap:8px}
.pl .cashline{position:absolute;top:4px;right:10px;font-size:18px;font-weight:700;font-variant-numeric:tabular-nums}
.pl .now{color:var(--orange);font-size:12px;font-weight:700;margin-left:4px}
.debt{color:var(--red);font-weight:700}
.role{font-size:12px;color:var(--mut);line-height:1.5}
.role b{color:var(--ink)}
.res{font-size:12.5px;line-height:1.6}
.res .warn{color:var(--red);font-weight:700}
.res s{color:var(--mut2)}
.deeds{display:grid;grid-template-columns:repeat(5,1fr);gap:5px 8px}
.dg{display:flex;flex-direction:column;gap:2px;min-width:0}
.dl{font-size:10px;color:var(--mut2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dsegs{display:flex;gap:2px}
.dd{flex:1;height:10px;border:1px solid var(--gc);background:#fff;display:flex;align-items:center;justify-content:center;gap:1px}
.dd.on{background:var(--gc)}
.dd.stp{background:repeating-linear-gradient(45deg,var(--gc) 0 2px,#fff 2px 5px)}
.dd i{width:3px;height:3px;background:#fff}
.dd i.x{width:7px}
.pillars{display:grid;grid-template-columns:repeat(3,1fr);gap:2px 8px;font-size:12px}
.pillar{color:var(--mut2)}
.pillar::before{content:'○ '}
.pillar.on{color:var(--green);font-weight:700}
.pillar.on::before{content:'● '}
.pillar svg{display:none}
.pchip{display:inline-block;padding:0 6px;font-size:11px;margin-right:4px;font-weight:700;border:1px solid var(--gc);color:var(--gc)}

/* ---------- 弹窗 ---------- */
.modal{position:fixed;inset:0;background:rgba(242,243,243,.8);display:flex;align-items:center;justify-content:center;z-index:10;padding:16px}
.modal[hidden]{display:none}
.box{background:#fff;color:var(--ink);border:1px solid var(--line);border-radius:0;padding:0;max-width:600px;width:100%;max-height:90vh;overflow:auto;box-shadow:0 4px 20px 1px rgba(0,28,36,.25)}
.box.wide{max-width:960px}
.box h3{margin:0;font-size:18px;font-weight:700;padding:16px 20px;border-bottom:1px solid var(--line2)}
.box .mb{padding:16px 20px 4px}
.box .inps{padding:0 20px}
.box .btns{padding:12px 20px 16px;margin:0;justify-content:flex-end;border-top:1px solid var(--line2);margin-top:12px}
.box h4{margin:16px 0 6px}
.box p{line-height:1.6;margin:8px 0}
.box.quiz .btns{flex-direction:column;align-items:stretch}
.box.quiz .btns button{justify-content:flex-start;text-align:left}
.q{font-size:16px;font-weight:700}
.inps label{display:flex;align-items:center;gap:8px;margin:7px 0}
.inps label.cb{cursor:pointer}
.inps input[type=checkbox]{width:16px;height:16px;accent-color:var(--blue)}
.inps .ih{margin:14px 0 4px;font-weight:700}

/* 事件卡 / 地契：都画成架构图分组框 */
.ecard{margin:6px 0 8px}
.ecard>.gb{padding:36px 16px 14px}
.ecard .ett{font-size:18px;font-weight:700;line-height:1.35}
.ecard .ed{font-size:14px;line-height:1.6;margin-top:6px}
.ecard .imm{margin-top:18px}
.ecard .imm>.gb{padding:26px 12px 10px;font-size:13.5px;line-height:1.55}
.ecard .tip{margin-top:12px;font-size:12.5px;color:var(--mut);line-height:1.5}
.ecard .tip b{color:var(--ink)}
.bcard{margin:6px 0 8px}
.bcard>.gb{padding:34px 16px 12px}
.bcard .bh{display:flex;align-items:center;gap:12px}
.bcard .bh img.awsi{width:56px;height:56px}
.bcard .bh b{display:block;font-size:17px}
.bcard .bh span{font-size:13px;color:var(--mut)}
.bcard table{margin-top:10px}
.bcard td:last-child{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.bcard tr.hi td{background:#f1faff}
.bcard .df{font-size:12px;color:var(--mut);line-height:1.6;margin-top:8px}
.bcard .ow{display:flex;align-items:center;gap:6px;font-size:13px;margin-top:8px}

#err{position:fixed;bottom:12px;left:12px;background:var(--red);color:#fff;padding:8px 14px;display:none;z-index:20;max-width:60vw;font-size:13px}
@media (max-width:1120px){#side{width:100%;max-height:none;display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr))}#board{width:min(calc(100vw - 70px),calc(100vh - 88px))}}
@media (max-width:700px){.tiles{grid-template-columns:1fr}.names{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
.grp>.gt.t{padding:3px 8px}
.ecard img.hero{width:48px;height:48px}
.bcard .ow .pawn{width:18px;height:18px;font-size:11px}
/* ===== v5：参考架构图的留白版 ===== */
#board{gap:0;border-top:1px solid var(--line);border-left:1px solid var(--line)}
.sq{border:0;border-right:1px solid var(--line);border-bottom:1px solid var(--line);gap:.35cqw;padding:.6cqw .4cqw}
.sq.g{border:0;border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.sq.g::before{content:'';position:absolute;background:var(--gc)}
.sq.g.b::before{left:0;right:0;top:0;height:.5cqw}
.sq.g.t::before{left:0;right:0;bottom:0;height:.5cqw}
.sq.g.l::before{top:0;bottom:0;right:0;width:.5cqw}
.sq.g.r::before{top:0;bottom:0;left:0;width:.5cqw}
.sq.g.dash::before{background:repeating-linear-gradient(90deg,var(--gc) 0 .6cqw,transparent .6cqw 1cqw)}
.sq.g.l.dash::before,.sq.g.r.dash::before{background:repeating-linear-gradient(180deg,var(--gc) 0 .6cqw,transparent .6cqw 1cqw)}
.glab{display:none}
.sq.owned{background:#fff;box-shadow:inset 0 0 0 .28cqw var(--oc)}
.own{display:none}
.sq.l,.sq.r{padding:.5cqw .9cqw;gap:.7cqw}
.art img.awsi{width:4cqw;height:4cqw}
.sq.l .art img.awsi,.sq.r .art img.awsi{width:3.5cqw;height:3.5cqw}
.nm{font-size:1.1cqw}
.sq.l .nm,.sq.r .nm{font-size:1.05cqw}
.pr{font-size:1cqw}
.lv{position:absolute;top:1cqw;right:.7cqw}
.sq.l .lv,.sq.r .lv{top:.9cqw}
.sq.t .lv{top:.5cqw}
.lvb{font-size:.78cqw;padding:.1cqw .28cqw;border-width:.1cqw}
.lvb img.awsi{width:1.15cqw;height:1.15cqw}
.lvb.asg,.lvb.reg{border:0;padding:0}
.lvb.asg span,.lvb.reg span{display:none}
.sq.last{box-shadow:inset 0 0 0 .3cqw var(--orange)}
.sq.owned.last{box-shadow:inset 0 0 0 .28cqw var(--oc),0 0 0 .3cqw var(--orange);z-index:2}
.art .toks{right:-1.3cqw;bottom:-.6cqw}
.sq .pawn{width:2cqw;height:2cqw;font-size:1.05cqw}
.corner .art img.awsi{width:4.6cqw;height:4.6cqw}
.corner .nm{font-size:1.4cqw}

/* 中央 */
#center{grid-template-rows:auto 1fr auto minmax(0,1.1fr);gap:1.2cqw;padding:1.8cqw 2.2cqw;border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.c-head .gtitle h1{font-size:2.2cqw}
.c-head .sub{font-size:12.5px;margin-top:2px}
.stage{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px}
.stage .who{font-size:17px}
.stage .st{font-size:13px}
.die{width:50px;height:50px;padding:7px}
.die i{width:8px;height:8px}
.stage .row{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.decks{display:flex;justify-content:center;gap:4cqw;font-size:13px;color:var(--mut)}
.decks .dk{display:flex;align-items:center;gap:10px}
.decks img.awsi{width:32px;height:32px}
.decks b{display:block;color:var(--ink);font-size:13px}
.lower{display:flex;flex-direction:column;min-height:0;border-top:1px solid var(--line);padding-top:10px;gap:8px}
.lower h4{margin:0;font-size:13px;font-weight:700}
.log{flex:1;min-height:0;overflow:auto}
.log div{border-bottom:0;padding:1px 0;color:var(--mut)}
.log div:first-child{color:var(--ink)}
.legend{flex-direction:row;flex-wrap:wrap;gap:6px 18px;font-size:12px;color:var(--mut);border-top:1px solid var(--line2);padding-top:8px}

<div id="setup">
  <div class="setup-box">
    <div class="setup-head">
      <div id="setupLogo" style="--ls:40px"></div>
      <p class="muted">在亚马逊云科技上创业：买服务、做高可用、扛住 Health 事件、控账单。2–4 人同屏轮流玩，完整规则见同目录的「规则书.md」。</p>
    </div>
    <div id="resume"></div>
    <div class="sec">
      <h5>玩家</h5>
      <div class="tiles np">
        <label class="tile"><input type="radio" name="np" value="2" onchange="renderNames()"><b>2 人</b></label>
        <label class="tile"><input type="radio" name="np" value="3" checked onchange="renderNames()"><b>3 人</b></label>
        <label class="tile"><input type="radio" name="np" value="4" onchange="renderNames()"><b>4 人</b></label>
      </div>
      <div class="names" id="names"></div>
    </div>
    <div class="sec">
      <h5>难度</h5>
      <div class="tiles">
        <label class="tile"><input type="radio" name="diff" value="basic"><b>入门局</b><span>基础规则、释放服务、运行费与请求费、维护窗口与复盘、Spot 购买</span></label>
        <label class="tile"><input type="radio" name="diff" value="std" checked><b>标准局</b><span>再加升级附加费、技术债、新账号保护期、季度财报、服务停止支持</span></label>
        <label class="tile"><input type="radio" name="diff" value="full"><b>完整局</b><span>再加主动行动、完整交易、Savings Plans / RI、托管</span></label>
      </div>
    </div>
    <div class="sec">
      <h5>胜利条件（可以多选，谁先达成谁赢）</h5>
      <div class="tiles">
        <div class="tile fixed"><b>经典（一直生效）</b><span>只剩一个人没破产，这个人就赢</span></div>
        <label class="tile ck"><input type="checkbox" id="winWA"><b>Well-Architected</b><span>谁先凑齐六大支柱谁赢</span></label>
        <label class="tile ck"><input type="checkbox" id="winRounds" checked><b>轮数上限</b><span>打满 <input type="number" id="rounds" value="30" min="5" max="200" aria-label="轮数"> 轮按估值排名</span></label>
        <label class="tile ck"><input type="checkbox" id="winTimed"><b>限时</b><span><input type="number" id="minutes" value="90" min="5" max="600" aria-label="分钟数"> 分钟到了按估值算分</span></label>
      </div>
    </div>
    <label class="switch"><input type="checkbox" id="learn"><span class="tg"></span><b>学习模式</b><span class="muted">付过路费、买地产时答亚马逊云科技题</span></label>
    <div class="btns end"><button class="lg" onclick="showManual()">先看玩法</button><button class="pri lg" id="startBtn" onclick="startFromSetup()">开始游戏</button></div>
  </div>
</div>

<div id="game" hidden>
  <div class="frame"><div id="board"></div></div>
  <aside id="side"></aside>
</div>

<div id="modal" class="modal" hidden><div class="box"></div></div>
<div id="err"></div>

    S.lastSq = p.pos;

    render(); await sleep(100);

}

function saTarget(p) {
  const cands = [];
  COMBOS.forEach(c => {
    if (!c.ix.flat().some(i => owns(p, i))) return;
    c.ix.forEach(n => (Array.isArray(n) ? n : [n]).forEach(i => { if (S.props[i].owner === null) cands.push(i); }));
  });
  const dist = i => (i - p.pos + N) % N || N;
  if (cands.length) return cands.sort((a, b) => dist(a) - dist(b))[0];
  const free = OWNABLE.filter(i => S.props[i].owner === null).sort((a, b) => dist(a) - dist(b));
  return free.length ? free[0] : null;
}

async function quarterly() {

}
function timedOver(why = '时间到') { const alive = S.players.filter(q => q.alive).sort((a, b) => valuation(b) - valuation(a)); gameOver(alive[0], `${why}，按估值算分（$${valuation(alive[0])}）`); }

const MANUAL_HTML = "<h2 style=\"margin:0 0 8px\">亚马逊云科技大富翁 · 玩法手册</h2><p class=\"muted\">这本手册讲怎么上手玩。每条规则的细节和数字查「规则书.md」；网页版里点「玩法」也能随时打开这本手册。</p><hr style=\"border:0;border-top:1px solid #eaeded;margin:14px 0\"><h4>一、一句话玩法</h4><p>你是一家在亚马逊云科技上创业的公司：绕着棋盘走，<b>买亚马逊云科技服务</b>，别人走到你的服务上就<b>付你过路费</b>；把服务<b>升级、扩容、组成完整架构</b>，收得更多；同时要<b>扛住各种线上事故</b>，<b>控制好账单</b>。最后没破产的人赢，或者先做到 Well-Architected 六大支柱的人赢。</p><hr style=\"border:0;border-top:1px solid #eaeded;margin:14px 0\"><h4>二、开局</h4><ol style=\"padding-left:20px;margin:6px 0\"><li>双击打开 <code>index.html</code>，选人数（2–4 人）、难度、胜利条件，点「开始游戏」。</li><li>每人随机抽到一个角色，起始资金和特殊能力都不一样，比如传统企业上云钱多，但在维护窗口里要多待一轮。</li><li>第一次玩建议选<b>入门局</b>，胜利条件保持默认（经典 + 30 轮上限）；熟悉了再试标准局和完整局。想顺便学亚马逊云科技，就打开<b>学习模式</b>。</li></ol><hr style=\"border:0;border-top:1px solid #eaeded;margin:14px 0\"><h4>三、一回合怎么走</h4><ol style=\"padding-left:20px;margin:6px 0\"><li><b>掷骰子</b>，按点数往前走。</li><li><b>看落在哪</b>：<ul style=\"padding-left:20px;margin:6px 0\"><li>没人买的服务 → 可以按需买（全价，稳），也可以 Spot 买（自己出价，最低原价的 20%，但别人出更高的价能抢走）。</li><li>别人的服务 → 付过路费。</li><li>自己的服务 → 可以给它<b>加一个功能</b>、<b>加一份容量</b>，或者花 $50 用 <b>FIS 给对手注入故障</b>（三选一）。</li><li>Health 事件 / re:Invent → 抽一张卡照做。</li><li>账单格、角落格 → 按格子上写的办。</li></ul></li><li><b>做点别的</b>（可选）：资产管理、和别人交易；完整局还能签 Savings Plans / RI、做主动行动。</li><li>结算完<b>自动轮到下一位</b>。掷出对子可以再掷一次，但同一回合连掷 3 次对子会\"被限流\"，直接进维护窗口。</li></ol><hr style=\"border:0;border-top:1px solid #eaeded;margin:14px 0\"><h4>四、怎么赚钱</h4><p>1. 收过路费</p><p>服务越贵、升级越多、容量越大，过路费越高。按请求计费的服务（Serverless 那些）过路费还会随对方掷出的点数浮动：点数大说明流量大，收得多。主人集齐一整组（同色的几块）时，没升级的服务过路费也翻倍。</p><p>2. 组成有效架构，联合收费</p><p>把几块能真正配合工作的服务凑齐，就组成一个架构。<b>别人落在架构里任意一块上，要把整套架构里所有服务的过路费加起来付给你。</b> 这是游戏里最赚钱的玩法。</p><table><tr><th>架构</th><th>要哪些服务</th></tr><tr><td>Serverless API</td><td>API Gateway + Lambda + DynamoDB</td></tr><tr><td>经典三层 Web</td><td>ELB + EC2 + RDS</td></tr><tr><td>容器平台</td><td>ECR + ECS 或 EKS + ELB</td></tr><tr><td>事件驱动</td><td>EventBridge + Step Functions + Lambda</td></tr><tr><td>异步解耦</td><td>API Gateway + SQS + Lambda</td></tr><tr><td>实时日志分析</td><td>Kinesis + Lambda + OpenSearch</td></tr><tr><td>Serverless 数据湖</td><td>S3 + Glue + Athena</td></tr><tr><td>静态网站</td><td>Route 53 + CloudFront + S3</td></tr><tr><td>GenAI 知识库（RAG）</td><td>S3 + OpenSearch + Bedrock</td></tr><tr><td>ML 训练与部署</td><td>S3 + ECR + SageMaker</td></tr><tr><td>高可用入口</td><td>Route 53 + ELB + EC2</td></tr><tr><td>纵深防御</td><td>WAF + Shield Advanced + GuardDuty</td></tr></table><p>有些架构还有额外好处，比如「高可用入口」让你的实例不怕 AZ 断电，「纵深防御」免疫所有安全类事件。抽到 re:Invent 卡「解决方案架构师的建议」，能直接飞到你架构里缺的那块服务。</p><p>3. 其他进账</p><ul style=\"padding-left:20px;margin:6px 0\"><li>每次经过起点「Startup 扶持」，领 $200 Credits。</li><li>落在「User Group 活动」三选一：<b>抽奖</b>，从奖池（账单格和罚款都进奖池）里随机拿 $50～全部；<b>领 $200 Credits</b>，稳拿；或者<b>抽一张 re:Invent 卡</b>。抽到 re:Invent「领到 Free Tier 额度」能把奖池全部拿走。</li><li>re:Invent 卡大多是好事：拿 Credits、考认证、Hackathon 拿奖……</li></ul><hr style=\"border:0;border-top:1px solid #eaeded;margin:14px 0\"><h4>五、怎么花钱：不同服务的账单不一样</h4><p>这是这个游戏和普通大富翁最不一样的地方。<b>买下服务之后，它会按自己的计费方式持续花你的钱。</b></p><table><tr><th>服务类型</th><th>例子</th><th>每圈经过起点时</th><th>收到过路费时</th></tr><tr><td>IaaS / 容器</td><td>EC2、EBS、ECS、EKS</td><td>交运行费（空着也要交）</td><td>全归你</td></tr><tr><td>PaaS</td><td>RDS、Aurora、Redshift、SageMaker</td><td>交运行费，比 IaaS 贵</td><td>全归你</td></tr><tr><td>Serverless</td><td>Lambda、S3、DynamoDB、SQS</td><td>不交钱</td><td>交 15% 请求费</td></tr><tr><td>按 token</td><td>Bedrock</td><td>不交钱（加了模型单元要交）</td><td>交 25% token 成本</td></tr><tr><td>订阅</td><td>Shield Advanced</td><td>固定 $40</td><td>全归你</td></tr></table><p>所以：</p><ul style=\"padding-left:20px;margin:6px 0\"><li><b>Serverless 前期没负担</b>，没人来就不花钱，适合起步。</li><li><b>实例型服务空着也烧钱</b>，但有人来时收入全归你，适合放在大家常走的位置。</li><li>想省钱可以 Spot 购买：自己出价，最低原价的 20%。出得越低越省，但别人落上来只要比你多出原价的 10% 就能抢走（你拿回出价的一半作补偿）；以后补差价就能转成按需，出到全价就没人能抢。</li><li>完整局可以签 <b>Savings Plans</b>（预付一笔，接下来 3 或 6 轮按小时计费的运行费打 5 折）或给某块服务买<b>预留实例 RI</b>（预付 2 圈运行费，6 轮免运行费）。</li><li>钱紧的时候可以把服务 <b>Stop</b>（实例型）或<b>下线</b>（其他服务），拿回一半钱，也不用交运行费，只是暂时收不到过路费。</li></ul><hr style=\"border:0;border-top:1px solid #eaeded;margin:14px 0\"><h4>六、怎么变强：升级和扩容</h4><p>落在<b>自己的服务</b>上时，可以加功能、加容量（下面细说），或者花 $50 用 FIS 替一位对手抽一张 Health 事件卡、让他承受，三选一：</p><p>加功能（最多 3 级）</p><ul style=\"padding-left:20px;margin:6px 0\"><li><b>实例型服务</b>（EC2、RDS、ECS、EKS 等）买下时是<b>单 AZ</b>，第 1 级一定是<b>多 AZ</b>，之后才能加 Auto Scaling 之类的功能。</li><li>其他服务天生跨多个 AZ，三级都是功能，比如：<ul style=\"padding-left:20px;margin:6px 0\"><li>ECR：基础扫描 → 增强扫描 → 跨区域复制</li><li>Lambda：提高并发配额 → 预置并发 → 多区域</li><li>Bedrock：Nova Lite → Nova Pro → 跨区域推理（档位越高，每个 token 越贵，过路费越高）</li><li>VPC：私有子网 + NAT（要多交 NAT 的钱）→ 跳板机 → Transit Gateway</li></ul></li><li>很多功能自带防护：多 AZ 扛 AZ 断电，Auto Scaling 扛流量暴增，增强扫描扛 CVE，备份扛误删……服务详情里都写着。</li></ul><p>加容量（最多 4 份）</p><p>给服务加节点、加并发：EC2 加实例、EKS 加节点、Lambda 加并发、Kinesis 加分片、SageMaker 加 GPU 卡、Bedrock 加模型单元……每份让过路费 <b>+25%</b>。实例型服务每多一份，每圈运行费也会多一些；Serverless 加并发不增加运行费。</p><p class=\"muted\">集齐一整组之后，不用等落地，在「资产管理」里随时可以升级和扩容。</p><hr style=\"border:0;border-top:1px solid #eaeded;margin:14px 0\"><h4>七、怎么不被坑：Health 事件和防护</h4><p>Health 事件卡大多是坏事，但几乎每张都有对应的防护。提前做好架构，就能躲过去：</p><table><tr><th>遇到</th><th>怎么防</th></tr><tr><td>一个 AZ 断电 / 单点故障</td><td>实例型服务升多 AZ；或者组成「高可用入口」</td></tr><tr><td>某个服务在 Region 里宕机</td><td>升到多区域那一级</td></tr><tr><td>us-east-1 大面积故障</td><td>至少一块服务有多区域功能</td></tr><tr><td>流量暴增 / 服务配额用完</td><td>Auto Scaling、提高配额、按需容量；或「异步解耦」架构</td></tr><tr><td>DDoS</td><td>Shield Advanced、WAF、CloudFront</td></tr><tr><td>SSH 暴力破解</td><td>VPC 升到跳板机；或者付 $50 借别人的跳板机</td></tr><tr><td>高危 CVE</td><td>Inspector、ECR 增强扫描、Fargate；PaaS 和 Serverless 由亚马逊云科技打补丁</td></tr><tr><td>误删数据</td><td>AWS Backup，或有备份类功能（版本控制、时间点恢复……）</td></tr><tr><td>Root 密钥泄露</td><td>GuardDuty</td></tr><tr><td>证书过期</td><td>ELB 或 CloudFront 升到 HTTPS</td></tr></table><p>被事件打挂的服务会变成 <b>Impaired</b>，到它主人的下一个回合前收不到过路费。</p><p>实在躲不过，还能用 Enterprise Support 卡、复盘标记、演练标记来抵消。被罚到又没抵消的，标准局起会欠 1 个<b>技术债</b>：每个让每圈运行费多 $20；攒到 2 个升级每级贵 $50；攒到 3 个要停一轮\"大重构\"并交 $100。花 $50 可以重构清掉 1 个。</p><hr style=\"border:0;border-top:1px solid #eaeded;margin:14px 0\"><h4>八、角落格</h4><table><tr><th>格子</th><th>发生什么</th></tr><tr><td>Startup 扶持（起点）</td><td>经过领 $200 Credits，同时交这一圈的运行费</td></tr><tr><td>维护窗口</td><td>直接落在这里要停一轮；被关进来要掷出对子、付 $50 开 Support Case，或用 Enterprise Support 才能出来。出来时讲一句根因，可以领复盘标记</td></tr><tr><td>User Group 活动</td><td>三选一：奖池随机抽 $50～全部 / 领 $200 Credits / 抽一张 re:Invent 卡</td></tr><tr><td>Root 密钥泄露</td><td>进维护窗口；有 GuardDuty 的只交 $50</td></tr></table><hr style=\"border:0;border-top:1px solid #eaeded;margin:14px 0\"><h4>九、怎么赢</h4><ul style=\"padding-left:20px;margin:6px 0\"><li><b>经典模式</b>：别人都破产了，你就赢了。</li><li><b>破产</b>：钱不够付时，可以先在资产管理里去掉升级、Stop/下线凑钱，也可以直接宣告破产；平时自己回合里点「宣告破产」也能主动认输。出局后，你的服务连同升级和容量整个归债主（或你指定的玩家），欠银行的就回到银行。</li><li>胜利条件可以多选，谁先达成谁赢。</li><li><b>Well-Architected 模式</b>：先同时满足卓越运营、安全、可靠性、性能效率、成本优化、可持续性六个支柱的人赢。网页版右侧会实时显示每个人的支柱进度。</li><li><b>轮数上限</b>（默认开，30 轮）：打满轮数按资产估值排名，保证一局能打完。</li><li><b>限时模式</b>：时间到了按资产估值排名。</li></ul><hr style=\"border:0;border-top:1px solid #eaeded;margin:14px 0\"><h4>十、新手建议</h4><ol style=\"padding-left:20px;margin:6px 0\"><li><b>前几圈先买便宜的 Serverless 服务</b>：S3、EFS、Lambda 不花运行费，攒钱快。</li><li><b>盯住一个架构去凑</b>：联合收费比单块服务强得多。</li><li><b>买了实例型服务，尽早升多 AZ</b>：AZ 断电、单点故障这几张卡专门坑单 AZ 的实例。</li><li><b>VPC 很关键</b>：没有 VPC 的人给实例升多 AZ 要付钱给 VPC 主人；VPC 有了跳板机还能防 SSH 暴力破解、能出租。</li><li><b>别一口气把钱花光</b>：每圈都要交运行费，账单格和事件卡也会扣钱。现金太少一次没付上，就可能被迫变卖。</li><li><b>注意 Bedrock</b>：它按 token 收费，对方掷的点数越大，你收得越多；但要交 25% token 成本。</li></ol><hr style=\"border:0;border-top:1px solid #eaeded;margin:14px 0\"><h4>十一、一局开头示例</h4><p class=\"muted\">小王是车库创业公司，起始 $1600。<br>第 1 轮掷出 3，落在 <b>re:Invent</b>，抽到「拿到 AWS Activate Credits」，领 $200。<br>第 2 轮落在 <b>Lambda</b>，花 $220 买下。Serverless 不交运行费，没人来也不花钱。<br>第 4 轮又落在自己的 Lambda 上，选「加 1 个并发」，过路费 +25%。<br>后来 Alice 落在小王的 Lambda 上，付了过路费，小王把其中 15% 作为请求费付给亚马逊云科技。<br>小王又买到 API Gateway 和 DynamoDB，凑齐「Serverless API」。从此别人落在这三块里任意一块，都要按三块加起来的过路费付给小王。<br>有一轮抽到 Health 事件「一个 AZ 断电了」：小王的服务全是 Serverless，天生跨多个 AZ，一点事都没有；Alice 的 EC2 还是单 AZ，变成 Impaired。</p><hr style=\"border:0;border-top:1px solid #eaeded;margin:14px 0\"><h4>十二、常见问题</h4><p><b>Q：为什么 Kinesis 不能 Stop？</b></p><p>Kinesis、Lambda 这些服务没有\"停机\"一说，所以叫\"下线\"。效果和 Stop 一样：拿回一半钱，暂时不收过路费。</p><p><b>Q：为什么 Route 53 没有\"多 AZ\"？</b></p><p>Route 53 是全局服务，本来就不在某个 AZ 里，它的升级是健康检查、故障转移路由这些功能。</p><p><b>Q：CloudWatch、CloudTrail、Data Transfer 怎么收钱？</b></p><p>这三格算一组按用量收费：过路费 = 对方掷出的点数 × 倍数，三格都有时倍数最高，升级后倍数还会增加。</p><p><b>Q：架构联合收费和单块过路费能叠加吗？</b></p><p>不叠加。落在架构里的服务上，就按整套架构的总额收一次；一块服务在几个架构里，取最高的那个。</p><p><b>Q：保留卡都干啥的？</b></p><p>抽到后放在面前，需要时用掉：Enterprise Support 免费离开维护窗口或抵消一张 Health 事件卡；Spot 容量让下次 Spot 最低出价降到 10%；Cost Explorer 免一次账单格或抵消「月底账单爆了」；MAP 让下次买 IaaS、PaaS 或容器服务打 7 折。网页里鼠标停在玩家面板的卡名上能看到说明。</p><p><b>Q：Spot 出多少合适？</b></p><p>出价越低越省钱，但越容易被抢。别人抢的时候最少要比你多出原价的 10%，被抢你拿回出价的一半。想长期留着、要升级的服务，要么直接按需买，要么之后补差价转成按需。</p><p><b>Q：奖池的钱从哪来、到哪去？</b></p><p>两个账单格、Health 事件罚款、维护窗口的 $50 都进奖池。落在 User Group 活动选「抽奖」能随机拿 $50～全部，抽到「领到 Free Tier 额度」拿走全部。奖池大就去抽奖，奖池小不如稳拿 $200。</p><p><b>Q：网页版能存档吗？</b></p><p>能。浏览器会自动保存，关掉再打开，点「继续上一局」就行。</p><hr style=\"border:0;border-top:1px solid #eaeded;margin:14px 0\"><h4>附录 A：每个服务的特性和升级</h4><p><b>升级规则</b></p><ul style=\"padding-left:20px;margin:6px 0\"><li>落在自己的服务上，可以三选一：给它升一级功能；加 1 份容量（每份过路费 +25%，最多 4 份）；或者花 $50 用 FIS 给对手注入故障。</li><li>集齐整组后，不用等落地，在「资产管理」里随时可以升级、加容量。</li><li>实例型服务（IaaS、PaaS、ECS、EKS）买下时是单 AZ，第 1 级一定是多 AZ；其他服务天生跨多个 AZ，三级都是功能。</li><li>每级升级费按服务所在的边：下边 $50、左边 $100、上边 $150、右边 $200；每份容量是升级费的一半。</li><li>过路费：未升级是价格的 15%（集齐整组翻倍），第 1 级 × 5、第 2 级 × 12、第 3 级 × 20。</li><li>升级附加费（标准局起）：实例型升多 AZ 但没有 VPC，付 $50 给 VPC 主人；升多区域那一级，付 $50 跨区域数据传输费；AI 组升级但没有 S3，多付 $50。</li><li>Spot 状态的服务要先转成按需才能升级。</li></ul><p>存储组</p><p><b>S3</b>（价格 $60 · 容量单位：存储桶）  </p><p>Serverless：天生跨多个 AZ；按请求：不交运行费，每次收到过路费交请求费；过路费随对方点数浮动</p><table><tr><th>级别</th><th>功能</th><th>现实里是干什么的</th><th>游戏效果</th></tr><tr><td>第 1 级</td><td>版本控制</td><td>保留每个对象的历史版本，误删、误改都能找回</td><td>免疫误删数据</td></tr><tr><td>第 2 级</td><td>智能分层</td><td>按访问频率自动把数据挪到便宜的存储层</td><td>运行费或请求费减半</td></tr><tr><td>第 3 级</td><td>跨区域复制</td><td>自动把对象复制到另一个 Region</td><td>扛住整个 Region 出问题</td></tr></table><p><b>EFS</b>（价格 $60 · 容量单位：吞吐量）  </p><p>Serverless：天生跨多个 AZ；按请求：不交运行费，每次收到过路费交请求费；过路费随对方点数浮动</p><table><tr><th>级别</th><th>功能</th><th>现实里是干什么的</th><th>游戏效果</th></tr><tr><td>第 1 级</td><td>生命周期管理</td><td>不常用的文件自动转到低频访问存储，更便宜</td><td>运行费或请求费减半</td></tr><tr><td>第 2 级</td><td>自动备份</td><td>用 AWS Backup 每天自动备份文件系统</td><td>免疫误删数据</td></tr><tr><td>第 3 级</td><td>跨区域复制</td><td>把文件系统复制到另一个 Region</td><td>扛住整个 Region 出问题</td></tr></table><p><b>AWS Backup</b>（价格 $80 · 容量单位：备份库）  </p><p>托管服务：天生跨多个 AZ；按请求：不交运行费，每次收到过路费交请求费；过路费随对方点数浮动</p><table><tr><th>级别</th><th>功能</th><th>现实里是干什么的</th><th>游戏效果</th></tr><tr><td>第 1 级</td><td>备份计划</td><td>按计划统一备份 EBS、RDS、DynamoDB、EFS 等</td><td>免疫误删数据</td></tr><tr><td>第 2 级</td><td>跨账号备份</td><td>备份放进另一个账号，主账号被攻破也删不掉</td><td>免疫「S3 桶被设成公开」</td></tr><tr><td>第 3 级</td><td>跨区域备份</td><td>备份副本放到另一个 Region</td><td>扛住整个 Region 出问题</td></tr></table><p>IaaS 计算组</p><p><b>Lightsail</b>（价格 $100 · 容量单位：实例）  </p><p>IaaS（实例型）：买下时是单 AZ，AZ 断电会受影响，第 1 级升多 AZ；按小时：每圈经过起点交运行费，空着也要交</p><table><tr><th>级别</th><th>功能</th><th>现实里是干什么的</th><th>游戏效果</th></tr><tr><td>第 1 级</td><td>负载均衡 + 多实例</td><td>流量分给不同 AZ 里的多台实例</td><td>扛住 AZ 断电和单点故障</td></tr><tr><td>第 2 级</td><td>自动快照</td><td>每天自动给实例拍快照</td><td>免疫误删数据</td></tr><tr><td>第 3 级</td><td>托管数据库</td><td>把数据库交给 Lightsail 托管，网站更完整</td><td>这块过路费再 +20%</td></tr></table><p><b>EC2</b>（价格 $100 · 容量单位：实例）  </p><p>IaaS（实例型）：买下时是单 AZ，AZ 断电会受影响，第 1 级升多 AZ；按小时：每圈经过起点交运行费，空着也要交</p><table><tr><th>级别</th><th>功能</th><th>现实里是干什么的</th><th>游戏效果</th></tr><tr><td>第 1 级</td><td>多 AZ</td><td>在两个 AZ 各跑一份，一个 AZ 出问题另一个顶上</td><td>扛住 AZ 断电和单点故障</td></tr><tr><td>第 2 级</td><td>Auto Scaling</td><td>按 CPU 或请求数自动加减实例</td><td>扛住流量暴增</td></tr><tr><td>第 3 级</td><td>Graviton</td><td>换成 Arm 架构实例，同样性能更便宜</td><td>运行费或请求费减半</td></tr></table><p><b>EBS</b>（价格 $120 · 容量单位：卷）  </p><p>IaaS（实例型）：买下时是单 AZ，AZ 断电会受影响，第 1 级升多 AZ；按小时：每圈经过起点交运行费，空着也要交</p><table><tr><th>级别</th><th>功能</th><th>现实里是干什么的</th><th>游戏效果</th></tr><tr><td>第 1 级</td><td>快照跨 AZ 恢复</td><td>定期快照，卷所在的 AZ 出问题时可以在别的 AZ 恢复</td><td>扛住 AZ 断电和单点故障</td></tr><tr><td>第 2 级</td><td>gp3 卷</td><td>性能和容量分开计费，比 gp2 便宜</td><td> const BOTOUT = { errors: [], games: [] };
function botAct(box, inputs, buttons, done) {
  inputs.forEach(inp => {
    if (!inp.id) return;
    const el = box.querySelector('#in_' + inp.id); if (!el || el.disabled) return;
    if (inp.type === 'checkbox') el.checked = Math.random() < 0.3;
    else if (inp.type === 'textarea') el.value = '配置没有用代码管理';
    else { const mx = inp.max ?? 300; el.value = Math.random() < 0.4 ? 0 : rnd(Math.min(mx, 400) + 1); }
  });
  const opts = [];
  buttons.forEach(b => { if (!b.disabled) opts.push({ v: b.value, w: (b.cls || '').includes('danger') ? 0.05 : (b.botW ?? 1) }); });
  box.querySelectorAll('[data-v]').forEach(el => { if (!el.disabled) opts.push({ v: el.dataset.v, w: el.dataset.bw ? +el.dataset.bw : 0.3 }); });
  let t = Math.random() * opts.reduce((a, o) => a + o.w, 0);
  for (const o of opts) { t -= o.w; if (t <= 0) return done(o.v); }
  done(opts[opts.length - 1].v);
}
function invariants() {
  const errs = [];
  S.players.forEach(p => {
    if (!Number.isFinite(p.cash) || p.cash < 0) errs.push(`${p.name} cash=${p.cash}`);
    if (p.techDebt < 0 || p.techDebt > 2) errs.push(`${p.name} techDebt=${p.techDebt}`);
    if (!p.alive && ownedBy(p).length) errs.push(`${p.name} dead but owns`);
    if (p.pos < 0 || p.pos >= N) errs.push(`${p.name} pos=${p.pos}`);
  });
  OWNABLE.forEach(i => {
    const pr = S.props[i];
    if (pr.level < 0 || pr.level > 3) errs.push(`level ${i}`);
    if (pr.owner === null && (pr.level || pr.cap || pr.impaired)) errs.push(`unowned dirty ${i}`);
    if (!SQ[i].upg && pr.level) errs.push(`nonupg level ${i}`);
    if ((pr.cap || 0) < 0 || (pr.cap || 0) > CAP_MAX) errs.push(`cap ${i}`);
  });
  if (!Number.isFinite(S.pot) || S.pot < 0) errs.push('pot');
  return errs;
}
async function botGame(cfg) {
  newGame(cfg); enterGame();
  let steps = 0, stall = 0;
  while (!S.over && steps < 6000) {
    steps++;
    await new Promise(r => setTimeout(r, 0));
    const bad = invariants(); if (bad.length) { BOTOUT.errors.push(`[${cfg.diff}/${cfg.win}] step ${steps}: ${bad.join('; ')}`); break; }
    if (S.phase === 'roll') {
      stall = 0;
      const p = cur();
      if (p.jail !== null) { const k = ['roll', 'roll', 'pay', 'es'][rnd(4)]; await jailAct(k === 'es' && !availCard(p, 'ES') ? 'roll' : k); }
      else await doRoll();
    } else if (S.phase === 'post') {
      stall = 0;
      const r = Math.random();
      if (r < 0.25) await uiAction(() => manage(cur()));
      else if (r < 0.3) await uiAction(trade);
      else if (r < 0.33 && F.full()) await uiAction(edpDialog);
      else if (r < 0.45 && F.actions() && !S.actionUsed) await uiAction(activeAction);
      else await endTurn();
    } else if (S.phase === 'busy') { if (++stall > 500) { BOTOUT.errors.push(`[${cfg.diff}/${cfg.win}] stalled at step ${steps}`); break; } }
  }
  BOTOUT.games.push({ diff: cfg.diff, win: cfg.win, learn: cfg.learn, steps, over: S.over, round: S.round, winner: S.winner, alive: S.players.filter(p => p.alive).length });
}

const SIMOUT = { games: [] };
let simReserve = 150;
function simAct(box, inputs, buttons, done) {
  const p = cur(), en = buttons.map((b, k) => ({ ...b, k })).filter(b => !b.disabled);
  const money = lbl => +((String(lbl).match(/\$(\d+)/) || [0, 0])[1]);
  const pick = f => en.find(b => f(String(b.label)));
  inputs.forEach(inp => { const el = box.querySelector('#in_' + inp.id); if (el && inp.type === 'number') el.value = 0; if (el && inp.type === 'checkbox') el.checked = false; });
  let b = pick(l => l.startsWith('按需购买'));
  if (b && p.cash - money(b.label) >= simReserve) return done(b.value);
  if (pick(l => l.startsWith('不买'))) return done(pick(l => l.startsWith('不买')).value);
  if (pick(l => l.startsWith('照常付'))) return done(pick(l => l.startsWith('照常付')).value);
  b = pick(l => l.startsWith('加'));
  if (b && p.cash - money(b.label) >= simReserve * 2) return done(b.value);
  if (pick(l => l === '先不加')) return done(pick(l => l === '先不加').value);
  for (const key of ['自动变卖', '用掉', '交 10%', '不抵消', '执行', '知道了', '继续', '开标', '讲出来了', '同意', '跳过', '关闭', '先付 10%']) { const x = pick(l => l.startsWith(key)); if (x) return done(x.value); }
  done((en.find(x => (x.cls || '').includes('pri')) || en[0] || buttons[0]).value);
}
async function simGame(n, diff) {
  newGame({ names: ['甲', '乙', '丙', '丁'].slice(0, n), diff, wa: false, timed: false, minutes: 90, learn: false });
  enterGame();
  S.stats = { rent: 0, rentN: 0, joint: 0, run: 0, salary: 0, upg: 0, stops: 0 };
  const g = { rounds: 0, firstBust: null, cashByRound: {}, ownedByRound: {}, rentPaid: 0, runPaid: 0, salary: 0 };
  let lastRound = 0, steps = 0;
  const origPay = pay;
  while (!S.over && steps++ < 20000 && S.round <= 120) {
    await new Promise(r => setTimeout(r, 0));
    if (S.round !== lastRound) {
      lastRound = S.round;
      const alive = S.players.filter(q => q.alive);
      g.cashByRound[S.round] = Math.round(alive.reduce((a, q) => a + q.cash, 0) / alive.length);
      g.ownedByRound[S.round] = Math.round(alive.reduce((a, q) => a + ownedBy(q).length, 0) / alive.length * 10) / 10;
      g.netByRound = g.netByRound || {}; g.netByRound[S.round] = Math.round(alive.reduce((a, q) => a + netWorth(q), 0) / alive.length);
    }
    if (g.firstBust === null && S.players.some(q => !q.alive)) g.firstBust = S.round;
    if (S.phase === 'roll') {
      const p = cur();
      // 像真人一样：集齐整组就升级
      ownedBy(p).forEach(i => { const u = upgradeInfo(p, i); if (u.ok && p.cash - u.total >= simReserve * 2) doUpgrade(p, i); });
      if (p.jail !== null) await jailAct(p.cash > 600 ? 'pay' : 'roll'); else await doRoll();
    }
    else if (S.phase === 'post') await endTurn();
  }
  g.stats = S.stats; g.released = S.players.reduce((a, q) => a + (q.released || 0), 0); g.levels = OWNABLE.reduce((a, i) => a + S.props[i].level, 0);
  g.rounds = S.round; g.over = S.over; g.alive = S.players.filter(q => q.alive).length;
  SIMOUT.games.push(g);
}
async function simMain() {
  const q = new URLSearchParams(location.search);
  const n = +q.get('sim') || 10, pl = +q.get('players') || 4, diff = q.get('diff') || 'std';
  simReserve = +(q.get('reserve') || 150);
  for (let k = 0; k < n; k++) await simGame(pl, diff);
  $('#botout').textContent = 'SIMRESULT ' + JSON.stringify(SIMOUT); $('#botout').hidden = false;
}
