<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>亚马逊云科技大富翁</title>
<style>
:root{--ink:#16191f;--ink2:#232f3e;--mut:#545b64;--mut2:#687078;--line:#d5dbdb;--line2:#eaeded;--bg:#f2f3f3;--orange:#ec7211;--blue:#0972d3;--red:#d13212;--green:#1d8102;--focus:#0972d3;--sans:'Amazon Ember',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{font-family:var(--sans);font-size:14px;color:var(--ink);background:var(--bg)}
.muted{color:var(--mut2)}
svg{flex:none}
img.awsi{display:block}

/* ---------- 按钮：亚马逊云科技控制台样式 ---------- */
button{font:inherit;font-weight:700;font-size:14px;cursor:pointer;border-radius:2px;padding:4px 18px;min-height:32px;background:#fff;color:var(--mut);border:1px solid var(--mut);display:inline-flex;align-items:center;justify-content:center;gap:6px}
button:hover:not(:disabled){background:#fafafa;color:var(--ink);border-color:var(--ink)}
button:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
button:disabled{background:#fff;color:#aab7b8;border-color:#d5dbdb;cursor:not-allowed}
button svg{width:16px;height:16px}
button.pri{background:var(--orange);border-color:var(--orange);color:#fff}
button.pri:hover:not(:disabled){background:#eb5f07;border-color:#eb5f07;color:#fff}
button.pri:disabled{background:#fff;color:#aab7b8;border-color:#d5dbdb}
button.danger{background:var(--red);border-color:var(--red);color:#fff}
button.ghost{color:var(--mut)}
button.lg{min-height:38px;font-size:15px;padding:6px 26px}
button.sm{padding:1px 12px;min-height:26px;font-size:12px}
input[type=number],textarea,.names input{font:inherit;background:#fff;color:var(--ink);border:1px solid #aab7b8;border-radius:2px;padding:5px 8px}
input[type=number]{width:110px;font-variant-numeric:tabular-nums}
input:focus-visible,textarea:focus-visible{outline:2px solid var(--focus);outline-offset:0;border-color:var(--focus)}
textarea{width:100%;margin-top:4px}
table{border-collapse:collapse;width:100%;font-size:13px}
td,th{border-bottom:1px solid var(--line2);padding:6px 8px;text-align:left;vertical-align:top}
th{color:var(--mut);font-weight:700;font-size:12px;background:#fafafa}

/* ---------- 架构图分组框 ---------- */
.grp{position:relative;border:1px solid var(--gc,#879596);background:#fff}
.grp.dash{border-style:dashed}
.grp>.gt{position:absolute;top:-1px;left:-1px;display:flex;align-items:center;gap:6px;font-size:12px;font-weight:700;background:#fff;padding-right:8px}
.grp>.gt img.awsi{width:24px;height:24px}
.grp>.gb{padding:30px 12px 12px}

/* ---------- 开局页 ---------- */
#setup{justify-content:center}
.setup-box{background:#fff}
.gtitle{display:flex;align-items:center;gap:12px}
.gtitle img.awsi{width:44px;height:44px}
.gtitle h1{margin:0;font-size:26px;font-weight:700;line-height:1.15}
.gtitle .sub{font-size:13px;color:var(--mut2);font-weight:400}
.setup-head p{margin:14px 0 0;line-height:1.6;color:var(--mut)}
.sec{margin-top:22px}
.sec h5{margin:0 0 8px;font-size:14px;font-weight:700}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tiles:has(#winRounds){grid-template-columns:repeat(2,1fr)}
.tile{position:relative;display:block;border:2px solid #aab7b8;background:#fff;cursor:pointer}
.tile::before{content:'';position:absolute;left:12px;top:14px;width:14px;height:14px;border-radius:50%;border:2px solid #7d8998;background:#fff}
.tile>input[type=radio]{position:absolute;opacity:0;pointer-events:none}
.tile b{display:block;font-size:14px}
.tile span{display:block;font-size:12px;color:var(--mut2);margin-top:3px;line-height:1.5}
.tile span input{width:64px;padding:1px 6px;margin-right:2px}
.tile:has(>input:checked){border-color:var(--blue);background:#f1faff}
.tile:has(>input:checked)::before{border:5px solid var(--blue)}
.tile:has(>input:focus-visible){outline:2px solid var(--focus);outline-offset:2px}

.names{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.nrow{display:flex;align-items:center;gap:8px}
.nrow input{flex:1;min-width:0}
.switch{display:flex;align-items:center;gap:10px;margin-top:22px;cursor:pointer;position:relative}
.switch input{position:absolute;opacity:0}
.switch .tg{width:32px;height:18px;border-radius:999px;background:#7d8998;position:relative;flex:none}
.switch .tg::after{content:'';position:absolute;left:2px;top:2px;width:14px;height:14px;border-radius:50%;background:#fff;transition:transform .15s}
.switch input:checked+.tg{background:var(--blue)}
.switch input:checked+.tg::after{transform:translateX(14px)}
.switch input:focus-visible+.tg{outline:2px solid var(--focus);outline-offset:2px}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.btns.end{justify-content:flex-end}

/* 编号圆圈 = 玩家棋子 */
.pawn{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:50%;background:var(--pc);color:#fff;font-weight:700;font-size:12px;flex:none;line-height:1}

/* ---------- 棋盘 = AWS Cloud 分组 ---------- */
#game{display:flex;gap:20px;padding:16px;align-items:flex-start;justify-content:center;flex-wrap:wrap}
#game[hidden]{display:none}
.frame{position:relative;background:#fff;border:2px solid var(--ink2);padding:40px 14px 14px;flex:none}
.frame>.gt{position:absolute;top:-2px;left:-2px;display:flex;align-items:center;gap:8px;font-weight:700;font-size:14px;background:#fff;padding-right:10px}
.frame>.gt img.awsi{width:32px;height:32px}
#board{container-type:inline-size;display:grid}

/* ---------- 格子 ---------- */
.sq{background:#fff;color:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;overflow:hidden}
.sq:hover{background:#f7f9fa}
.sq:focus-visible{outline:2px solid var(--focus);outline-offset:1px;z-index:3}

.sq.g.dash{border-style:dashed}

.glab{position:absolute;top:0;left:0;font-size:.82cqw;font-weight:700;color:var(--gc);background:#fff;padding:0 .35cqw .05cqw 0;line-height:1.25}
.art{position:relative;flex:none}

.txt{display:flex;flex-direction:column;align-items:center;gap:.15cqw;min-width:0}

.nm{line-height:1.15;text-align:center;word-break:keep-all;overflow-wrap:normal}

.pr{color:var(--mut2);font-variant-numeric:tabular-nums}
.pr.neg{color:var(--red);font-weight:700}
.lvb{display:inline-flex;align-items:center;gap:.2cqw;font-weight:700;line-height:1;border:.12cqw dashed;white-space:nowrap}

.lvb.az{color:#147eba;border-color:#147eba}
.lvb.asg{color:#ed7100;border-color:#ed7100}
.lvb.reg{color:#00a4a6;border-color:#00a4a6}
.own{position:absolute;top:0;right:0;min-width:1.55cqw;height:1.55cqw;background:var(--oc);color:#fff;font-size:.85cqw;font-weight:700;align-items:center;justify-content:center}

.toks{position:absolute;left:0;right:0;bottom:.35cqw;display:flex;justify-content:center;gap:.15cqw;z-index:2}
.art .toks{left:auto;flex-direction:column-reverse;gap:.1cqw}
.sq .pawn{box-shadow:0 0 0 .15cqw #fff}
.sq.corner{gap:.3cqw;padding:.6cqw}

.corner .nm{font-weight:700}

/* ---------- 中央画布 ---------- */
#center{display:grid;cursor:default;min-height:0}
.c-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}

.meta{display:flex;gap:6px}
.tablezone{display:grid;grid-template-columns:1fr 1.7fr 1fr;gap:1.4cqw}
.tablezone .grp>.gb{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;min-height:100%;padding:34px 10px 12px}
.tablezone .grp{display:flex;flex-direction:column}
.deckic img.awsi{width:48px;height:48px}
.deck-n{font-size:13px;color:var(--mut)}
.dice{display:flex;gap:10px}
.die{border:1.5px solid var(--ink2);border-radius:4px;background:#fff;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr)}
.die i{border-radius:50%;background:var(--ink2);place-self:center;visibility:hidden}
.die i.on{visibility:visible}
.dice.idle .die{opacity:.35}
.dice.rolling .die{animation:roll .45s ease-out}
@keyframes roll{0%{transform:rotate(-120deg)}100%{transform:none}}
.who{display:flex;align-items:center;gap:8px;font-size:15px}
.who b{font-weight:700}
.who .cash{color:var(--green);font-weight:700;font-variant-numeric:tabular-nums}
.st{font-size:12.5px;color:var(--mut);text-align:center}
.actions{display:flex;flex-direction:column;align-items:center;gap:8px}
.actions .row{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}

.lower .grp{display:flex;flex-direction:column;min-height:0}
.lower .grp>.gb{flex:1;min-height:0;overflow:auto;padding-top:30px}
.log{font-size:13px;line-height:1.6}

.legend{line-height:1.5;display:flex}
.legend .row{display:flex;align-items:center}
.legend .lvb{padding:1px 5px;border-width:1.5px}

.legend .own{position:static;width:16px;height:16px;min-width:16px;font-size:11px}
.legend .sw{width:22px;height:14px;border:2px solid var(--gc)}

/* ---------- 玩家 = AWS Account 分组 ---------- */
#side{display:flex;flex-direction:column;max-height:calc(100vh - 32px);overflow:auto;padding:10px 6px 10px}
.pl{flex:none}
.pl>.gt{top:-2px;left:-2px;color:var(--ink)}

.pl.dead{opacity:.5;filter:grayscale(1)}
.pl .gb{display:flex;flex-direction:column;gap:8px}
.pl .cashline{position:absolute;top:4px;right:10px;font-size:18px;font-weight:700;font-variant-numeric:tabular-nums}
.pl .now{font-size:12px;font-weight:700;margin-left:4px}
.debt{color:var(--red);font-weight:700}
.role{font-size:12px;color:var(--mut);line-height:1.5}
.role b{color:var(--ink)}
.res{font-size:12.5px;line-height:1.6}
.res .warn{color:var(--red);font-weight:700}
.res s{color:var(--mut2)}
.deeds{display:grid;grid-template-columns:repeat(5,1fr);gap:5px 8px}
.dg{display:flex;flex-direction:column;gap:2px;min-width:0}
.dl{font-size:10px;color:var(--mut2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dsegs{display:flex;gap:2px}
.dd{flex:1;height:10px;border:1px solid var(--gc);background:#fff;display:flex;align-items:center;justify-content:center;gap:1px}
.dd.on{background:var(--gc)}
.dd.stp{background:repeating-linear-gradient(45deg,var(--gc) 0 2px,#fff 2px 5px)}
.dd i{width:3px;height:3px;background:#fff}
.dd i.x{width:7px}
.pillars{display:grid;grid-template-columns:repeat(3,1fr);gap:2px 8px;font-size:12px}
.pillar{color:var(--mut2)}
.pillar::before{content:'○ '}
.pillar.on{color:var(--green);font-weight:700}
.pillar.on::before{content:'● '}
.pillar svg{display:none}
.pchip{display:inline-block;padding:0 6px;font-size:11px;margin-right:4px;font-weight:700;border:1px solid var(--gc);color:var(--gc)}

/* ---------- 弹窗 ---------- */
.modal{position:fixed;inset:0;background:rgba(242,243,243,.8);display:flex;align-items:center;justify-content:center;z-index:10;padding:16px}
.modal[hidden]{display:none}
.box{background:#fff;color:var(--ink);border:1px solid var(--line);border-radius:0;padding:0;max-width:600px;width:100%;max-height:90vh;overflow:auto;box-shadow:0 4px 20px 1px rgba(0,28,36,.25)}
.box.wide{max-width:960px}
.box h3{margin:0;font-size:18px;font-weight:700;padding:16px 20px;border-bottom:1px solid var(--line2)}
.box .mb{padding:16px 20px 4px}
.box .inps{padding:0 20px}
.box .btns{padding:12px 20px 16px;margin:0;justify-content:flex-end;border-top:1px solid var(--line2);margin-top:12px}
.box h4{margin:16px 0 6px}
.box p{line-height:1.6;margin:8px 0}
.box.quiz .btns{flex-direction:column;align-items:stretch}
.box.quiz .btns button{justify-content:flex-start;text-align:left}
.q{font-size:16px;font-weight:700}
.inps label{display:flex;align-items:center;gap:8px;margin:7px 0}
.inps label.cb{cursor:pointer}
.inps input[type=checkbox]{width:16px;height:16px;accent-color:var(--blue)}
.inps .ih{margin:14px 0 4px;font-weight:700}

/* 事件卡 / 地契：都画成架构图分组框 */
.ecard{margin:6px 0 8px}
.ecard>.gb{padding:36px 16px 14px}
.ecard .ett{font-size:18px;font-weight:700;line-height:1.35}
.ecard .ed{font-size:14px;line-height:1.6;margin-top:6px}
.ecard .imm{margin-top:18px}
.ecard .imm>.gb{padding:26px 12px 10px;font-size:13.5px;line-height:1.55}
.ecard .tip{margin-top:12px;font-size:12.5px;color:var(--mut);line-height:1.5}
.ecard .tip b{color:var(--ink)}
.bcard{margin:6px 0 8px}
.bcard>.gb{padding:34px 16px 12px}
.bcard .bh{display:flex;align-items:center;gap:12px}
.bcard .bh img.awsi{width:56px;height:56px}
.bcard .bh b{display:block;font-size:17px}
.bcard .bh span{font-size:13px;color:var(--mut)}
.bcard table{margin-top:10px}
.bcard td:last-child{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.bcard tr.hi td{background:#f1faff}
.bcard .df{font-size:12px;color:var(--mut);line-height:1.6;margin-top:8px}
.bcard .ow{display:flex;align-items:center;gap:6px;font-size:13px;margin-top:8px}

#err{position:fixed;bottom:12px;left:12px;background:var(--red);color:#fff;padding:8px 14px;display:none;z-index:20;max-width:60vw;font-size:13px}
@media (max-width:1120px){#side{width:100%;max-height:none;display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr))}#board{width:min(calc(100vw - 70px),calc(100vh - 88px))}}
@media (max-width:700px){.tiles{grid-template-columns:1fr}.names{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
.grp>.gt.t{padding:3px 8px}
.ecard img.hero{width:48px;height:48px}
.bcard .ow .pawn{width:18px;height:18px;font-size:11px}
/* ===== v5：参考架构图的留白版 ===== */
#board{gap:0;border-top:1px solid var(--line);border-left:1px solid var(--line)}
.sq{border:0;border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.sq.g{border:0;border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.sq.g::before{content:'';position:absolute;background:var(--gc)}
.sq.g.b::before{left:0;right:0;top:0;height:.5cqw}
.sq.g.t::before{left:0;right:0;bottom:0;height:.5cqw}
.sq.g.l::before{top:0;bottom:0;right:0;width:.5cqw}
.sq.g.r::before{top:0;bottom:0;left:0;width:.5cqw}
.sq.g.dash::before{background:repeating-linear-gradient(90deg,var(--gc) 0 .6cqw,transparent .6cqw 1cqw)}
.sq.g.l.dash::before,.sq.g.r.dash::before{background:repeating-linear-gradient(180deg,var(--gc) 0 .6cqw,transparent .6cqw 1cqw)}
.glab{display:none}
.sq.owned{background:#fff}
.own{display:none}

.sq.l .lv,.sq.r .lv{top:.9cqw}

.lvb{border-width:.1cqw}

.lvb.asg,.lvb.reg{border:0;padding:0}
.lvb.asg span,.lvb.reg span{display:none}
.sq.last{box-shadow:inset 0 0 0 .3cqw var(--orange)}
.sq.owned.last{box-shadow:inset 0 0 0 .28cqw var(--oc),0 0 0 .3cqw var(--orange);z-index:2}
.art .toks{right:-1.3cqw;bottom:-.6cqw}

/* 中央 */
#center{gap:1.2cqw;padding:1.8cqw 2.2cqw;border-right:1px solid var(--line);border-bottom:1px solid var(--line)}

.c-head .sub{font-size:12.5px;margin-top:2px}
.stage{display:flex;flex-direction:column;align-items:center;justify-content:center}

.stage .st{font-size:13px}

.stage .row{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.decks{justify-content:center;gap:4cqw;font-size:13px;color:var(--mut)}
.decks .dk{display:flex;align-items:center;gap:10px}
.decks img.awsi{width:32px;height:32px}
.decks b{display:block;color:var(--ink);font-size:13px}
.lower{flex-direction:column;min-height:0}
.lower h4{margin:0;font-size:13px;font-weight:700}
.log{flex:1;min-height:0;overflow:auto}
.log div{border-bottom:0;padding:1px 0;color:var(--mut)}
.log div:first-child{color:var(--ink)}
.legend{flex-direction:row;flex-wrap:wrap;gap:6px 18px;font-size:12px;color:var(--mut);border-top:1px solid var(--line2);padding-top:8px}
.legend .row{gap:5px}
.legend .lvb{font-size:11px}
.legend .lvb img.awsi{width:15px;height:15px}
.legend .ob{width:16px;height:16px;box-shadow:inset 0 0 0 3px #e5484d}
.legend .gb2{width:18px;height:5px;background:#c925d1}

/* 玩家 */
#side{gap:18px}
.pl{border-width:1px;border-color:var(--line);background:#fff}
.pl.cur{border-color:var(--orange);box-shadow:inset 0 0 0 1px var(--orange)}
.pl .pacc{display:flex;align-items:center;gap:10px;padding:12px 14px 4px}
.pl .pacc img.awsi{width:28px;height:28px}
.pl .pacc .pn{flex:1;min-width:0}
.pl .pacc .pn b{font-size:15px;display:flex;align-items:center;gap:6px}
.pl .pacc .pn small{font-size:12px;color:var(--mut2)}
.pl .pacc .cash{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums}
.pl .gb{padding:4px 14px 12px}
.svcs{display:flex;flex-wrap:wrap;min-height:30px;align-items:center}
.svc{position:relative;display:inline-flex}
.svc img.awsi{width:26px;height:26px}
.svc.stp img.awsi{filter:grayscale(1);opacity:.4}
.svc .sl{position:absolute;right:-5px;bottom:-5px;background:#fff;border-radius:2px;line-height:0}
.svc .sl .lvb{font-size:9px;padding:0 2px}
.svc .sl img.awsi{width:13px;height:13px}
.svcs .none{font-size:12px;color:var(--mut2)}
.pill-bar{display:flex;flex-wrap:wrap;gap:3px 12px;font-size:12px}
.legend img.awsi{width:16px;height:16px}
.svc .sl .lvb.az{font-size:8px;padding:0 1px;background:#fff}
.svcs{gap:9px 10px}
.sq.owned{box-shadow:none}
.sq.owned.last,.sq.last{box-shadow:inset 0 0 0 .3cqw var(--orange)}
.ownr{display:inline-flex;align-items:center;gap:.25cqw;font-weight:700;white-space:nowrap}
.ownr .pawn{box-shadow:none}
.imp-pill{font-weight:700;color:#8d6605}
.sq.impaired .art img{opacity:.55}

.sq.l .bill,.sq.r .bill{bottom:.35cqw}
.svc.imp img.awsi{opacity:.5;outline:2px solid #f2b200;outline-offset:1px}
.lvb.tx{color:#545b64;border-color:#879596}

/* ===== 48 格棋盘 ===== */

.sq{padding:.5cqw .3cqw;gap:.3cqw}

.pr{font-size:.85cqw}
.bill{bottom:.35cqw;right:.4cqw}
.lv{top:.75cqw;right:.45cqw}
.sq.t .lv{top:.45cqw}
.lvb{padding:.08cqw .22cqw}
.lvb img.awsi{width:1cqw;height:1cqw}

.ownr{font-size:.8cqw}
.ownr .pawn{width:1.15cqw;height:1.15cqw;font-size:.62cqw}

.flow{display:flex;flex-wrap:wrap;align-items:center;gap:4px}
.af{display:inline-flex;align-items:center;gap:4px;font-size:12px;white-space:nowrap}
.af img.awsi{width:20px;height:20px}
.arr{color:#879596;font-weight:700;margin:0 2px}
.or{color:#879596;font-size:12px}
.lv{position:static!important;display:inline-flex;max-width:100%}
.lv .lvb{max-width:100%;overflow:hidden;text-overflow:ellipsis}
/* 主人 = 色块 + 名字；棋子 = 编号圆圈，放在格子左上角，不压图标 */
.ownr i{display:inline-block;background:var(--oc);flex:none}
.ownr{color:var(--ink)}
.art .toks{position:static}
.sq>.toks,.art>.toks{position:absolute!important;left:.35cqw!important;top:.6cqw!important;right:auto!important;bottom:auto!important;flex-direction:column;gap:.15cqw}
.sq .art{position:static}
.sq{position:relative}
.cap{color:#0972d3;font-weight:700;white-space:nowrap}
/* 抽卡：背面先落下，压扁后换成正面展开 */
.flip{position:relative}
.flip .face.back{position:absolute;inset:6px 0 8px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;border:1px solid #16191f;color:#fff;font-size:22px;font-weight:700;letter-spacing:.04em;z-index:2;animation:backdrop .3s cubic-bezier(.2,.8,.2,1) both,backout .22s .45s ease-in forwards}
.flip .face.front{animation:frontin .26s .67s ease-out both}
@keyframes backdrop{from{transform:translateY(-50px) scale(.85);opacity:0}to{transform:none;opacity:1}}
@keyframes backout{to{transform:scaleX(0);visibility:hidden}}
@keyframes frontin{from{transform:scaleX(0)}to{transform:none}}
.flip .face.back.inc{background:repeating-linear-gradient(45deg,rgba(255,255,255,.06) 0 14px,transparent 14px 28px),#232f3e}
.flip .face.back.rei{background:repeating-linear-gradient(-45deg,rgba(255,255,255,.06) 0 14px,transparent 14px 28px),#16191f}
.flip .face.back img.awsi{width:72px;height:72px}
.flip .face.back span{color:#ff9900}
@media (prefers-reduced-motion:reduce){.flip .face.back{display:none}}
.tile>input[type=checkbox]{position:absolute;opacity:0;pointer-events:none}
.tile.ck::before{border-radius:3px}
.tile.ck:has(>input:checked)::before{border:2px solid var(--blue);background:var(--blue);box-shadow:inset 0 0 0 2px #fff}
.tile.fixed{cursor:default;background:#fafafa}
.tile.fixed::before{border-radius:3px;border:2px solid #879596;background:#879596;box-shadow:inset 0 0 0 2px #fff}
.decks .dk.pot b{color:#d13212}
.sq.impaired .ownr{color:#8d6605}
.pillar{cursor:help}
/* 日志放右侧；中间留给骰子和图例；格子图标放大 */

.lower{border-top:1px solid var(--line);padding-top:10px}
.logpanel{flex:none;border-color:var(--line)}
.logpanel .gb{padding:30px 12px 10px}
.logpanel .log{overflow:auto;font-size:13px}

.die{padding:9px}
.die i{width:10px;height:10px}

.box.quiz .btns button.skipq{border-color:#d5dbdb;color:#687078;justify-content:center;margin-top:6px}
.svc .lvn,.svc .cpn{position:absolute;right:-6px;bottom:-6px;min-width:14px;height:14px;border-radius:7px;background:#0972d3;color:#fff;font-size:10px;font-weight:700;line-height:14px;text-align:center;padding:0 3px}
.svc .cpn{right:auto;left:-6px;background:#545b64}
.arch{display:flex;flex-direction:column;gap:2px;margin-top:2px}
.ap{font-size:12px;color:var(--mut)}
.ap.done{color:#1d8102;font-weight:700}
/* 横向长方形棋盘 */
#board{grid-template-columns:1.3fr repeat(13,1fr) 1.3fr;grid-template-rows:1.3fr repeat(9,1fr) 1.3fr;aspect-ratio:15.6/11.6;width:min(calc((100vh - 88px) * 1.345),calc(100vw - 460px));min-width:760px}
#center{grid-row:2/11;grid-column:2/15}
#side{width:370px}
.art img.awsi{width:3.5cqw;height:3.5cqw}

.corner .art img.awsi{width:4cqw;height:4cqw}

.sq.l .nm,.sq.r .nm{font-size:.82cqw}
.pr,.ownr{font-size:.74cqw}
.ownr i{width:.65cqw;height:.65cqw}

.lvb{font-size:.58cqw}
.cap{font-size:.58cqw}
.corner .nm{font-size:1.05cqw}
.corner .pr{font-size:.74cqw}
.sq .pawn{width:1.5cqw;height:1.5cqw;font-size:.78cqw}
.imp-pill{font-size:.7cqw}
.sq.g.b::before,.sq.g.t::before{height:.38cqw}
.sq.g.l::before,.sq.g.r::before{width:.38cqw}
.c-head .gtitle h1{font-size:1.9cqw}
.c-head .gtitle img.awsi{width:2.6cqw;height:2.6cqw}
.sq.l,.sq.r{flex-direction:column;justify-content:center;padding:.5cqw .3cqw;gap:.25cqw}
.sq.l .txt,.sq.r .txt{align-items:center}
.sq.l .nm,.sq.r .nm{text-align:center}
.sq.l .art img.awsi,.sq.r .art img.awsi{width:3.1cqw;height:3.1cqw}
/* 中央三栏 */
#center{grid-template-rows:auto minmax(0,1fr) auto}
.cmain{display:grid;grid-template-columns:1fr 1.5fr 1fr;gap:1.4cqw;align-items:center;min-height:0}
.cleft,.cright{align-self:stretch;display:flex;flex-direction:column;gap:10px;justify-content:center}
.stack{position:relative;display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);background:#fff;box-shadow:3px 3px 0 #fff,4px 4px 0 var(--line),7px 7px 0 #fff,8px 8px 0 var(--line)}
.stack img.awsi{width:36px;height:36px}
.stack b{font-size:14px}
.stack span{margin-left:auto;font-size:12px;color:var(--mut)}
.lastcard{border:1px solid var(--line);border-left:4px solid #8c4fff;padding:8px 10px;font-size:12px;line-height:1.5;background:#fafafa;display:flex;flex-direction:column;gap:2px}
.lastcard.inc{border-left-color:#e7157b}
.lastcard small{color:var(--mut2)}
.lastcard b{font-size:14px}
.cright{border-left:1px solid var(--line2);padding-left:1.2cqw}
.cright h4{margin:0 0 4px;font-size:14px}
.cright h5{margin:8px 0 2px;font-size:12px;color:var(--mut)}
.cright .kv{display:flex;justify-content:space-between;font-size:13px}
.cright .ap{font-size:12.5px;line-height:1.45}
.potline{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--mut)}
.potline img.awsi{width:20px;height:20px}
.potline b{color:#d13212}
.lower{display:grid!important;gap:1.4cqw}
.recent{font-size:12.5px;line-height:1.5;color:var(--mut)}
.recent h4{margin:0 0 4px;font-size:13px;color:var(--ink)}
.recent div:nth-child(2){color:var(--ink);font-weight:600}
.lower .legend{border-top:0;padding-top:0;align-content:flex-start;flex-wrap:wrap;gap:6px 14px}
.decks{display:none}
.lower{grid-template-columns:1fr!important}
[data-arch]{cursor:help}
#archtip{position:fixed;z-index:30;background:#fff;border:1px solid #879596;box-shadow:0 4px 18px rgba(0,28,36,.25);padding:10px 12px;max-width:440px;pointer-events:none}
#archtip[hidden]{display:none}
.amini b{font-size:13px}
.aflow{display:flex;align-items:center;flex-wrap:wrap;gap:4px;margin:8px 0 6px}
.an{display:inline-flex;flex-direction:column;align-items:center;gap:3px;padding:4px;border:1px solid transparent;min-width:58px}
.an img.awsi{width:34px;height:34px}
.an em{font-style:normal;font-size:11px;color:#16191f;text-align:center}
.an.miss{border:1px dashed #879596}
.an.miss img.awsi{filter:grayscale(1);opacity:.4}
.an.miss em{color:#879596}
.aor{display:inline-flex;align-items:center;gap:2px}
.aor i{font-style:normal;font-size:11px;color:#879596}
.aar{color:#545b64;font-weight:700}
.adesc{font-size:12px;color:#545b64;line-height:1.5}
.potline{max-width:420px;text-align:left}
.potline .pl1{white-space:nowrap;flex:none}

/* ===== 开局页：深色科技底 + 架构图风格 ===== */
#setup{min-height:100vh;display:grid;grid-template-columns:minmax(0,1fr) minmax(520px,660px);gap:40px;align-items:center;padding:40px clamp(24px,5vw,72px)}
#setup{background-color:#0f1724;background-image:linear-gradient(rgba(255,255,255,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.04) 1px,transparent 1px);background-size:32px 32px}
.hero{color:#e9edf2;max-width:760px}
.hero .htab{display:inline-flex;align-items:center;gap:8px;border:1px solid rgba(255,255,255,.35);padding:0 12px 0 0;font-size:12px;font-weight:700;letter-spacing:.18em;color:#ffb36b}
.hero .htab img.awsi{width:28px;height:28px}
.hero h1{font-size:clamp(34px,3.4vw,52px);line-height:1.12;margin:18px 0 8px;font-weight:800;letter-spacing:.01em;color:#fff}
.hero .lead{font-size:16px;line-height:1.7;color:#b8c2cf;margin:0;max-width:600px}
.hero .stats{display:flex;flex-wrap:wrap;gap:0;margin:26px 0 30px;border:1px solid rgba(255,255,255,.18)}
.hero .stats div{flex:1 1 90px;padding:12px 14px;border-right:1px solid rgba(255,255,255,.12)}
.hero .stats div:last-child{border-right:0}
.hero .stats b{display:block;font:700 26px/1.1 "SF Mono",Menlo,ui-monospace,monospace;color:#fff;font-variant-numeric:tabular-nums}
.hero .stats span{font-size:12px;color:#93a1b1}
.hero .diag{position:relative;border:1px solid rgba(255,255,255,.3);padding:34px 18px 18px;background:rgba(255,255,255,.02)}
.hero .diag>.gt{position:absolute;top:-1px;left:-1px;display:flex;align-items:center;gap:6px;background:#0f1724;border:1px solid rgba(255,255,255,.3);padding:0 10px 0 0;font-size:12px;font-weight:700;color:#cfd6df}
.hero .diag>.gt img.awsi{width:24px;height:24px}
.hero .flow{display:flex;flex-wrap:nowrap;align-items:flex-start;justify-content:space-between;gap:4px}
.hero .node{flex:1 1 0;min-width:0;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;font-size:12px;color:#cfd6df}
.hero .node img.awsi{width:44px;height:44px}
.hero .node span{white-space:nowrap}
.hero .link{flex:0 1 48px;min-width:12px;height:2px;margin-top:21px;background:repeating-linear-gradient(90deg,#ffb36b 0 6px,transparent 6px 12px);background-size:24px 2px;animation:hflow 1.2s linear infinite;opacity:.8}
@keyframes hflow{to{background-position:24px 0}}
@media (prefers-reduced-motion:reduce){.hero .link{animation:none}}
.hero .cats{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:10px;margin-top:22px}
.hero .cat{white-space:nowrap;display:flex;align-items:center;gap:8px;border:1px solid rgba(255,255,255,.14);padding:7px 8px;font-size:12px;color:#cfd6df;border-left:3px solid var(--gc)}
.hero .cat img.awsi{width:22px;height:22px;flex:none}
.setup-box{border:0;border-radius:0;padding:28px 32px;width:100%;box-shadow:0 0 0 1px rgba(255,255,255,.08),0 12px 32px rgba(0,0,0,.35);position:relative}
.setup-box::before{content:'';position:absolute;left:0;top:0;right:0;height:3px;background:var(--orange)}
.setup-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.setup-head h2{margin:0;font-size:20px}
.setup-head .muted{font-size:12.5px}
#resume .btns{margin:14px 0 0!important}
#resume button{width:100%}
.sec h5{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.sec h5 i{font:700 12px "SF Mono",Menlo,monospace;font-style:normal;color:#fff;background:var(--ink2);padding:2px 6px}
.sec h5 .muted{font-size:12px;font-weight:400}
.tile{border-width:1px;border-radius:2px;padding:11px 13px 11px 38px}
.tile::before,.tile.ck::before{box-sizing:border-box;width:16px;height:16px;top:13px;left:13px;border-width:2px}
.tile:has(>input:checked){box-shadow:inset 0 0 0 1px var(--blue)}
.tile:has(>input:checked)::before{border-width:5px}
.tile.ck:has(>input:checked)::before{border-width:2px}
.tiles.win,.tiles.win:has(#winRounds){grid-template-columns:repeat(3,1fr)}
.tiles.np{grid-template-columns:repeat(3,1fr)}
@media (max-width:1220px){#setup{grid-template-columns:1fr;justify-items:center}.hero{max-width:660px;width:100%}}
@media (max-width:700px){.tiles.win,.tiles.win:has(#winRounds){grid-template-columns:1fr}#setup{grid-template-columns:1fr}.setup-box{min-width:0}.hero .flow .node:nth-child(n+7){display:none}}

/* ===== UI/UX 润色 ===== */
/* 棋盘格：计费类型在文字流里，最小字号 */
.bill{position:static!important;display:block;font-size:max(.58cqw,8px)!important;color:var(--mut2);line-height:1.2;margin-top:.15cqw}
.nm{font-size:max(.98cqw,10px)}
.ownr{max-width:100%;overflow:hidden;text-overflow:ellipsis}
/* 小屏：侧栏变窄，棋盘让出宽度；棋盘太小时藏次要信息 */
@media (max-width:1500px){#side{width:300px}#board{width:min(calc((100vh - 88px)*1.345),calc(100vw - 390px));min-width:0}}
@container (max-width:1100px){.bill{display:none!important}.lower{display:none!important}.cright h5,.cright .ap .muted{display:none}}
/* 侧栏：日志固定在底部；非当前玩家折叠次要信息，悬停展开 */
#side{position:relative}
.logpanel{position:sticky;bottom:0;z-index:2;background:#fff;box-shadow:0 -6px 12px rgba(255,255,255,.9)}
.logpanel .log{max-height:170px}
.pl:not(.cur):not(:hover) .role,.pl:not(.cur):not(:hover) .arch .ap:not(.done){display:none}
.pl.cur .arch{display:none}
.pl .now{color:#c45500}
/* 中间操作区 */
.stage .row.more{display:grid;grid-template-columns:repeat(2,minmax(120px,1fr));gap:8px;width:min(100%,320px)}
.stage .row.more button{width:100%}
.stack b,.stack span{white-space:nowrap}
.die{width:clamp(48px,4.6cqw,72px);height:clamp(48px,4.6cqw,72px)}
.stage .who{font-size:clamp(17px,1.6cqw,22px)}
.stage{gap:clamp(10px,1.2cqw,18px)}
.potbox{display:flex;align-items:center;gap:8px;border:1px solid var(--line);padding:8px 12px;background:#fff;cursor:help}
.potbox img.awsi{width:28px;height:28px}
.potbox span{font-size:13px;color:var(--mut)}
.potbox b{margin-left:auto;font:700 20px/1 "SF Mono",Menlo,ui-monospace,monospace;color:#d13212;font-variant-numeric:tabular-nums}
.meta{align-items:center;flex-wrap:wrap;justify-content:flex-end}
.meta .gap{width:10px}
button.ghost{border-color:transparent;background:transparent}
button.ghost:hover{border-color:var(--line)}
button.danger-lite{color:var(--red);border-color:var(--line)}
button.danger-lite:hover:not(:disabled){border-color:var(--red)}
/* 对比度：小号灰字加深 */
.aar,.aor i,.an.miss em,.arr,.or{color:#687078!important}
.grp>.gt{color:color-mix(in srgb,var(--gc,#232f3e) 72%,#000)}
/* 弹窗：标题和按钮栏固定，长内容滚动时也看得到 */
.box h3{position:sticky;top:0;background:#fff;z-index:1}
.box .btns{position:sticky;bottom:0;background:#fff;z-index:1}
.box.quiz .btns button{width:100%}

/* 牌堆做成竖版卡牌 */
.cleft{display:grid!important;grid-template-columns:1fr 1fr;gap:14px 16px;align-content:center}
.cleft .stack{flex-direction:column;justify-content:center;align-items:center;aspect-ratio:5/7;max-height:22cqw;text-align:center;gap:.6cqw;padding:.8cqw;border-top:4px solid var(--sc,#232f3e)}
.cleft .stack.inc{--sc:#e7157b}
.cleft .stack img.awsi{width:clamp(30px,3.6cqw,52px);height:clamp(30px,3.6cqw,52px)}
.cleft .stack b{font-size:clamp(12px,1.05cqw,15px)}
.cleft .stack span{margin-left:0;font-size:clamp(11px,.85cqw,13px)}
.cleft .potbox,.cleft .lastcard{grid-column:1/-1}

/* 联机 */
.mpbtns{display:flex;gap:8px;flex-wrap:wrap}
.mpform{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.mpform label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--mut)}
.mpform input{font:inherit;border:1px solid #aab7b8;border-radius:2px;padding:5px 8px}
#mpstat{margin-top:10px;font-size:13px}
#mpstat .ok{color:var(--green)}
.mproom{display:flex;gap:12px;align-items:baseline;flex-wrap:wrap}
.mproom b{font:700 22px "SF Mono",Menlo,monospace;letter-spacing:.12em;color:var(--ink2)}
.mpseats{margin:8px 0 0;padding-left:18px;font-size:13px;line-height:1.8}
.box.mpwait .btns button,.box.mpwait [data-v]{opacity:.55}
.mpnote{display:flex;align-items:center;gap:10px;justify-content:space-between;background:#f1faff;border-bottom:1px solid #b8d7f0;color:#0b4f8a;font-size:13px;padding:8px 20px}
.mpme{color:var(--blue);font-weight:700}



/* 已下线、总资产 */
.sq.offline .art img{opacity:.35;filter:grayscale(1)}
.sq.offline .ownr{color:#687078}
.svc.off img{opacity:.35;filter:grayscale(1)}
.pacc .cash{display:flex;flex-direction:column;align-items:flex-end;line-height:1.15}
.pacc .cash small{font-size:11px;font-weight:400;color:var(--mut2)}
.pacc .cash small.nw{font-size:12px;color:var(--ink2);font-weight:600;margin-top:2px}

/* 高可用标签 */
.hatag{display:flex;gap:10px;align-items:baseline;border:1px solid var(--line);border-left:4px solid #1d8102;background:#f5fbf3;padding:6px 10px;margin:8px 0;font-size:13px}
.hatag b{white-space:nowrap;color:#1d8102}
.hatag span{color:var(--mut)}
.hatag.diy{border-left-color:#ec7211;background:#fff8f1}.hatag.diy b{color:#c45500}
.hatag.single{border-left-color:#d13212;background:#fdf3f1}.hatag.single b{color:#d13212}
.hatag.glb{border-left-color:#0972d3;background:#f1faff}.hatag.glb b{color:#0972d3}
.hatag-s{font-size:12px;font-weight:700;white-space:nowrap;color:#1d8102}
.hatag-s.diy{color:#c45500}.hatag-s.single{color:#d13212}.hatag-s.glb{color:#0972d3}

.bill.ha-auto{color:#1d8102!important;font-weight:600}
.bill.ha-glb{color:#0972d3!important;font-weight:600}
.bill.ha-diy{color:#c45500!important}
.bill.ha-single{color:#d13212!important}
.lg-ha{font-size:12px;font-weight:700;margin-right:4px}.lg-ha.auto{color:#1d8102}.lg-ha.diy{color:#c45500}.lg-ha.single{color:#d13212}
/* ===== 外圈格子加大、留白加大 ===== */
#board{grid-template-columns:1.75fr repeat(13,1fr) 1.75fr;grid-template-rows:1.75fr repeat(9,1fr) 1.75fr;aspect-ratio:16.5/12.5;width:min(calc((100vh - 92px) * 1.32),calc(100vw - 460px))}
#side{width:350px}
@media (max-width:1500px){#side{width:300px}#board{width:min(calc((100vh - 92px) * 1.32),calc(100vw - 400px))}}
.sq{padding:.9cqw .55cqw .8cqw;gap:.4cqw}
.sq.l,.sq.r{flex-direction:row;justify-content:flex-start;align-items:center;padding:.5cqw 1.1cqw;gap:.9cqw}
.sq.l .txt,.sq.r .txt{align-items:flex-start}
.sq.l .nm,.sq.r .nm{text-align:left}
.sq.corner{padding:1cqw;gap:.45cqw}
.art img.awsi{width:3.9cqw;height:3.9cqw}
.sq.l .art img.awsi,.sq.r .art img.awsi{width:3.2cqw;height:3.2cqw}
.corner .art img.awsi{width:4.8cqw;height:4.8cqw}
.txt{gap:.25cqw}
.nm{font-size:max(.92cqw,10px);line-height:1.2}
.sq.l .nm,.sq.r .nm{font-size:max(.86cqw,9px)}
.corner .nm{font-size:1.15cqw}
.sq.g.b::before,.sq.g.t::before{height:.45cqw}
.sq.g.l::before,.sq.g.r::before{width:.45cqw}
#center{padding:2.4cqw 2.8cqw}


/* 棋盘比较窄时，左右两列的格子改回上下排，名字才放得下 */
@container (max-width:1150px){
  .sq.l,.sq.r{flex-direction:column;justify-content:center;align-items:center;padding:.4cqw .5cqw;gap:.2cqw}
  .sq.l .txt,.sq.r .txt{align-items:center}
  .sq.l .nm,.sq.r .nm{text-align:center}
  .sq.l .art img.awsi,.sq.r .art img.awsi{width:2.7cqw;height:2.7cqw}
  .sq.l .pr,.sq.r .pr{display:none}
}
/* 铺满整个窗口：棋盘吃掉除侧栏外的全部空间，格子跟着变大 */
@media (min-width:1201px){
  #game{display:grid;grid-template-columns:minmax(0,1fr) 360px;height:100vh;padding:12px;gap:14px;align-items:stretch;overflow:hidden}
  .frame{height:calc(100vh - 24px);display:flex;flex-direction:column;min-width:0}
  #board{width:100%;flex:1;aspect-ratio:auto;min-height:0;min-width:0}
  #side{width:auto;max-height:calc(100vh - 24px);overflow:auto}
}
@media (min-width:1201px) and (max-width:1500px){#game{grid-template-columns:minmax(0,1fr) 300px}}

/* ===== 第三轮润色 ===== */
/* 侧栏：玩家卡单独滚动，日志固定在底部 */
@media (min-width:1201px){
  #side{display:flex!important;flex-direction:column;gap:12px;overflow:hidden!important;padding:0}
  #side .plist{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;gap:14px;padding:6px 6px 6px 2px}
  #side .logpanel{flex:none;position:relative!important;bottom:auto;box-shadow:none;max-height:30vh;display:flex;flex-direction:column}
  #side .logpanel .gb{min-height:0;overflow:auto}
  #side .logpanel .log{max-height:none}
}
@media (max-width:1200px){#side .plist{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px;grid-column:1/-1}}
/* 回合顺序条 */
.turnbar{display:flex;align-items:center;flex-wrap:wrap;gap:6px;margin:.4cqw 0 0;padding:6px 0 10px;border-bottom:1px solid var(--line2)}
.turnbar .tb{display:inline-flex;align-items:center;gap:6px;padding:4px 10px 4px 6px;border:1px solid var(--line);background:#fff;font-size:13px;white-space:nowrap}
.turnbar .tb b{font-weight:700}
.turnbar .tb i{font-style:normal;color:var(--mut);font-variant-numeric:tabular-nums}
.turnbar .tb em{font-style:normal;font-size:11px;color:var(--red);margin-left:2px}
.turnbar .tb.cur{border-color:var(--orange);box-shadow:inset 0 -3px 0 var(--orange)}
.turnbar .tb.dead{opacity:.45}
.turnbar .tbar{color:#aab7b8;font-size:12px}
.turnbar .pawn{width:18px;height:18px;font-size:10px}
/* 上下两排格子：内容别挤到底部色条上 */
.sq.t,.sq.b{justify-content:flex-start;padding-top:.8cqw}
.sq.t .art img.awsi,.sq.b .art img.awsi{width:3.4cqw;height:3.4cqw}
.sq.t .txt,.sq.b .txt{gap:.15cqw}
.sq.g.t{padding-bottom:1cqw}
.sq.g.b{padding-top:1.2cqw}
#center{grid-template-rows:auto auto minmax(0,1fr) auto}
/* ===== 平板和手机（联机时常用手机加入） ===== */
@media (max-width:1200px){
  #side{width:100%!important;max-height:none;display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px;position:static}
  #board{width:min(calc(100vw - 64px),calc((100vh - 88px) * 1.345))!important;min-width:0!important}
  .frame{max-width:100%}
  .logpanel{position:relative;bottom:auto;box-shadow:none}
}
@media (max-width:900px){
  #game{padding:8px;gap:12px}
  .frame{padding:34px 6px 6px;width:100%}
  #board{--cw:calc((100vw - 34px) / 15.6);width:100%!important;aspect-ratio:auto!important;grid-template-rows:calc(var(--cw) * 1.3) repeat(9,var(--cw)) calc(var(--cw) * 1.3) auto!important;grid-template-columns:calc(var(--cw) * 1.3) repeat(13,var(--cw)) calc(var(--cw) * 1.3)!important}
  #center,#center *{min-width:0}
  .sq{min-width:0;overflow:hidden}
  #center{grid-row:12!important;grid-column:1/-1!important;border-left:1px solid var(--line);padding:12px!important;gap:12px!important}
  .sq{position:relative;padding:1px!important;gap:0!important;flex-direction:column!important;justify-content:center!important;align-items:center!important}
  .sq .txt,.sq .bill,.sq .lv,.corner .nm,.corner .pr{display:none!important}
  .sq .art img.awsi,.sq.l .art img.awsi,.sq.r .art img.awsi{width:calc(var(--cw) * .7)!important;height:calc(var(--cw) * .7)!important}
  .sq.owned::after{content:'';position:absolute;left:0;right:0;bottom:0;height:3px;background:var(--oc)}
  .sq.g::before{display:none}
  .toks .pawn{width:12px;height:12px;font-size:8px}
  .c-head{flex-direction:column;gap:8px}
  .c-head .gtitle h1{font-size:18px!important}
  .c-head .sub{font-size:12px}
  .cmain{display:flex!important;flex-direction:column;gap:14px}
  .cleft{grid-template-columns:1fr 1fr!important}
  .cleft .stack{aspect-ratio:auto;max-height:none;flex-direction:row;flex-wrap:wrap;justify-content:flex-start;padding:10px;gap:4px 8px}
  .cleft .stack span{flex-basis:100%;padding-left:38px}
  .cleft .stack img.awsi{width:30px;height:30px}
  .cleft .stack b{font-size:13px}.cleft .stack span{font-size:12px}
  .stage .who{font-size:18px}.stage .st{font-size:13px}
  .stage .row.more{width:100%}
  .cright{font-size:13px}
  .lower{display:none!important}
  #side{grid-template-columns:1fr}
  .cmain .stage{order:-1}
  .c-head .gtitle h1{font-size:16px!important}
  .turnbar{order:0}
  .box{max-height:88vh}
  .box .mb{padding:12px 14px 4px}
}
@media (max-width:700px){
  #setup{padding:20px 14px;gap:20px}
  #setup>*{min-width:0}
  .hero h1{font-size:30px}
  .hero .stats div{flex:1 1 30%}
  .hero .flow .link:nth-of-type(n+4),.hero .flow .node:nth-of-type(n+4){display:none}
  .setup-box{padding:20px 16px}
  .tiles.np{grid-template-columns:repeat(3,1fr)}
  .hero .diag{display:none}
  .hero .stats{margin:18px 0 0}
}

/* 触屏：按钮做大一点，好点 */
@media (pointer:coarse){button{min-height:40px}button.sm{min-height:34px;padding:4px 12px}.tile{padding-top:14px;padding-bottom:14px}}
</style>
</head>
<body>

<div id="setup">
  <section class="hero" id="hero"></section>
  <div class="setup-box">
    <div class="setup-head"><h2>新建一局</h2><span class="muted">四步设置，随时可以点「先看玩法」</span></div>
    <div id="resume"></div>
    <div class="sec">
      <h5><i>01</i>玩家</h5>
      <div class="tiles np">
        <label class="tile"><input type="radio" name="np" value="2" onchange="renderNames()"><b>2 人</b></label>
        <label class="tile"><input type="radio" name="np" value="3" checked onchange="renderNames()"><b>3 人</b></label>
        <label class="tile"><input type="radio" name="np" value="4" onchange="renderNames()"><b>4 人</b></label>
      </div>
      <div class="names" id="names"></div>
    </div>
    <div class="sec">
      <h5><i>02</i>难度</h5>
      <div class="tiles">
        <label class="tile"><input type="radio" name="diff" value="basic"><b>入门局</b><span>基础规则、释放服务、运行费与请求费、维护窗口与复盘、Spot 购买</span></label>
        <label class="tile"><input type="radio" name="diff" value="std" checked><b>标准局</b><span>再加升级附加费、技术债、新账号保护期、季度财报、服务停止支持</span></label>
        <label class="tile"><input type="radio" name="diff" value="full"><b>完整局</b><span>再加主动行动、完整交易、Savings Plans / RI、托管</span></label>
      </div>
    </div>
    <div class="sec">
      <h5><i>03</i>胜利条件<span class="muted">可以多选，谁先达成谁赢。经典胜利（只剩一个人没破产）一直生效</span></h5>
      <div class="tiles win">
        <label class="tile ck"><input type="checkbox" id="winWA"><b>Well-Architected</b><span>谁先凑齐六大支柱谁赢</span></label>
        <label class="tile ck"><input type="checkbox" id="winRounds" checked><b>轮数上限</b><span>打满 <input type="number" id="rounds" value="30" min="5" max="200" aria-label="轮数"> 轮按估值排名</span></label>
        <label class="tile ck"><input type="checkbox" id="winTimed"><b>限时</b><span><input type="number" id="minutes" value="90" min="5" max="600" aria-label="分钟数"> 分钟到了按估值算分</span></label>
      </div>
    </div>
    <div class="sec mp">
      <h5><i>04</i>联机<span class="muted">可选：每人用自己的电脑或手机操作，画面实时同步；不联机就在这台电脑上轮流玩</span></h5>
      <div id="mpbox" class="mpbtns"><button onclick="mpUI('host')">创建房间</button><button onclick="mpUI('join')">加入房间</button></div>
    </div>
    <label class="switch"><input type="checkbox" id="learn"><span class="tg"></span><b>学习模式</b><span class="muted">付过路费、买地产时答亚马逊云科技题</span></label>
    <div class="btns end"><button class="lg" onclick="showManual()">先看玩法</button><button class="pri lg" id="startBtn" onclick="startFromSetup()">开始游戏</button></div>
  </div>
</div>

<div id="game" hidden>
  <div class="frame"><div id="board"></div></div>
  <aside id="side"></aside>
</div>

<div id="modal" class="modal" hidden><div class="box"></div></div>
<div id="err"></div>
<pre id="botout" hidden></pre>

    }

    let finished = false;

// ================= 移动 =================
async function moveSteps(p, n) {
  const dir = n > 0 ? 1 : -1;
  for (let k = 0; k < Math.abs(n); k++) {
    p.pos = (p.pos + dir + N) % N;
    S.lastSq = p.pos;
    if (dir > 0 && p.pos === 0) await passLaunch(p);
    // 经过 UG 活动（没停在上面）领取 $50
    if (dir > 0 && SQ[p.pos].t === 'free' && k < Math.abs(n) - 1) { credit(p, 50); log(`👥 ${nm(p)} 经过 UG 活动，领取 $50`); }
    render(); await sleep(100);
  }
}
async function moveTo(p, target) { await moveSteps(p, (target - p.pos + N) % N); }
function sendToJail(p, cat) { p.pos = IX.jail; p.jail = 0; p.jailCat = cat; S.lastSq = IX.jail; S.again = false; log(`🚨 ${nm(p)} 进了维护窗口`); }
async function passLaunch(p) {
  const credits = S.round <= (BAL.creditRounds || 999);
  let g = credits ? BAL.salary : (BAL.salaryLate ?? BAL.salary);
  if (p.role === 'garage' && credits) g += 50;
  if (hasCombo(p, 'lake')) g += 50;
  credit(p, g);
  const oc = opCost(p);
  if (oc) pay(p, 'bank', oc); if (S.stats) { S.stats.run += oc; S.stats.salary += g; }
  if (p.commits && p.commits.length) {
    p.commits.forEach(c => { if (c.laps > 0) c.laps--; });
    p.commits.filter(c => c.laps === 0 && !c.done).forEach(c => { c.done = true; log(`📄 ${nm(p)} 的${c.type === 'sp' ? ' Savings Plans' : ` ${SQ[c.svc].n} RI`} 到期了`); });
    p.commits = p.commits.filter(c => c.laps > 0);
  }
  log(`🚀 ${nm(p)} 经过 Startup 扶持，领 $${g} Credits${oc ? `，交运行费 $${oc}` : ''}`);
  const ref = S.players.find(q => q.alive);
  if (F.balance() && ref && ref.id === p.id) { S.quarterCount++; if (S.quarterCount % 3 === 0) await quarterly(); }
}

function rollDice(p) {
  const d = [1 + rnd(6), 1 + rnd(6)];
  S.lastDice = d; S.rollId = (S.rollId || 0) + 1;
  log(`🎲 ${nm(p)} 掷出 ${d[0]} + ${d[1]} = ${d[0] + d[1]}${d[0] === d[1] ? '（对子）' : ''}`);
  return d;
}
async function doRoll() {
  if (!S || S.phase !== 'roll') return;
  const p = cur(); if (p.jail !== null) return;
  S.phase = 'busy'; render();
  try {
    const d = rollDice(p), dbl = d[0] === d[1];
    if (dbl) S.doubles++;
    if (dbl && S.doubles >= 3) { log('连掷 3 次对子：API 被限流'); sendToJail(p, 'avail'); }
    else { await moveSteps(p, d[0] + d[1]); await land(p); S.again = dbl && p.jail === null && p.alive; }
  } catch (e) { reportErr(e); }
  await afterAction();
}
async function jailAct(kind) {
  if (!S || S.phase !== 'roll') return;
  const p = cur(); if (p.jail === null) return;
  S.phase = 'busy'; render();
  try {
    if (kind === 'pay') { pay(p, 'pot', 50); await leaveJail(p, '付 $50 开 Support Case'); await resolveDebts(); S.phase = 'roll'; save(); render(); return; }
    if (kind === 'es') { const c = availCard(p, 'ES'); if (c) { c.used = true; await leaveJail(p, '用掉 Enterprise Support'); } S.phase = 'roll'; save(); render(); return; }
    const d = rollDice(p);
    if (d[0] === d[1]) { await leaveJail(p, '掷出对子'); await moveSteps(p, d[0] + d[1]); await land(p); }
    else {
      p.jail++;
      const max = p.role === 'legacy' ? 4 : 3;
      if (p.jail >= max) { pay(p, 'pot', 50); await leaveJail(p, `停满 ${max} 轮，强制付 $50`); await moveSteps(p, d[0] + d[1]); await land(p); }
      else log(`${nm(p)} 没掷出对子，还在维护窗口（第 ${p.jail}/${max} 次）`);
    }
    S.again = false;
  } catch (e) { reportErr(e); }
  await afterAction();
}

async function afterAction() {

async function nextTurn() {

  let n = S.cur;

}

  ownedBy(p).forEach(i => { const pr = S.props[i]; if (pr.offline > 1) pr.offline--; else if (pr.offline === 1) bringOnline(p, i, true); });
  if (p.skip > 0) { p.skip--; log(`⏸ ${nm(p)} 停一轮`); S.phase = 'busy'; render(); await sleep(600); return nextTurn(); }

async function uiAction(fn) {
  if (!S || (S.phase !== 'roll' && S.phase !== 'post')) return;
  const prev = S.phase; S.phase = 'busy'; render();
  try { await fn(); } catch (e) { reportErr(e); }
  await resolveDebts();

  if (!cur().alive) return nextTurn();

}

function saTarget(p) {
  const cands = [];
  COMBOS.forEach(c => {
    if (!c.ix.flat().some(i => owns(p, i))) return;
    c.ix.forEach(n => (Array.isArray(n) ? n : [n]).forEach(i => { if (S.props[i].owner === null) cands.push(i); }));
  });
  const dist = i => (i - p.pos + N) % N || N;
  if (cands.length) return cands.sort((a, b) => dist(a) - dist(b))[0];
  const free = OWNABLE.filter(i => S.props[i].owner === null).sort((a, b) => dist(a) - dist(b));
  return free.length ? free[0] : null;
}

function autoLiquidate(p) {

}

async function bankrupt(p) {

  if (v === 'x') return;
  p.commits = commitsOf(p);
  if (v === 'sp1' || v === 'sp3') {
    const n = v === 'sp1' ? 1 : 3, amt = spAmt(n);
    p.commits.push({ type: 'sp', laps: n, d: SP_PLANS[n], amt, scope: n === 3 ? 'compute' : 'all' }); p.usedCommit = true;
    log(`📄 ${nm(p)} 签了 ${n} 年（${n} 圈）Savings Plans：每圈承诺 $${amt}，抵扣原价 $${spScope(r, n)} 的运行费`);
    return;
  }
  const i = riCand.length === 1 ? riCand[0] : await ask({ title: '给哪块服务买 RI？', buttons: riCand.map(x => ({ label: `${SQ[x].n}（每圈 $${runCost(x)}）`, value: x })) });
  const rc = runCost(i);
  const n = await ask({ title: `${SQ[i].n} 的 RI 买几年？`, html: `<p>这块现在每圈运行费 $${rc}，1 圈算 1 年。</p>`, buttons: [1, 3].map((k, m) => { const c = Math.round(rc * k * (1 - RI_PLANS[k])); return { label: `${k} 年（${k} 圈），预付 $${c}（省 ${RI_PLANS[k] * 100}%）`, value: k, cls: m ? '' : 'pri', disabled: p.cash < c }; }).concat([{ label: '取消', value: 0 }]) });
  if (!n) return;
  const cost = Math.round(rc * n * (1 - RI_PLANS[n])); if (p.cash < cost) return;
  pay(p, 'bank', cost); p.commits.push({ type: 'ri', svc: i, laps: n, amt: rc }); p.usedCommit = true;
  log(`📄 ${nm(p)} 预付 $${cost} 给 ${sqn(i)} 买了 ${n} 年（${n} 圈）RI：每圈 $${rc} 的运行费全免`);
}

// ================= 胜利 =================
const PILLARS = ['卓越运营', '安全', '可靠性', '性能效率', '成本优化', '可持续性'];
const PILLAR_TIP = ['持有 CloudWatch、CloudTrail、Step Functions、EventBridge 任一块，或者写过复盘', '持有任一块安全合规组或边缘防护组服务，或者有演练标记', '有一处多 AZ 升级或多区域功能', '有一处弹性扩展功能，或者组成了任一个有效架构', '满足任一条：没有技术债；主动释放或下线过服务；签过 Savings Plans / RI 或用过 Cost Explorer；有降成本功能', '持有一块 Serverless 服务，或者 EC2 升到了 Graviton']
// 六大支柱：每条满足任意一个条件就算达成（太难凑会让 Well-Architected 胜利很少触发）
function pillarParts(p) {
  const has = list => list.filter(i => active(p, i));
  const effList = eff => ownedBy(p).filter(i => effActive(i, eff));
  const ops = has([IX.cloudwatch, IX.cloudtrail, IX.sfn, IX.eventbridge]);
  const secs = has([...GRP('sec'), ...GRP('edge')]);
  const maz = effList('maz'), mr = effList('mr'), sc = effList('scale'), co = effList('cost');
  const combos = COMBOS.filter(c => hasCombo(p, c.id));
  const sls = ownedBy(p).filter(i => SQ[i].type === 'sls' && !S.props[i].offline);
  const grav = owns(p, IX.ec2) && effActive(IX.ec2, 'cost');
  const cost = [p.techDebt === 0 ? '没有技术债' : '', p.released || p.wentOffline ? '主动释放或下线过不用的服务' : '', (p.usedCommit || p.cards.some(x => x.used && (x.id === 'SP' || x.id === 'CE'))) ? '签过 Savings Plans / RI 或用过 Cost Explorer' : '', co.length ? co.map(i => SQ[i].n).join('、') + ' 有降成本功能' : ''].filter(Boolean);
  return { ops, secs, maz, mr, sc, combos, sls, grav, cost };
}
function pillars(p) {
  const x = pillarParts(p);
  return [x.ops.length > 0 || p.coe.length > 0, x.secs.length > 0 || p.drill.length > 0, x.maz.length > 0 || x.mr.length > 0, x.sc.length > 0 || x.combos.length > 0, x.cost.length >= 1, x.sls.length > 0 || x.grav];
}
function pillarWhy(p) {
  const names = list => list.map(i => SQ[i].n).join('、');
  const x = pillarParts(p), ok = pillars(p);
  return [
    ok[0] ? (x.ops.length ? `有 ${names(x.ops)}` : `写过 ${p.coe.length} 次复盘`) : '还差：持有 CloudWatch、CloudTrail、Step Functions、EventBridge 任一块，或者写一次复盘',
    ok[1] ? (x.secs.length ? `有 ${names(x.secs)}` : `有 ${p.drill.length} 个演练标记`) : '还差：持有任一块安全合规组或边缘防护组服务，或者做一次 GameDay 演练',
    ok[2] ? (x.mr.length ? `${names(x.mr)} 有多区域功能` : `${names(x.maz)} 是多 AZ`) : '还差：一处多 AZ 升级或一处多区域功能',
    ok[3] ? (x.sc.length ? `${names(x.sc)} 有弹性扩展功能` : `组成了「${x.combos[0].n}」架构`) : '还差：一处弹性扩展功能（Auto Scaling、并发配额等），或者组成任一个有效架构',
    ok[4] ? `满足了：${x.cost.join('；')}` : '还差：没有技术债、主动释放或下线过服务、签过 Savings Plans / RI、有降成本功能，满足任一条',
    ok[5] ? (x.sls.length ? `有 ${names(x.sls)} 这样的 Serverless 服务` : 'EC2 用上了 Graviton') : '还差：持有一块 Serverless 服务，或者给 EC2 升到 Graviton',
  ];
}
function checkOverSilent() { return S.players.filter(q => q.alive).length <= 1; }
function checkOver() {
  if (S.over) return true;
  const alive = S.players.filter(q => q.alive);
  if (alive.length <= 1) { gameOver(alive[0], '其他玩家都被暂停了账号'); return true; }
  return false;
}
function gameOver(w, why) {
  S.over = true; S.phase = 'over'; S.winner = w ? w.id : null;
  if (w) log(`🏆 ${nm(w)} 获胜：${why}`);
  try { localStorage.removeItem(KEY); } catch (e) { }
  render();
  const rank = [...S.players].sort((a, b) => valuation(b) - valuation(a));
  info(`${w ? w.name + ' 获胜' : '游戏结束'}`, `<p>${why}</p><table><tr><th>玩家</th><th>状态</th><th>估值</th></tr>${rank.map(q => `<tr><td>${nm(q)}</td><td>${q.alive ? '在线' : '已暂停'}</td><td>$${valuation(q)}</td></tr>`).join('')}</table>`);
}
function timedOver(why = '时间到') { const alive = S.players.filter(q => q.alive).sort((a, b) => valuation(b) - valuation(a)); gameOver(alive[0], `${why}，按估值算分（$${valuation(alive[0])}）`); }

const MANUAL_HTML = "<h2 style=\"margin:0 0 8px\">亚马逊云科技大富翁 · 玩法手册</h2><p class=\"muted\">这本手册讲怎么上手玩，十分钟读完。每条规则的细节和数字查「主持人规则书.pdf」；网页版里点「玩法」也能随时打开这本手册。</p><hr style=\"border:0;border-top:1px solid #eaeded;margin:14px 0\"><h4>一、一句话玩法</h4><p>你是一家在亚马逊云科技上创业的公司：绕着棋盘走，<b>买亚马逊云科技服务</b>，别人走到你的服务上就<b>付你过路费</b>；把服务<b>升级、扩容、组成完整架构</b>，收得更多；同时要<b>扛住各种线上事故</b>，<b>控制好账单</b>。最后没破产的人赢，或者先做到 Well-Architected 六大支柱的人赢。</p><hr style=\"border:0;border-top:1px solid #eaeded;margin:14px 0\"><h4>二、开局</h4><ol style=\"padding-left:20px;margin:6px 0\"><li>双击打开 <code>index.html</code>，选人数（2–4 人）、难度、胜利条件，点「开始游戏」。</li><li>每人随机抽到一个角色，起始资金和特殊能力都不一样，比如传统企业上云钱多，但在维护窗口里要多待一轮。</li><li>第一次玩建议选<b>入门局</b>，胜利条件保持默认（经典 + 30 轮上限）；熟悉了再试标准局和完整局。想顺便学亚马逊云科技，就打开<b>学习模式</b>。</li><li>想每人用自己的电脑或手机玩：开局页第 04 步，房主点「创建房间」设密码，把 6 位房间号和密码发给大家，其他人打开同一个 <code>index.html</code> 点「加入房间」。轮到谁谁在自己的设备上操作，画面实时同步。</li></ol><hr style=\"border:0;border-top:1px solid #eaeded;margin:14px 0\"><h4>三、一回合怎么走</h4><ol style=\"padding-left:20px;margin:6px 0\"><li><b>掷骰子</b>，按点数往前走。</li><li><b>看落在哪</b>：<ul style=\"padding-left:20px;margin:6px 0\"><li>没人买的服务 → 可以按需买（全价，稳），EC2、ECS、EKS、EMR、SageMaker 还可以 Spot 买（自己出价，最低原价的 20%，但别人出更高的价能抢走）。</li><li>别人的服务 → 付过路费。</li><li>自己的服务 → 可以给它<b>加一个功能</b>、<b>加一份容量</b>，或者用 <b>FIS 给对手注入一种故障</b>（$40～$100，越难扛越贵；三选一）。</li><li>Health 事件 / re:Invent → 抽一张卡照做。</li><li>账单格、角落格 → 按格子上写的办。</li></ul></li><li><b>做点别的</b>（可选）：资产管理、和别人交易；完整局还能签 Savings Plans / RI、做主动行动。</li><li>结算完<b>自动轮到下一位</b>。掷出对子可以再掷一次，但同一回合连掷 3 次对子会\"被限流\"，直接进维护窗口。</li></ol><hr style=\"border:0;border-top:1px solid #eaeded;margin:14px 0\"><h4>四、怎么赚钱</h4><p>1. 收过路费</p><p>服务越贵、升级越多、容量越大，过路费越高。按用量计费的服务（Serverless 那些）过路费还会随对方掷出的点数浮动：点数大说明流量大，收得多。主人集齐一整组（同色的几块）时，没升级的服务过路费也翻倍。</p><p>2. 组成有效架构，联合收费</p><p>把几块能真正配合工作的服务凑齐，就组成一个架构。<b>别人落在架构里任意一块上，要把整套架构里所有服务的过路费加起来付给你。</b> 这是游戏里最赚钱的玩法。</p><table><tr><th>架构</th><th>要哪些服务</th></tr><tr><td>Serverless API</td><td>API Gateway + Lambda + DynamoDB</td></tr><tr><td>经典三层 Web</td><td>ELB + EC2 + RDS</td></tr><tr><td>容器平台</td><td>ECR + ECS 或 EKS + ELB</td></tr><tr><td>事件驱动</td><td>EventBridge + Step Functions + Lambda</td></tr><tr><td>订单削峰</td><td>EC2 + SQS + Lambda</td></tr><tr><td>图片缩略图</td><td>S3 + Lambda + CloudFront</td></tr><tr><td>GenAI 聊天机器人</td><td>API Gateway + Lambda + Bedrock</td></tr><tr><td>数仓 ETL</td><td>S3 + Glue + Redshift</td></tr><tr><td>审计与合规</td><td>CloudTrail + S3 + Athena</td></tr><tr><td>告警自愈</td><td>CloudWatch + EventBridge + Lambda</td></tr><tr><td>威胁自动响应</td><td>GuardDuty + EventBridge + Step Functions</td></tr><tr><td>实时日志分析</td><td>Kinesis + Lambda + OpenSearch</td></tr><tr><td>Serverless 数据湖</td><td>S3 + Glue + Athena</td></tr><tr><td>静态网站</td><td>Route 53 + CloudFront + S3</td></tr><tr><td>GenAI 知识库（RAG）</td><td>S3 + OpenSearch + Bedrock</td></tr><tr><td>ML 训练与部署</td><td>S3 + ECR + SageMaker</td></tr><tr><td>高可用入口</td><td>Route 53 + ELB + EC2</td></tr><tr><td>纵深防御</td><td>WAF + Shield Advanced + GuardDuty</td></tr></table><p>有些架构还有额外好处，比如「高可用入口」让你的 EC2 不怕 AZ 断电，「审计与合规」免疫「安全审计没过」，「纵深防御」免疫所有安全类事件。抽到 re:Invent 卡「解决方案架构师的建议」，能直接飞到你架构里缺的那块服务。</p><p>3. 其他进账</p><ul style=\"padding-left:20px;margin:6px 0\"><li>每次经过起点「Startup 扶持」，领 $200 Credits。</li><li>经过「User Group 活动」领取 $50；停在上面二选一：<b>抽奖</b>，随机拿 $100～奖池全部（账单格和罚款都进奖池，不够 $100 银行补上）；或者<b>抽一张 re:Invent 卡</b>。抽到 re:Invent「领到 Free Tier 额度」能把奖池全部拿走。</li><li>re:Invent 卡大多是好事：拿 Credits、考认证、Hackathon 拿奖……</li></ul><hr style=\"border:0;border-top:1px solid #eaeded;margin:14px 0\"><h4>五、怎么花钱：不同服务的账单不一样</h4><p>这是这个游戏和普通大富翁最不一样的地方。<b>买下服务之后，它会按自己的计费方式持续花你的钱。</b></p><table><tr><th>服务类型</th><th>例子</th><th>每圈经过起点时</th><th>收到过路费时</th></tr><tr><td>IaaS / 容器</td><td>EC2、EBS、ECS、EKS</td><td>交运行费（空着也要交）</td><td>全归你</td></tr><tr><td>打包价</td><td>Lightsail</td><td>交固定套餐费，不随流量变（负载均衡、托管数据库另算）</td><td>全归你</td></tr><tr><td>PaaS</td><td>RDS、Aurora、Redshift、SageMaker</td><td>交运行费，比 IaaS 贵</td><td>全归你</td></tr><tr><td>Serverless</td><td>Lambda、DynamoDB、SQS</td><td>不交钱</td><td>交 15% 请求费</td></tr><tr><td>按存储 / 按个收月费</td><td>S3、EFS、AWS Backup、ECR、KMS、Route 53、WAF</td><td>固定月费 $5</td><td>交 15% 请求费</td></tr><tr><td>按 token</td><td>Bedrock</td><td>不交钱（加了模型单元要交）</td><td>交 25% token 成本</td></tr><tr><td>订阅</td><td>Shield Advanced</td><td>固定 $40</td><td>全归你</td></tr></table><p>所以：</p><ul style=\"padding-left:20px;margin:6px 0\"><li><b>Serverless 前期没负担</b>，没人来就不花钱，适合起步。</li><li><b>实例型服务空着也烧钱</b>，但有人来时收入全归你，适合放在大家常走的位置。</li><li>想省钱可以 Spot 购买（只有 EC2、ECS、EKS、EMR、SageMaker 能用，现实里也只有这几类有 Spot 容量）：自己出价，最低原价的 20%。出得越低越省，但别人落上来只要比你多出原价的 10% 就能抢走（你拿回出价的一半作补偿）；以后补差价就能转成按需，出到全价就没人能抢。</li><li>完整局可以跟亚马逊云科技签 <b>Savings Plans</b> 或买<b>预留实例（RI）</b>，<b>1 圈算 1 年</b>：<ul style=\"padding-left:20px;margin:6px 0\"><li>Savings Plans 1 年：不预付，承诺每圈花一笔固定的钱，EC2、ECS、EKS、SageMaker 和 RDS、Aurora、ElastiCache 的运行费都打 75 折。</li><li>Savings Plans 3 年：只覆盖 EC2、ECS、EKS、SageMaker，打 55 折；数据库照原价，因为现实里 Database Savings Plans 只有 1 年期。</li><li>RI：挑一块 EC2、RDS、Aurora、ElastiCache、Redshift、OpenSearch 或 EMR，全额预付，1 年省 35%、3 年省 55%，期内它的运行费全免。</li><li>服务卖掉或释放了，承诺也照付。ELB、EBS、Lightsail、Kinesis 都用不了，和现实一样。</li></ul></li><li>缺钱时，EC2、RDS、Aurora、Redshift、ECS 可以<b>下线</b>，相当于大富翁里的抵押：先拿回买价的一半周转，下线期间不收过路费，运行费只剩每圈 $5 的存储费（ECS 不收）；重新上线要还这一半再加原价的 10%，满 3 轮自动上线。这期间别人落上来，可以付原价把它拉走。OpenSearch、ElastiCache 这类现实里不能停机的不能下线；Lightsail 停机照样收套餐费，也不让下线。</li><li>EC2 每圈多交 $5 公网 IPv4 地址费（2024 年起真实收费），你的 VPC 开了私有子网就免。</li><li>彻底不要的服务可以<b>释放</b>：以后不用再交它的运行费，但<b>买它的钱不退</b>（现实里删资源也不退钱）；升级和容量会先自动去掉、各退一半；这块重新变成谁都能买的状态。</li><li>落地的人不买，大家可以<b>竞价</b>：每人暗标出价，价高者得，钱交银行。没钱的时候，别人可能捡个便宜。</li></ul><hr style=\"border:0;border-top:1px solid #eaeded;margin:14px 0\"><h4>六、怎么变强：升级和扩容</h4><p>落在<b>自己的服务</b>上时，可以加功能、加容量（下面细说），或者用 FIS 给一位对手注入一种故障、让他当场承受（注入 API 限流错误 $40、断开依赖服务的网络 $40、CPU 压力测试 $60、终止实例 $60、模拟 AZ 断电 $100），三选一：</p><p>加功能（最多 3 级）</p><ul style=\"padding-left:20px;margin:6px 0\"><li><b>实例型服务</b>（EC2、RDS、EKS 等）买下时是<b>单 AZ</b>，第 1 级一般是<b>多 AZ</b>，之后才能加 Auto Scaling 之类的功能。EBS 卷、EMR 集群永远单 AZ；ECS 服务默认就跨 AZ 分散任务。</li><li>其他服务天生跨多个 AZ，三级都是功能，比如：<ul style=\"padding-left:20px;margin:6px 0\"><li>ECR：基础扫描 → 增强扫描 → 跨区域复制</li><li>Lambda：提高并发配额 → 预置并发 → 多区域</li><li>Bedrock：Nova Lite → Nova Pro → 跨区域推理（档位越高，每个 token 越贵，过路费越高；跨区域推理扛流量暴增，不算多区域容灾）</li><li>VPC：私有子网 + NAT（要多交 NAT 的钱）→ Session Manager → Transit Gateway</li></ul></li><li>很多功能自带防护：多 AZ 扛 AZ 断电，Auto Scaling 扛流量暴增，增强扫描扛 CVE，备份扛误删……服务详情里都写着。</li></ul><p>加容量（最多 4 份）</p><p>给服务加节点、加并发：EC2 加实例、EKS 加节点、Lambda 加并发、Kinesis 加分片、SageMaker 加实例、Bedrock 加模型单元……每份让过路费 <b>+25%</b>。实例型服务每多一份，每圈运行费也会多一些；Serverless 加并发不增加运行费。</p><p class=\"muted\">集齐一整组之后，不用等落地，在「资产管理」里随时可以升级和扩容。</p><hr style=\"border:0;border-top:1px solid #eaeded;margin:14px 0\"><h4>七、怎么不被坑：Health 事件和防护</h4><p>Health 事件卡大多是坏事，但几乎每张都有对应的防护。提前做好架构，就能躲过去：</p><table><tr><th>遇到</th><th>怎么防</th></tr><tr><td>一个 AZ 断电 / 单点故障</td><td>实例型服务升多 AZ；托管和全局服务大多本来就跨 AZ；「高可用入口」架构保护 EC2</td></tr><tr><td>某个服务在 Region 里宕机</td><td>升到多区域那一级</td></tr><tr><td>us-east-1 大面积故障</td><td>每块服务各自升到多区域那一级（没升的变 Impaired）；Route 53、CloudFront 这类全局服务不受影响</td></tr><tr><td>EC2 实例硬件退役</td><td>EC2 升到 Auto Scaling，自动换实例；多 AZ 挡不住</td></tr><tr><td>流量暴增</td><td>「订单削峰」架构（扛住了还能领钱）</td></tr><tr><td>服务配额用完</td><td>Lambda 提高并发配额，或 CloudWatch 告警提前发现</td></tr><tr><td>DDoS</td><td>Shield Advanced、WAF、CloudFront（Shield Standard 默认免费开着）</td></tr><tr><td>SSH 暴力破解</td><td>VPC 升到 Session Manager，或付 $50 借别人的；ECS 用 Fargate、EKS 用 Auto Mode 也不怕</td></tr><tr><td>高危 CVE</td><td>Inspector 扫描 EC2、Lightsail、EMR；ECR 增强扫描或 Inspector 镜像扫描保护容器；托管数据库和 Serverless 的运行时由亚马逊云科技打补丁</td></tr><tr><td>误删数据</td><td>AWS Backup，或有备份类功能（版本控制、时间点恢复、自动快照……）</td></tr><tr><td>S3 桶被设成公开</td><td>GuardDuty S3 保护、KMS 客户托管密钥、CloudFront 源站访问控制</td></tr><tr><td>Root 密钥泄露</td><td>「威胁自动响应」架构；只有 GuardDuty 能少罚一点</td></tr><tr><td>证书过期</td><td>ELB 或 CloudFront 升到 HTTPS（ACM 自动续期）</td></tr><tr><td>凌晨 3 点被告警叫醒</td><td>「告警自愈」架构</td></tr><tr><td>安全审计没过</td><td>持有 2 个以上安全合规组服务，或「审计与合规」架构</td></tr></table><p>被事件打挂的服务会变成 <b>Impaired</b>，到它主人的下一个回合前收不到过路费。</p><p>实在躲不过，还能用 Enterprise Support 卡、复盘标记、演练标记来抵消。被罚到又没抵消的，标准局起会欠 1 个<b>技术债</b>：每个让每圈运行费多 $20；攒到 2 个升级每级贵 $50；攒到 3 个要停一轮\"大重构\"并交 $100。花 $50 可以重构清掉 1 个。</p><hr style=\"border:0;border-top:1px solid #eaeded;margin:14px 0\"><h4>八、角落格</h4><table><tr><th>格子</th><th>发生什么</th></tr><tr><td>Startup 扶持（起点）</td><td>经过领 $200 Credits，同时交这一圈的运行费</td></tr><tr><td>维护窗口</td><td>直接落在这里要停一轮；被关进来要掷出对子、付 $50 开 Support Case，或用 Enterprise Support 才能出来。出来时讲一句根因，可以领复盘标记</td></tr><tr><td>User Group 活动</td><td>经过 UG 活动领取 $50；停在上面二选一：抽奖 $100～奖池全部（不够银行补）/ 抽一张 re:Invent 卡</td></tr><tr><td>Root 密钥泄露</td><td>进维护窗口；有 GuardDuty 的只交 $50</td></tr></table><hr style=\"border:0;border-top:1px solid #eaeded;margin:14px 0\"><h4>九、怎么赢</h4><ul style=\"padding-left:20px;margin:6px 0\"><li><b>经典模式</b>：别人都破产了，你就赢了。</li><li><b>越往后过路费越高</b>：从第 10 轮起所有过路费 × 1.25，第 20 轮起 × 1.5……业务做大了，流量越来越多，后期一块好地就能把人收破产。</li><li><b>破产</b>：钱不够付时，可以先在资产管理里去掉升级和容量、把能停机的服务下线凑钱，也可以直接宣告破产；平时自己回合里点「宣告破产」也能主动认输。出局后，你的服务连同升级和容量整个归债主（或你指定的玩家），欠银行的就回到银行。</li><li>胜利条件可以多选，谁先达成谁赢。</li><li><b>Well-Architected 模式</b>：先同时满足卓越运营、安全、可靠性、性能效率、成本优化、可持续性六个支柱的人赢。网页版会实时显示每个人的支柱进度。每个支柱满足任意一个条件就算，比如持有 CloudWatch 就算卓越运营，持有任一安全服务就算安全；网页上鼠标停在支柱上能看到还差什么。</li><li><b>轮数上限</b>（默认开，30 轮）：打满轮数按资产估值排名，保证一局能打完。</li><li><b>限时模式</b>：时间到了按资产估值排名。</li></ul><hr style=\"border:0;border-top:1px solid #eaeded;margin:14px 0\"><h4>十、新手建议</h4><ol style=\"padding-left:20px;margin:6px 0\"><li><b>前几圈先买便宜的 Serverless 服务</b>：S3、EFS、Lambda 不花运行费，攒钱快。</li><li><b>盯住一个架构去凑</b>：联合收费比单块服务强得多。</li><li><b>买了实例型服务，尽早升多 AZ</b>：AZ 断电、单点故障这几张卡专门坑单 AZ 的实例。</li><li><b>VPC 很关键</b>：没有 VPC 的人给实例升多 AZ 要付钱给 VPC 主人；VPC 升到 Session Manager 还能防 SSH 暴力破解，别人也可以付钱借用。</li><li><b>别一口气把钱花光</b>：每圈都要交运行费，账单格和事件卡也会扣钱。现金太少一次没付上，就可能被迫变卖。</li><li><b>注意 Bedrock</b>：它按 token 收费，对方掷的点数越大，你收得越多；但要交 25% token 成本。</li></ol><hr style=\"border:0;border-top:1px solid #eaeded;margin:14px 0\"><h4>十一、一局开头示例</h4><p class=\"muted\">小王是车库创业公司，起始 $1600。<br>第 1 轮掷出 3，落在 <b>re:Invent</b>，抽到「拿到 AWS Activate Credits」，领 $200。<br>第 2 轮落在 <b>Lambda</b>，花 $220 买下。Serverless 不交运行费，没人来也不花钱。<br>第 4 轮又落在自己的 Lambda 上，选「加 1 个并发」，过路费 +25%。<br>后来 Alice 落在小王的 Lambda 上，付了过路费，小王把其中 15% 作为请求费付给亚马逊云科技。<br>小王又买到 API Gateway 和 DynamoDB，凑齐「Serverless API」。从此别人落在这三块里任意一块，都要按三块加起来的过路费付给小王。<br>有一轮抽到 Health 事件「一个 AZ 断电了」：小王的服务全是 Serverless，天生跨多个 AZ，一点事都没有；Alice 的 EC2 还是单 AZ，变成 Impaired。</p><hr style=\"border:0;border-top:1px solid #eaeded;margin:14px 0\"><h4>十二、常见问题</h4><p><b>Q：哪些服务不用自己做多 AZ？</b></p><p>看格子底部类型字的颜色：绿字（Serverless 和大部分托管服务，比如 S3、Lambda、DynamoDB、SQS，还有 ECS）自带跨 AZ 高可用，AZ 断电卡打不到；橙字（EC2、RDS、Aurora、EKS 这类实例型）买下时是单 AZ，要升第 1 级多 AZ；红字（EBS、EMR）永远单 AZ；蓝字（Route 53、CloudFront、Shield Advanced）是全局服务。想扛整个 Region 出问题，不管哪类都要升多区域。</p><p><b>Q：释放和下线有什么区别？</b></p><p>下线是暂时停机、拿回一半周转，服务还是你的，重新上线要还这一半加 10%，期间别人可以付原价拉走；释放是彻底不要，不退钱，服务回到银行，谁先落上去谁就能买，包括你自己。所以缺钱时先下线，确定不要了才释放。</p><p><b>Q：为什么 Route 53 没有\"多 AZ\"？</b></p><p>Route 53 是全局服务，本来就不在某个 AZ 里，它的升级是健康检查、故障转移路由这些功能。</p><p><b>Q：CloudWatch、CloudTrail、Data Transfer 怎么收钱？</b></p><p>这三格算一组按用量收费：过路费 = 对方掷出的点数 × 倍数，三格都有时倍数最高，升级后倍数还会增加。</p><p><b>Q：架构联合收费和单块过路费能叠加吗？</b></p><p>不叠加。落在架构里的服务上，就按整套架构的总额收一次；一块服务在几个架构里，取最高的那个。</p><p><b>Q：保留卡都干啥的？</b></p><p>抽到后放在面前，需要时用掉：Enterprise Support 免费离开维护窗口或抵消一张 Health 事件卡；Spot 容量让下次 Spot 最低出价降到 10%；Cost Explorer 免一次账单格或抵消「月底账单爆了」；MAP 让下次买 IaaS、PaaS 或容器服务打 7 折。网页里鼠标停在玩家面板的卡名上能看到说明。</p><p><b>Q：Spot 出多少合适？</b></p><p>出价越低越省钱，但越容易被抢。别人抢的时候最少要比你多出原价的 10%，被抢你拿回出价的一半。想长期留着、要升级的服务，要么直接按需买，要么之后补差价转成按需。</p><p><b>Q：奖池的钱从哪来、到哪去？</b></p><p>两个账单格、Health 事件罚款、维护窗口的 $50 都进奖池。停在 User Group 活动选「抽奖」至少拿 $100，最多把奖池整个拿走；抽到「领到 Free Tier 额度」也拿走全部。经过 UG 活动（没停在上面）领取 $50。</p><p><b>Q：网页版能存档吗？</b></p><p>能。浏览器会自动保存，关掉再打开，点「继续上一局」就行。</p><hr style=\"border:0;border-top:1px solid #eaeded;margin:14px 0\"><h4>附录：有效架构</h4><p>凑齐后，别人落在其中任意一块上，按整套架构所有服务的过路费加起来收。</p><table><tr><th>架构</th><th>组成</th><th>加成</th></tr><tr><td>Serverless API</td><td>API Gateway 接请求 → Lambda 处理 → DynamoDB 存数据</td><td>—</td></tr><tr><td>经典三层 Web</td><td>ELB 分发流量 → EC2 跑应用 → RDS 存数据</td><td>—</td></tr><tr><td>容器平台</td><td>镜像放 ECR → ECS 或 EKS 运行 → ELB 对外提供服务</td><td>容器组升级费减半</td></tr><tr><td>事件驱动</td><td>EventBridge 收事件 → Step Functions 编排 → Lambda 执行每一步</td><td>—</td></tr><tr><td>订单削峰</td><td>EC2 上的网站收订单 → SQS 排队削峰 → Lambda 按自己的节奏处理，大促时网站不被压垮</td><td>免疫「流量暴增」，扛住了还能领钱</td></tr><tr><td>图片缩略图</td><td>图片上传到 S3 触发事件 → Lambda 生成缩略图写回 S3 → CloudFront 就近分发</td><td>—</td></tr><tr><td>GenAI 聊天机器人</td><td>API Gateway 收消息 → Lambda 组装提示词和上下文 → Bedrock 生成回答</td><td>—</td></tr><tr><td>数仓 ETL</td><td>原始数据落 S3 → Glue 清洗转换 → Redshift 做报表和 BI 分析</td><td>—</td></tr><tr><td>审计与合规</td><td>CloudTrail 记下所有 API 调用 → 存进 S3 → Athena 用 SQL 查谁在什么时候做了什么</td><td>免疫「安全审计没过」</td></tr><tr><td>告警自愈</td><td>CloudWatch 告警 → EventBridge 路由 → Lambda 自动重启、扩容或回滚</td><td>「凌晨 3 点被告警叫醒」不用停一轮</td></tr><tr><td>威胁自动响应</td><td>GuardDuty 发现异常 → EventBridge 路由 → Step Functions 编排处置：隔离实例、吊销密钥、通知值班</td><td>免疫「SSH 暴力破解」和「Root 密钥被推到了 GitHub」</td></tr><tr><td>实时日志分析</td><td>Kinesis 收数据流 → Lambda 处理 → OpenSearch 检索</td><td>—</td></tr><tr><td>Serverless 数据湖</td><td>S3 存原始数据 → Glue 建数据目录 → Athena 直接查询</td><td>每次经过或停在 Startup 扶持 多领 $50</td></tr><tr><td>静态网站</td><td>Route 53 解析域名 → CloudFront 加速 → S3 放网页</td><td>—</td></tr><tr><td>GenAI 知识库（RAG）</td><td>资料放 S3 → 向量存在 OpenSearch → Bedrock 检索后生成回答</td><td>别人落在你的 Bedrock 上，额外付你 $50</td></tr><tr><td>ML 训练与部署</td><td>训练数据放 S3、训练镜像放 ECR → SageMaker 训练并部署</td><td>—</td></tr><tr><td>高可用入口</td><td>Route 53 健康检查 → ELB 跨 AZ 分发 → EC2</td><td>你的 EC2 免疫「AZ 断电」和「单点故障」（Route 53 + ELB 只保护 EC2 这一层）</td></tr><tr><td>纵深防御</td><td>WAF 挡应用层攻击，Shield Advanced 挡 DDoS，GuardDuty 盯异常行为</td><td>免疫所有安全类 Health 事件</td></tr></table><hr style=\"border:0;border-top:1px solid #eaeded;margin:14px 0\"><h4>去哪查细节</h4><ul style=\"padding-left:20px;margin:6px 0\"><li><b>每个服务的特性、三级升级、计费方式</b>：网页里点「图鉴」，或者看「主持人规则书.pdf」第 8 节。</li><li><b>全部 Health 事件卡和 re:Invent 卡</b>：「卡牌.pdf」可以直接打印裁开；每张卡的完整效果和免疫条件见「主持人规则书.pdf」第 20、21 节。</li><li><b>题库和答案</b>：题卡在「卡牌.pdf」里，答案倒印在卡底；完整题库见「主持人规则书.pdf」附录。</li><li><b>所有数字</b>（升级费、运行费、Savings Plans / RI、估值公式）：「主持人规则书.pdf」。</li></ul>";

  const opts = [];

  let t = Math.random() * opts.reduce((a, o) => a + o.w, 0);
  for (const o of opts) { t -= o.w; if (t <= 0) return done(o.v); }
  done(opts[opts.length - 1].v);

const SIMOUT = { games: [] };
let simReserve = 150;
function simAct(box, inputs, buttons, done) {
  const p = cur(), en = buttons.map((b, k) => ({ ...b, k })).filter(b => !b.disabled);
  const money = lbl => +((String(lbl).match(/\$(\d+)/) || [0, 0])[1]);
  const pick = f => en.find(b => f(String(b.label)));
  inputs.forEach(inp => { const el = box.querySelector('#in_' + inp.id); if (el && inp.type === 'number') el.value = 0; if (el && inp.type === 'checkbox') el.checked = false; });
  const title = (box.querySelector('h3') || {}).textContent || '';
  // 竞价：出价到原价的 60%，但要留够存钱线
  if (title.startsWith('竞价')) {
    const me = S.players[MP.actor ?? S.cur] || p, price = money(title.replace(/^[^$]*/, ''));
    const bid = Math.max(0, Math.min(Math.round(price * 0.6 / 10) * 10, me.cash - simReserve));
    const el = box.querySelector('#in_bid'); if (el) el.value = bid;
    return done(bid >= 10 ? 'ok' : 'no');
  }
  let b = pick(l => l.startsWith('按需购买'));
  if (b && p.cash - money(b.label) >= simReserve) return done(b.value);
  b = pick(l => l.includes('拉起来归我'));
  if (b && p.cash - money(b.label) >= simReserve) return done(b.value);
  if (pick(l => l.startsWith('不买'))) return done(pick(l => l.startsWith('不买')).value);
  if (pick(l => l.startsWith('照常付'))) return done(pick(l => l.startsWith('照常付')).value);
  b = pick(l => l.startsWith('加'));
  if (b && p.cash - money(b.label) >= simReserve * 2) return done(b.value);
  if (pick(l => l === '先不加')) return done(pick(l => l === '先不加').value);
  for (const key of ['不管它', '自动变卖', '用掉', '交 10%', '不抵消', '执行', '知道了', '继续', '开标', '讲出来了', '同意', '跳过', '关闭', '先付 10%']) { const x = pick(l => l.startsWith(key)); if (x) return done(x.value); }

}
async function simGame(n, diff) {
  newGame({ names: ['甲', '乙', '丙', '丁'].slice(0, n), diff, wa: false, timed: false, minutes: 90, learn: false });
  enterGame();
  S.stats = { rent: 0, rentN: 0, joint: 0, run: 0, salary: 0, upg: 0, stops: 0 };
  const g = { rounds: 0, firstBust: null, cashByRound: {}, ownedByRound: {}, rentPaid: 0, runPaid: 0, salary: 0 };
  let lastRound = 0, steps = 0;
  const origPay = pay;
  while (!S.over && steps++ < 20000 && S.round <= 120) {
    await new Promise(r => setTimeout(r, 0));
    if (S.round !== lastRound) {
      lastRound = S.round;
      const alive = S.players.filter(q => q.alive);
      g.cashByRound[S.round] = Math.round(alive.reduce((a, q) => a + q.cash, 0) / alive.length);

}
