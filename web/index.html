@container (max-width:1150px){
  .sq.l,.sq.r{flex-direction:row;justify-content:flex-start;align-items:center;padding:.4cqw .6cqw;gap:.6cqw}
  .sq.l .txt,.sq.r .txt{align-items:flex-start;min-width:0}
  .sq.l .nm,.sq.r .nm{text-align:left}
  .sq.l .art img.awsi,.sq.r .art img.awsi{width:2.5cqw;height:2.5cqw}
  .sq.l .rent .rk,.sq.r .rent .rk{display:none}
}
/* 铺满整个窗口：棋盘吃掉除侧栏外的全部空间，格子跟着变大 */
@media (min-width:1201px){
  #game{display:grid;grid-template-columns:minmax(0,1fr) 360px;height:100vh;padding:12px;gap:14px;align-items:stretch;overflow:hidden}
  .frame{height:calc(100vh - 24px);display:flex;flex-direction:column;min-width:0}
  #board{width:100%;flex:1;aspect-ratio:auto;min-height:0;min-width:0}
  #side{width:auto;max-height:calc(100vh - 24px);overflow:auto}
}
@media (min-width:1201px) and (max-width:1500px){#game{grid-template-columns:minmax(0,1fr) 300px}}

/* ===== 第三轮润色 ===== */
/* 侧栏：玩家卡单独滚动，日志固定在底部 */
@media (min-width:1201px){
  #side{display:flex!important;flex-direction:column;gap:12px;overflow:hidden!important;padding:0}
  #side .plist{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;gap:14px;padding:6px 6px 6px 2px}
  #side .logpanel{flex:none;position:relative!important;bottom:auto;box-shadow:none;max-height:30vh;display:flex;flex-direction:column}
  #side .logpanel .gb{min-height:0;overflow:auto}
  #side .logpanel .log{max-height:none}
}
@media (max-width:1200px){#side .plist{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:14px;grid-column:1/-1}}
/* 折叠屏和小平板 */
/* 内屏横着（≤900 宽的横屏）：棋盘按高度缩小、居中，下面的玩家条和操作按钮第一屏就能看到 */
@media (max-width:900px) and (orientation:landscape) and (min-height:480px){
  #board{--cw:min(calc((100vw - 34px) / 15.6), calc(100vh * .6 / 11.6))!important;justify-content:center}
}
/* 手机横着（高度不到 500）：也走手机布局，棋盘按高度缩到一屏放得下 */
@media (max-height:500px) and (orientation:landscape){
  /* 扣掉标题栏、边距和右边那条主按钮栏（192px，见 #mbar 那段）。svh 是地址栏露着时的可见高度：真机上 100vh 按收起地址栏算，底排会出屏几 px */
  #board{--cw:min(calc((100vw - 234px) / 15.6), calc((100vh - 90px) / 11.6))!important;justify-content:center}
  @supports (height:100svh){#board{--cw:min(calc((100vw - 234px) / 15.6), calc((100svh - 90px) / 11.6))!important}}
}
/* 半折、桌面模式（上下两块屏）：棋盘只占上半块，操作区从折痕下面开始 */
@media (vertical-viewport-segments:2){
  #board{--cw:min(calc((100vw - 34px) / 15.6), calc((env(viewport-segment-height 0 0, 50vh) - 56px) / 11.6))!important;justify-content:center}
  #center{margin-top:calc(env(viewport-segment-top 0 1, 0px) - env(viewport-segment-bottom 0 0, 0px))}
}
/* 半折、书本模式（左右两块屏）：左边棋盘和操作区，右边玩家和日志，中间让开折痕 */
@media (horizontal-viewport-segments:2){
  #game{display:grid!important;grid-template-columns:env(viewport-segment-width 0 0, 50vw) env(viewport-segment-width 1 0, 50vw);column-gap:calc(env(viewport-segment-left 1 0, 50vw) - env(viewport-segment-right 0 0, 50vw));padding:0!important;height:100vh;overflow:hidden}
  #game>.frame{overflow:auto;height:100vh}
  #side{overflow:auto;height:100vh;padding:8px}
  #board{--cw:calc((env(viewport-segment-width 0 0, 50vw) - 34px) / 15.6)!important}
}
/* 3 人以上：收起的玩家卡 */
.pl .pacc:is([onclick], [data-act]){cursor:pointer}
.pl .pacc:is([onclick], [data-act]) .pn b::after{content:'▾';font-size:11px;color:var(--mut2);margin-left:2px}
.pl.mini .pacc:is([onclick], [data-act]) .pn b::after{content:'▸'}
.pl.mini .pacc{padding:8px 12px 2px}
.pl.mini .gb{padding:2px 12px 8px;gap:4px}
.pl.mini .ledbtn{display:none}
.pl.mini .svcs img.awsi{width:22px;height:22px}
.pl.mini .svcs{min-height:0;gap:6px 8px}
.pl.mini .pacc .cash small[title]{display:none}
.pl.mini .pacc .cash{font-size:17px}
.pl.mini .res{font-size:12px;color:var(--mut2)}
@media (min-width:1201px){
  #side.many .plist{gap:10px}
  #side.many .logpanel{max-height:22vh}
}
/* 多人局（5 人以上）：收起的玩家卡更紧，「还没有服务」这一行不占地方 */
#side.crowd .plist{gap:6px}
#side.crowd .pl.mini .pacc{padding-top:6px}
#side.crowd .pl.mini .gb{padding-bottom:6px}
#side.crowd .pl.mini .svcs:has(>.none:only-child){display:none}
/* 回合顺序条 */
.turnbar{display:flex;align-items:center;flex-wrap:wrap;gap:6px;margin:.4cqw 0 0;padding:6px 0 10px;border-bottom:1px solid var(--line2)}
.turnbar .tb{display:inline-flex;align-items:center;gap:6px;padding:4px 10px 4px 6px;border:1px solid var(--line);background:var(--surface);font-size:13px;white-space:nowrap}
.turnbar .tb b{font-weight:700}
.turnbar .tb i{font-style:normal;color:var(--mut);font-variant-numeric:tabular-nums}
.turnbar .tb em{font-style:normal;font-size:11px;color:var(--red);margin-left:2px}
.turnbar .tb .tbm{display:inline-flex;flex-direction:column;align-items:flex-start;line-height:1.2}
.turnbar .tb .tba{font-size:11px;color:var(--mut2);font-variant-numeric:tabular-nums}   /* 资产叠在现金下面：4 人一排也放得下，不把中间挤矮 */
/* 加了资产以后 4 人一排放不下：桌面上收紧一点，箭头变窄 */
.turnbar .tb{padding-top:3px;padding-bottom:3px}
.turnbar .tb.cur{border-color:var(--orange);box-shadow:inset 0 -3px 0 var(--orange)}
.turnbar .tb.dead{opacity:.45}
.turnbar .tbar{color:var(--mut2);font-size:12px}
.turnbar .pawn{width:18px;height:18px;font-size:10px}
/* 多人局（5 人以上）：去掉箭头和资产那一行，一格只留棋子、名字、现金，12 人两三排放得下；资产在悬停说明和侧栏里 */
.turnbar.crowd{gap:4px}
.turnbar.crowd .tbar,.turnbar.crowd .tb .tba{display:none}
.turnbar.crowd .tb{padding:2px 7px 2px 4px;gap:4px;font-size:12px}
/* 上下两排格子：内容别挤到底部色条上 */
.sq.t,.sq.b{justify-content:flex-start;padding-top:.8cqw}
.sq.t .art img.awsi,.sq.b .art img.awsi{width:3.4cqw;height:3.4cqw}
.sq.t .txt,.sq.b .txt{gap:.15cqw}
.sq.g.t{padding-bottom:1cqw}
.sq.g.b{padding-top:1.2cqw}
#center{grid-template-rows:auto auto minmax(0,1fr) auto}

/* 弹窗收起 */
.box h3{display:flex;align-items:center;justify-content:space-between;gap:10px}
.box h3 .minbtn{flex:none}
.modal.min{background:transparent;pointer-events:none;align-items:flex-end;justify-content:center;padding-bottom:12px}
.modal.min .box{pointer-events:auto;max-height:none;height:auto;overflow:hidden;box-shadow:0 4px 18px rgba(0,28,36,.35)}
.modal.min .box>:not(h3){display:none!important}
.modal.min .box h3{border-bottom:0}
#err{position:fixed;top:16px;left:50%;translate:-50% 0;z-index:1000;display:none;align-items:flex-start;gap:12px;width:min(560px,calc(100vw - 24px));padding:14px 12px 17px 14px;background:#d13212;color:#fff;font-size:14px;line-height:1.5;border-radius:4px;overflow:hidden;box-shadow:0 0 0 2px var(--surface),0 14px 40px rgba(209,50,18,.5),0 4px 12px rgba(0,0,0,.3)}
#err.on{display:flex;animation:errin .6s cubic-bezier(.2,.9,.3,1)}
@keyframes errin{0%{transform:translateY(-40px)}30%{transform:none}45%{transform:translateX(-9px)}60%{transform:translateX(8px)}75%{transform:translateX(-5px)}90%{transform:translateX(3px)}100%{transform:none}}
#err .ei{flex:none;width:30px;height:30px;border-radius:50%;background:var(--surface);color:var(--red);font:900 19px/30px var(--sans);text-align:center}
#err .eb{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
#err .eb b{font-size:16px}
#err .eb b em{font-style:normal;font-size:12px;background:rgba(0,0,0,.25);padding:1px 7px;border-radius:9px;margin-left:8px;vertical-align:2px}
#err .eb span{word-break:break-word;font-family:"SF Mono",Menlo,ui-monospace,monospace;font-size:12.5px;background:rgba(0,0,0,.18);padding:4px 8px;margin-top:4px}
#err .eb small{font-size:12.5px;color:#fff;margin-top:4px}
#err .eb .ecp{align-self:flex-start;margin-top:8px;min-height:28px;padding:0 12px;font-size:12.5px;background:var(--surface);color:var(--red);border:0;border-radius:2px}
#err .eb .ecp:hover{background:var(--danger-bg)!important;color:#a8270e!important}
#err :focus-visible{outline:2px solid #fff;outline-offset:2px}
#err .ex{background:transparent;border:0;color:#fff;font-size:22px;line-height:1;width:32px;height:32px;padding:0;min-height:0;cursor:pointer;flex:none}
#err .ex:hover{background:rgba(0,0,0,.2)!important;color:#fff!important}
#err .ebar{position:absolute;left:0;bottom:0;height:4px;width:100%;background:rgba(255,255,255,.75);transform-origin:left;animation:errbar 10s linear forwards}
#err:hover .ebar,#err:focus-within .ebar{animation-play-state:paused}
@keyframes errbar{to{transform:scaleX(0)}}

.rent .rk{font-style:normal}
.rent{font-size:max(.62cqw,9px);font-weight:700;color:var(--ink);background:var(--surface-muted);padding:0 .3cqw;white-space:nowrap}
.rent.off{color:var(--mut2);font-weight:400}
.flip.fis .face.back{background:#7d1a0c}

#fx3d{position:fixed;inset:0;pointer-events:none;z-index:9}
#fxdim{position:fixed;inset:0;z-index:8;pointer-events:none;opacity:0;transition:opacity .32s ease;background:radial-gradient(1.5px 1.5px at 12% 18%,var(--surface),transparent),radial-gradient(1px 1px at 27% 62%,var(--surface),transparent),radial-gradient(1.5px 1.5px at 41% 12%,var(--warning-bg),transparent),radial-gradient(1px 1px at 58% 74%,var(--surface),transparent),radial-gradient(2px 2px at 69% 28%,var(--surface),transparent),radial-gradient(1px 1px at 83% 55%,var(--info-bg),transparent),radial-gradient(1.5px 1.5px at 92% 14%,var(--surface),transparent),radial-gradient(1px 1px at 8% 82%,var(--surface),transparent),radial-gradient(1px 1px at 36% 88%,var(--warning-bg),transparent),radial-gradient(1.5px 1.5px at 76% 90%,var(--surface),transparent),radial-gradient(ellipse at 50% 42%,rgba(36,30,92,.62),rgba(10,12,34,.86) 70%)}
#fxdim.on{opacity:1}
#fxtitle{position:fixed;left:0;right:0;top:9vh;z-index:10;pointer-events:none;text-align:center;opacity:0;transform:translateY(-10px) scale(.96);transition:opacity .3s ease,transform .45s cubic-bezier(.2,.9,.3,1.25)}
#fxtitle.on{opacity:1;transform:none}
#fxtitle.low{top:auto;bottom:14vh}
#fxtitle b{display:block;font-size:clamp(30px,4.6vw,64px);font-weight:900;letter-spacing:.06em;color:#fff;text-shadow:0 3px 0 #1b1f3b,0 0 24px rgba(255,190,90,.35),0 6px 18px rgba(0,0,0,.55)}
#fxtitle b em,#fxtitle span em{font-style:normal;color:#ffc23a}
#fxtitle span{display:inline-block;margin-top:8px;padding:4px 14px;font-size:clamp(14px,1.6vw,20px);font-weight:700;color:#fff;background:rgba(10,12,34,.55);border:1px solid rgba(255,194,58,.45);border-radius:999px}

.tiles.dlc{grid-template-columns:repeat(2,1fr)}
.tiles.dlc b{display:flex;align-items:center;gap:6px}
.tiles.dlc b img.awsi{width:20px;height:20px}
@media (max-width:700px){.tiles.dlc{grid-template-columns:1fr}}

/* 角色卡 */
.rcards{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;padding:6px 0}
.rcard{perspective:900px}
.rc-in{position:relative;width:100%;height:100%;transform-style:preserve-3d;animation:rcflip .7s var(--d) cubic-bezier(.3,.7,.3,1) both}
@keyframes rcflip{from{transform:rotateY(180deg) scale(.9)}to{transform:rotateY(0) scale(1)}}
.rc-back,.rc-front{backface-visibility:hidden;border:2px solid var(--pc);display:flex;flex-direction:column;align-items:center;padding:14px}
.rc-back{transform:rotateY(180deg);background:#16191f repeating-linear-gradient(45deg,rgba(255,255,255,.06) 0 12px,transparent 12px 24px);color:#ff9900;justify-content:center;gap:10px;font-weight:700}
.rc-back img.awsi{width:56px;height:56px}
.rc-front{background:var(--surface);gap:6px;text-align:center}
.rc-front::before{content:'';position:absolute;left:0;right:0;top:0;height:5px;background:var(--pc)}
.rc-who{display:flex;align-items:center;gap:6px;font-size:14px;margin-top:4px}
.rc-front>img.awsi{width:52px;height:52px;margin:6px 0 2px}
.rc-n{font-size:18px;font-weight:800}
.rc-rs{align-self:center;margin-top:2px;padding:1px 10px;border-radius:3px;font-size:12px;font-weight:700;color:var(--mut);box-shadow:inset 0 0 0 1px #aab7b8}
.rc-rs.on{color:#fff;background:#0972d3;box-shadow:none}
.rc-cash{font-size:13px;color:var(--mut)}.rc-cash b{color:var(--ink);font-size:15px}
.rc-ab,.rc-wk{font-size:12.5px;line-height:1.5;text-align:left;width:100%;border-top:1px solid var(--line2);padding-top:6px}
.rc-ab i,.rc-wk i{font-style:normal;font-weight:700;margin-right:6px;color:var(--green)}.rc-wk i{color:var(--red)}
@media (prefers-reduced-motion:reduce){.rc-in{animation:none}}
/* 新手引导 */
#tour{position:fixed;inset:0;z-index:30}
#tour .spot{position:fixed;border:2px solid var(--orange);box-shadow:0 0 0 9999px rgba(15,23,36,.55);transition:all .25s ease;pointer-events:none}
#tour .tip{position:fixed;width:360px;max-width:calc(100vw - 24px);box-sizing:border-box;background:var(--surface);border:1px solid var(--line);border-top:4px solid var(--orange);padding:12px 14px;box-shadow:0 8px 24px rgba(0,0,0,.3)}
#tour .tk{font-size:11px;color:var(--orange);font-weight:700;letter-spacing:.1em}
#tour .tip b{font-size:16px;display:block;margin:4px 0}
#tour .tip p{margin:0 0 10px;font-size:13.5px;line-height:1.6;color:var(--ink)}
#tour .tb{display:flex;justify-content:flex-end;gap:8px}
/* DLC 加成标记 */
.dlcm{font-size:max(.55cqw,8px);font-weight:700;color:#fff;background:#8c4fff;padding:0 .3cqw;white-space:nowrap}

/* 操作按钮多了以后：三列紧凑排，右栏和图例不互相压 */
@media (min-width:901px){
  .stage .row.more{grid-template-columns:repeat(3,minmax(0,1fr))!important;width:min(100%,480px)!important;gap:6px!important}
  .stage .row.more button{min-height:32px;padding:2px 6px;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .cright{overflow:auto;min-height:0;max-height:100%}
  .cmain{min-height:0;overflow:hidden auto;overscroll-behavior:contain;scrollbar-width:thin}
  .cmain{grid-template-rows:minmax(0,1fr)}   /* 行高跟着中间区域走，不让最高的一列把整块撑出去 */
  .cleft{overflow:hidden auto;min-height:0;max-height:100%;scrollbar-width:thin}   /* 左列（牌堆、奖池、最近抽到）放不下时自己滚，不再把中间的按钮挤出去 */   /* 窗口矮时中间放不下：以前直接裁掉，底下一排操作按钮看不见也点不到，改成能上下滚 */
  .lower{overflow:hidden}
}
/* 桌面窗口矮（笔记本、浏览器开着书签栏）：中间那一列收紧一点，掷骰子和下面一排操作按钮都放得下 */
@media (min-width:901px) and (max-height:720px){
  .stage{gap:4px!important}
  .stage>.dice .die{width:38px;height:38px}
  .stage .row button,.stage .row.more button{min-height:28px!important;padding-top:0;padding-bottom:0}
  .stage .who{font-size:16px}
}
/* 左右两列有主的格子：类型字让位给过路费 */
.sq.owned.l .bill,.sq.owned.r .bill{display:none!important}
.sq.l .txt,.sq.r .txt{line-height:1.15;overflow:hidden;max-height:100%}

.aiopt{display:flex;align-items:center;font-size:12.5px;color:var(--mut);white-space:nowrap;cursor:pointer}

/* 棋盘不大时（1600×900 这类屏幕），左右两列只留图标、名字和过路费，主人用格子边上的色条表示 */
@container (max-width:1250px){
  .sq.l .ownr,.sq.r .ownr,.sq.l .dlcm,.sq.r .dlcm,.sq.l .lv,.sq.r .lv,.sq.l .cap,.sq.r .cap{display:none!important}
  .sq.owned.l{box-shadow:inset .55cqw 0 0 var(--oc)}
  .sq.owned.r{box-shadow:inset -.55cqw 0 0 var(--oc)}
  .sq.owned.l.last{box-shadow:inset 0 0 0 .3cqw var(--orange),inset .85cqw 0 0 var(--oc)}
  .sq.owned.r.last{box-shadow:inset 0 0 0 .3cqw var(--orange),inset -.85cqw 0 0 var(--oc)}
  .sq.l .nm,.sq.r .nm{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden;max-width:100%;white-space:normal}
}
/* ---------- 结束画面：最终架构总览。画法跟开局页那张架构图一样：深色网格底、细线框、左上角贴标签、官方服务图标和虚线连线。
   一个玩家一条泳道，赢家那条是橙框；不用皇冠、领奖台、彩带和发光。框线只有两种意思：实线 = 凑成的架构，虚线 = 差一块（只在战报里）。
   强调色只有一种：橙色只给赢家那条泳道（框和名次标签），名字一律白字，座位色只留在棋子上（红色在战报里是付出去的钱和破产，标题不能是红字）。
   内容比屏幕高时整层能滚（margin:auto 居中，放不下就从顶上排，不会切掉开头） ---------- */
:root{--mono:"SF Mono",Menlo,Consolas,ui-monospace,monospace}
#endfx{position:fixed;inset:0;z-index:60;display:flex;overflow-y:auto;overscroll-behavior:contain;padding:clamp(12px,3vh,36px) clamp(12px,3vw,40px);color:#e9edf2;cursor:pointer;background-color:#0b111c;background-image:linear-gradient(rgba(255,255,255,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.045) 1px,transparent 1px);background-size:32px 32px;animation:efFade .3s ease-out both}
#endfx [hidden]{display:none!important}
/* 桌面最宽 1080：右边那列数字挪进了泳道顶上的带子，服务区占满整条泳道，1600 宽也不会在中间空出一大块 */
#endfx .ef{position:relative;margin:auto;width:min(100%,1080px);display:flex;flex-direction:column;gap:12px}
#endfx .efr{position:relative;border:1px solid rgba(255,255,255,.3);padding:44px 20px 20px;background:rgba(11,17,28,.55)}
#endfx .gt{position:absolute;top:-1px;left:-1px;display:flex;align-items:center;gap:8px;max-width:calc(100% + 2px);background:#0f1724;border:1px solid rgba(255,255,255,.3);padding:0 12px 0 0;font-size:12px;font-weight:700;color:#cfd6df;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#endfx .gt img.awsi{width:26px;height:26px;flex:none}
/* 标题和副句等赢家那条泳道出来时才出（--wd），开场只有左上角的标签，名次从最后一名往上揭晓，不先说破 */
#endfx .efh{margin:0 0 18px;animation:efUp .4s var(--wd) ease-out both}
#endfx h2{display:flex;align-items:center;gap:12px;margin:0;font-size:clamp(26px,2.6vw,34px);line-height:1.2;font-weight:800;color:#fff}
#endfx h2 .pawn{width:30px;height:30px;font-size:15px}
#endfx .efh p{margin:6px 0 0;color:#aab4c0;font-size:15px;line-height:1.5}
#endfx .lanes{list-style:none;margin:0;padding:0;display:grid;gap:14px}
/* 泳道：左边泳道头（座位、名字、角色、估值、与第 1 名差多少），右边画服务；名次贴在左上角，跟分组框的标签一个样子。
   过路费和数量放在顶上那条带子的右边（泳道够宽时，按泳道自己的宽度判断，不按屏幕宽度：手机横屏两列时泳道只有三百来 px） */
#endfx .lane{position:relative;container-type:inline-size;display:grid;grid-template-columns:200px minmax(0,1fr);gap:8px 20px;align-items:start;padding:32px 18px 14px;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.02);animation:efLane .45s var(--d) cubic-bezier(.2,.8,.2,1) both}
#endfx .lane .lt{position:absolute;top:-1px;left:-1px;padding:2px 10px;font-size:12px;font-weight:700;line-height:18px;color:#cfd6df;background:#152030;border:1px solid rgba(255,255,255,.2);white-space:nowrap}
#endfx .lane.win{border-color:#ec7211;background:rgba(236,114,17,.07);animation:efLane .45s var(--d) cubic-bezier(.2,.8,.2,1) both,efWin .5s calc(var(--d) + .35s) ease-out both}
#endfx .lane.win .lt{background:#ec7211;border-color:#ec7211;color:#16191f;animation:efWin .5s calc(var(--d) + .35s) ease-out both}
/* 出局的：框和图标淡下去，字不淡（淡了对比度不够） */
#endfx .lane.out{border-color:rgba(255,255,255,.13);background:none}
#endfx .lane.out .lb img.awsi,#endfx .lane.out .pawn{opacity:.5}
#endfx .lane.out .lh>b,#endfx .lane.out .lval b{color:#c3cad3}
#endfx .lh{display:grid;grid-template-columns:28px minmax(0,1fr);column-gap:10px;align-items:center;min-width:0}
#endfx .lh .pawn{width:26px;height:26px;font-size:13px;grid-row:span 2}
#endfx .lh>b{font-size:17px;line-height:1.3;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#endfx .lh>small{color:#9aa7b6;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#endfx .lval{grid-column:1/-1;display:flex;flex-direction:column;gap:4px;margin-top:10px;min-width:0}
#endfx .lvl{display:flex;align-items:baseline;gap:6px;white-space:nowrap}
#endfx .lvl b{font:700 26px/1.1 var(--mono);font-variant-numeric:tabular-nums;color:#fff}
#endfx .lvl small{font-size:12px;color:#9aa7b6}
#endfx .lg{font:600 13px/1.3 var(--mono);font-variant-numeric:tabular-nums;color:#c3cad3;white-space:nowrap}
#endfx .lg small{font:400 12px var(--sans);color:#9aa7b6;margin-right:6px}
#endfx .lsm{grid-column:1/-1;margin:0;font-size:12px;line-height:18px;color:#9aa7b6}
#endfx .lsm b{font:700 12px var(--mono);font-variant-numeric:tabular-nums;color:#e9edf2}
@container (min-width:600px){#endfx .lsm{position:absolute;top:2px;right:16px;max-width:calc(100% - 170px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}}
/* 泳道很窄（手机横屏两列）：数字行只留过路费收付和支柱，服务和架构的块数图上就数得出来 */
@container (max-width:420px){#endfx .lsm .x2{display:none}}
/* 架构：凑成的一条链一个实线框（左上角写架构名），框里图标之间用虚线连；没进架构的服务不画框 */
#endfx .lb{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-start;min-width:0}
#endfx .lb>*{flex:none}
#endfx .ag{display:flex;flex-direction:column;gap:6px;padding:6px 10px 8px;border:1px solid rgba(255,255,255,.35)}
#endfx .ag>b{font-size:12px;font-weight:700;line-height:16px;color:#cfd6df;white-space:nowrap}
#endfx .ag.loose{border-color:transparent;padding-left:2px;padding-right:2px}
#endfx .ag.loose>b{color:#9aa7b6;font-weight:400}
#endfx .ach{display:flex;align-items:flex-start;gap:8px}
#endfx .nd{display:flex;flex-direction:column;align-items:center;gap:4px;width:60px;text-align:center}
#endfx .nd img.awsi{width:32px;height:32px}
/* 名字只在空格处折行；EventBridge、CloudWatch 这种一个词比格子宽的往两边多伸一点，不切成「CloudWatc / h」 */
#endfx .nd em{font-style:normal;font-size:11px;line-height:1.2;color:#cfd6df;width:calc(100% + 12px);margin:0 -6px}
#endfx .nd.off img.awsi{opacity:.4}
/* 连线从左边图标的右沿画到右边图标的左沿：两侧各伸进相邻那块的空白 14px（60 宽的格子里图标只占中间 32），再加上 8px 的间隔 */
#endfx .ach .ln{flex:0 0 36px;height:2px;margin:15px -22px 0;background:repeating-linear-gradient(90deg,rgba(255,255,255,.5) 0 5px,transparent 5px 9px);transform-origin:left;animation:efLn .35s calc(var(--d) + .2s) ease-out both}
/* 赢家的连线是橙色虚线，画一遍就停：结果页是静态的，不一直流动 */
#endfx .lane.win .ln{background:repeating-linear-gradient(90deg,#ec7211 0 6px,transparent 6px 10px)}
#endfx .mo{align-self:center;font-size:12px;color:#9aa7b6;white-space:nowrap}
#endfx .none{margin:0;color:#9aa7b6;font-size:13px}
/* 「查看战报」吸在底边：内容比屏幕高时按钮也一直看得见。只有真放不下时（JS 给 #endfx 加 .ovf）才垫一条实底，栏线和外框左右对齐 */
#endfx .eff{position:sticky;bottom:0;z-index:1;display:flex;align-items:center;justify-content:flex-end;flex-wrap:wrap;gap:10px 18px;padding:10px 0;animation:efUp .4s var(--fd) both}
#endfx.ovf .eff{background:#0b111c;border-top:1px solid rgba(255,255,255,.14);padding:10px 12px}
#endfx .eff span{font-size:13px;color:#9aa7b6}
#endfx .eff button{min-height:44px;padding:0 28px;font-size:15px}
#endfx .eff button:focus-visible{outline:2px solid #fff;outline-offset:3px}
/* 服务特别多的局（JS 量出一屏放不下时加 .dense）：服务只露图标，名字留给读屏，连线收短，泳道矮一半 */
#endfx.dense .nd{width:auto}
#endfx.dense .nd em{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
#endfx.dense .ach{gap:4px;align-items:center}
#endfx.dense .ach .ln{flex-basis:12px;margin:0}
#endfx.dense .lb{gap:10px}
@keyframes efFade{from{opacity:0}to{opacity:1}}
@keyframes efUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
/* 只写起点：终点就是泳道本来的样子（出局的那条本来就淡、赢家本来就是橙框） */
@keyframes efLane{from{opacity:0;transform:translateY(10px)}}
@keyframes efLn{from{transform:scaleX(0)}}
@keyframes efWin{from{border-color:rgba(255,255,255,.2);background-color:rgba(255,255,255,.02);color:#cfd6df}}
/* 矮屏（1280×720、1366×768 这类笔记本和投影）：收紧留白、图标和数字小一号，四个人一屏放得下 */
@media (min-width:641px) and (max-height:820px){
  #endfx{padding:10px 24px 0}
  #endfx .ef{gap:6px}
  #endfx .efr{padding:38px 16px 14px}
  #endfx .efh{margin-bottom:12px}
  #endfx h2{font-size:28px}
  #endfx .efh p{margin-top:4px;font-size:14px}
  #endfx .lanes{gap:10px}
  #endfx .lane{padding:28px 14px 10px;gap:6px 16px}
  #endfx .lane{grid-template-columns:224px minmax(0,1fr)}
  /* 「与第 1 名」跟在估值后面同一行，泳道头少一行 */
  #endfx .lval{margin-top:6px;flex-direction:row;align-items:baseline;gap:10px}
  #endfx .lvl b{font-size:22px}
  #endfx .nd img.awsi{width:28px;height:28px}
  #endfx .ach .ln{flex-basis:40px;margin:13px -24px 0}
  #endfx .ag{padding:5px 9px 6px;gap:5px}
}
/* 平板竖屏和手机：泳道头摆成一行（名字左、估值右，「估值」跟在数字后面），服务图标拿到整条泳道的宽度 */
@media (max-width:980px),(max-height:520px) and (orientation:landscape){
  #endfx .lane{grid-template-columns:minmax(0,1fr);gap:8px}
  #endfx .lh{grid-template-columns:28px minmax(0,1fr) auto}
  #endfx .lval{grid-column:3;grid-row:1/3;margin:0;flex-direction:column;align-items:flex-end;gap:2px}
  #endfx .nd{width:56px}
  #endfx .nd img.awsi{width:30px;height:30px}
  #endfx .ach .ln{flex-basis:34px;margin:14px -21px 0}
  #endfx .lb{gap:10px}
  #endfx .ag{padding:6px 8px 8px}
}
/* 平板竖屏（641–980 宽）：1024 高放得下四条泳道，外框底线不被按钮栏盖住 */
@media (min-width:641px) and (max-width:980px) and (orientation:portrait){
  #endfx{padding:14px 20px}
  #endfx .efr{padding:36px 16px 16px}
  #endfx .efh{margin-bottom:12px}
  #endfx .lanes{gap:10px}
  #endfx .lane{padding:26px 14px 10px}
}
/* 手机竖屏、手机横屏：服务只露图标，名字留给读屏；外框去掉，省下两边的宽度 */
@media (max-width:640px),(max-height:520px) and (orientation:landscape){
  #endfx{padding:10px 12px 0}
  #endfx .ef{gap:4px}
  #endfx .efr{border:0;background:none;padding:30px 0 0}
  #endfx h2{font-size:22px;gap:8px}
  #endfx h2 .pawn{width:24px;height:24px;font-size:12px}
  #endfx .efh{margin-bottom:10px}
  #endfx .efh p{font-size:13.5px;margin-top:4px}
  #endfx .lanes{gap:8px}
  #endfx .lane{gap:6px;padding:24px 12px 8px}
  #endfx .lh{grid-template-columns:24px minmax(0,1fr) auto;column-gap:8px}
  #endfx .lh .pawn{width:22px;height:22px;font-size:11px}
  #endfx .lh>b{font-size:15px}
  #endfx .lvl b{font-size:20px}
  #endfx .lg{font-size:12px}
  #endfx .lg small{margin-right:4px}
  #endfx .lb{gap:6px}
  #endfx .lb{align-items:flex-end}
  /* 架构框的名字压在框线上（像图例那样），省掉框里一行字的高度；底色和泳道底色一样，盖住框线 */
  #endfx .ag{position:relative;margin-top:7px;padding:6px 6px 5px;gap:4px}
  #endfx .ag>b{position:absolute;top:-8px;left:4px;padding:0 4px;font-size:11px;line-height:14px;background:#101621}
  #endfx .lane.win .ag>b{background:#1b181b}
  #endfx .lane.out .ag>b{background:#0b111c}
  /* 「服务」「其他服务」这两个小标题省掉：不在框里的就是没凑成架构的 */
  #endfx .ag.loose{margin-top:0;padding:4px 0 6px}
  #endfx .ag.loose>b{display:none}
  #endfx .ach{gap:3px;align-items:center}
  #endfx .nd{width:auto}
  #endfx .nd img.awsi{width:24px;height:24px}
  #endfx .nd em{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
  #endfx .ach .ln{flex-basis:8px;margin:0}
  #endfx .eff{padding:8px 0 calc(8px + env(safe-area-inset-bottom))}
  #endfx.ovf .eff{margin:0 -12px;padding:8px 12px calc(8px + env(safe-area-inset-bottom))}
}
/* 手机横屏，和一屏放不下的手机竖屏（JS 量出来放不下时给 #endfx 加 .tight，360×640、360×740、375×667 这类）：
   服务排成一行不折行，排不下的从后往前收成「+N」（JS 量完再收），四条泳道一屏放得下 */
@media (max-height:520px) and (orientation:landscape){
  #endfx .lane:not(.win) .lb{flex-wrap:nowrap;overflow:hidden}
  #endfx .efh p{line-height:1.4}
  #endfx .lane .lt{font-size:11.5px;line-height:16px;padding:1px 8px}
  #endfx .nd img.awsi{width:22px;height:22px}
}
/* 竖屏手机放不下时：再收紧留白，数字行挪进泳道顶上那条带子（名次标签右边），只留最要紧的一项：一般是过路费收付，六大支柱赢的局是支柱得分 */
@media (max-width:640px) and (orientation:portrait){
  #endfx.tight{padding-top:8px}
  #endfx.tight .efr{padding-top:26px}
  #endfx.tight .efh{margin-bottom:6px}
  #endfx.tight .efh p{font-size:13px;line-height:1.35}
  #endfx.tight .lanes{gap:5px}
  #endfx.tight .gt{font-size:11.5px}
  #endfx.tight .gt img.awsi{width:22px;height:22px}
  #endfx.tight h2{font-size:20px}
  #endfx.tight .lane{padding:20px 10px 6px}
  #endfx.tight .lane .lt{font-size:11.5px;line-height:16px;padding:1px 8px}
  #endfx.tight .lane:not(.win) .lb{flex-wrap:nowrap;overflow:hidden}
  #endfx.tight .nd img.awsi{width:22px;height:22px}
  #endfx.tight .lsm{position:absolute;top:1px;right:10px;font-size:11px;line-height:16px;white-space:nowrap}
  #endfx.tight .lsm b{font-size:11px}
  #endfx.tight .lsm .x2,#endfx.tight .lsm .pil{display:none}
  #endfx.tight.wa .lsm .lrn,#endfx.tight.wa .lsm .pil .sep{display:none}
  #endfx.tight.wa .lsm .pil{display:inline}
}
/* 手机横屏（高不到 520）：泳道排成两列；「查看战报」挪到标题那一行的右边，不占底边一条（提示字收进按钮的 title） */
@media (max-height:520px) and (orientation:landscape){
  #endfx{padding:8px 16px 0}
  #endfx .efr{padding:28px 0 0}
  #endfx .gt{font-size:11.5px}
  #endfx .gt img.awsi{width:22px;height:22px}
  #endfx .efh{margin-bottom:8px;padding-right:150px;min-height:44px}
  #endfx h2{font-size:19px}
  #endfx h2 .pawn{width:22px;height:22px;font-size:11px}
  #endfx .efh p{font-size:12.5px;margin-top:2px}
  #endfx .lanes{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
  #endfx .lane{padding:20px 10px 6px;gap:4px}
  #endfx .lh>b{font-size:14px}
  #endfx .lh>small{font-size:11.5px}
  #endfx .lvl b{font-size:18px}
  #endfx .lsm{font-size:11.5px;line-height:16px}
  #endfx .lsm b{font-size:11.5px}
  #endfx .eff{position:absolute;top:28px;bottom:auto;right:0;padding:0;background:none!important;border:0!important;margin:0!important}
  #endfx .eff span{display:none}
}
/* 再矮的横屏（667×375、740×360）：角色名省掉（战报里有），泳道头只占一行 */
@media (max-height:400px) and (orientation:landscape){
  #endfx .efr{padding-top:26px}
  #endfx .eff{top:26px}
  #endfx .lh>small{display:none}
  #endfx .lh .pawn{grid-row:auto}
  #endfx .lval{grid-row:1;flex-direction:row;align-items:baseline;gap:8px}
  #endfx .lane{padding:19px 10px 5px}
}
@media (prefers-reduced-motion:reduce){#endfx,#endfx *{animation:none!important}}
/* ---------- 战报：深色，和结束画面「最终架构总览」是同一套画法——#0b111c 底加 32px 细网格、1px 细线框、框左上角贴标签、官方服务图标。
   上半是总览：结果和结束原因 + 估值横条排名（一个分组框），本局之最（点线对齐的清单）和关键时刻（估值走势和事件同一根轮次轴）；
   下半是玩家档案：一排棋子切换，一次只看一个人。估值拆分和明细折在「详细数据」里。
   颜色：灰阶为主，橙色只给赢家和主按钮，红色只给流走的钱和破产；虚线只表示「差一块」。数字用界面字体的等宽数字（tabular-nums），不用等宽字体。
   次要文字最暗用 #9aa7b6（在 #0b111c 上对比度 7:1 以上） ---------- */
.box.rep{--rh:52px;--bg:#0b111c;--bg2:#0f1724;--ln:rgba(255,255,255,.3);--ln2:rgba(255,255,255,.14);--ln3:rgba(255,255,255,.08);--tx:#e9edf2;--tx2:#c3ccd6;--tx3:#9aa7b6;--or:#ec7211;--rd:#f0614f;max-width:1080px;max-height:calc(100svh - 32px);color:var(--tx);color-scheme:dark;scrollbar-color:rgba(255,255,255,.3) var(--bg);border:1px solid rgba(255,255,255,.22);box-shadow:0 16px 56px rgba(0,0,0,.55);background-color:var(--bg);background-image:linear-gradient(rgba(255,255,255,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.045) 1px,transparent 1px);background-size:32px 32px;background-attachment:local}
/* 背后的遮罩也压暗：从结束画面切过来不会突然一亮（收起看棋盘时 .min 照旧透明） */
#modal:has(>.box.rep):not(.min){background:rgba(5,9,15,.74)}
/* 标题栏压在吸顶的切换条上面：档案那一段滚走时切换条跟着往上走，从标题栏底下钻过去 */
.box.rep>h3{z-index:3;height:var(--rh);padding:0 12px 0 22px;font-size:16px;color:#fff;background:var(--bg2);border-bottom:1px solid var(--ln2)}
.box.rep>h3 .minbtn{color:#dfe4ea;background:transparent;border:1px solid rgba(255,255,255,.38)}
.box.rep>h3 .minbtn:hover{color:#fff;background:rgba(255,255,255,.07);border-color:#fff}
.modal.min .box.rep>h3 .minbtn{color:#fff;background:var(--info-fill);border-color:var(--blue)}
.box.rep .mb{padding:0}
/* 按钮栏：深底，按钮是游戏的按钮在深底上的版本（次按钮白线框，主按钮橙底黑字）；压在吸顶的切换条上面 */
.box.rep .btns{z-index:3;margin-top:0;padding:12px 22px;background:var(--bg2);border-top:1px solid var(--ln2)}
.box.rep .btns button{min-height:40px;background:transparent;color:var(--tx);border:1px solid rgba(255,255,255,.5)}
.box.rep .btns button:hover:not(:disabled){background:rgba(255,255,255,.07);color:#fff;border-color:#fff}
.box.rep .btns button.pri{background:var(--or);border-color:var(--or);color:#16191f}
.box.rep .btns button.pri:hover:not(:disabled){background:#ff8a2e;border-color:#ff8a2e;color:#16191f}
.box.rep button:focus-visible,.box.rep summary:focus-visible{outline:2px solid #fff;outline-offset:2px}
/* 档案面板能用 Tab 停上去（里面没有别的可聚焦的东西时读屏和键盘也进得去）；鼠标点进去不画框 */
.report .dp:focus{outline:none}
.report .dp:focus-visible{outline:2px solid #fff;outline-offset:4px}
/* 键盘焦点滚进视野时别停在吸顶的标题栏、切换条底下，也别被底下的按钮栏挡住 */
.box.rep{scroll-padding:calc(var(--rh) + 56px) 0 80px}
.report{padding:24px 24px 8px;font-size:14px;line-height:1.55;color:var(--tx);font-variant-numeric:tabular-nums}
.report b{font-weight:700}
.report .pawn{width:20px;height:20px;font-size:11px}
.report img.awsi{flex:none}
.report .mu{margin:0;color:var(--tx3);font-size:13px}
.report .rd{color:var(--rd)!important}
/* 区块标题 16px 加粗，后面跟一个细线小标签（和分组框的标签一个画法）；区块之间留 40px，不是每块都套框 */
.report .sx{min-width:0}
.report .sx-h{display:flex;align-items:center;flex-wrap:wrap;gap:6px 12px;margin:0 0 14px}
.report .sx-h h4{margin:0;font-size:16px;line-height:1.3;font-weight:700;color:#fff}
.report .sx-h .tag{padding:0 7px;font-size:12px;line-height:20px;color:var(--tx3);border:1px solid var(--ln2)}
.report h5{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin:0 0 10px;font-size:14px;font-weight:700;color:#fff}
.report h5>span{font-size:13px;font-weight:400;color:var(--tx3)}
.report h5>span b{color:var(--tx);font-weight:700}
.report h5.il{justify-content:flex-start}   /* 架构个数跟在标题后面，不推到最右边 */

/* 抬头分组框：左上角标签 + 赢家标题 + 结束原因 + 一行事实，框里是估值横条排名 */
.report .rp-top{position:relative;padding:48px 24px 22px;border:1px solid var(--ln);background:rgba(11,17,28,.6)}
.report .gt{position:absolute;top:-1px;left:-1px;display:flex;align-items:center;gap:8px;max-width:calc(100% + 2px);padding:0 12px 0 0;font-size:12px;font-weight:700;line-height:26px;color:#cfd6df;background:var(--bg2);border:1px solid var(--ln);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.report .gt img.awsi{width:26px;height:26px}
/* 标题折行只在空格和标点处断（「六大支 / 柱」这种不拆），名字本身比一行还长时才在字中间断 */
.report h2{display:flex;align-items:flex-start;gap:12px;margin:0;font-size:38px;line-height:1.15;font-weight:800;color:#fff;word-break:keep-all;overflow-wrap:anywhere}
.report h2>span:last-child{min-width:0}
/* 名字长、标题折成两三行时，棋子对齐第一行 */
.report h2 .pawn{width:34px;height:34px;font-size:17px;margin-top:.3em}
.report .rp-sub{margin:10px 0 0;max-width:62em;font-size:15px;line-height:1.55;color:var(--tx2)}
.report .rp-facts{display:flex;flex-wrap:wrap;gap:4px 22px;margin:8px 0 0;font-size:13px;color:var(--tx3)}
.report .rp-facts b{color:var(--tx);font-weight:600}
/* 估值横条：名次 | 棋子 | 名字 / 角色 | 条（最高的占满）| 估值 | 与第 1 名；名字和条一行，角色和小字（过路费收付、数量）一行 */
.report .rk{container-type:inline-size;list-style:none;margin:26px 0 0;padding:0;display:grid;gap:16px}
.report .rk li{display:grid;grid-template-columns:20px 22px minmax(150px,210px) minmax(0,1fr) 112px 120px;column-gap:14px;row-gap:3px;align-items:center}
.report .rk .no{grid-row:1/3;font-size:14px;font-weight:700;color:var(--tx3);text-align:center}
.report .rk li.win .no{color:var(--or)}
.report .rk .pawn{grid-row:1/3;width:22px;height:22px;font-size:12px}
.report .rk .rkn{grid-column:3;grid-row:1;min-width:0;font-size:16px;line-height:1.3;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* 角色 · 代理商 · 在线/已出局：一段一个 span，放不下就在段之间折行（第二段起前面带「 · 」），不出省略号，在线/已出局永远看得到 */
.report .rk .rkr{grid-column:3;grid-row:2;align-self:start;display:flex;flex-wrap:wrap;min-width:0;font-size:13px;line-height:1.5;color:var(--tx3)}
.report .rk .rkr>span{flex:none;white-space:nowrap}
.report .rk .rkr>span+span::before{content:'·';margin:0 .4em}
.report .rk .rkr>.ro{flex:0 1 auto;min-width:0;white-space:normal}   /* 角色名比整列还宽时自己折行（角色名是固定的几个，不会太长） */
.report .rk .bar{grid-column:4;grid-row:1;height:12px;background:rgba(255,255,255,.06)}
.report .rk .bar i{display:block;height:100%;width:var(--w);background:#c3cad3;transform-origin:left;animation:rpBar .7s calc(var(--d) + .1s) cubic-bezier(.2,.8,.2,1) both}
.report .rk li.win .bar i{background:var(--or)}
.report .rk li.out .bar i{background:rgba(195,202,211,.4)}
.report .rk li.out .rkn{color:var(--tx2)}
.report .rk li.out .pawn{opacity:.6}
.report .rk .v{grid-column:5;grid-row:1;display:flex;align-items:baseline;justify-content:flex-end;gap:6px;white-space:nowrap}
.report .rk .v b{font-size:22px;line-height:1.1;color:#fff}
.report .rk .v small,.report .rk .g small{font-size:12px;color:var(--tx3)}
.report .rk .g{grid-column:6;grid-row:1;display:flex;align-items:baseline;justify-content:flex-end;gap:6px;white-space:nowrap}
.report .rk .g b{font-size:15px;color:var(--tx2)}
.report .rk .s{grid-column:4/-1;grid-row:2;align-self:start;margin:0;font-size:13px;line-height:1.5;color:var(--tx3)}
.report .rk .s span{white-space:nowrap}
.report .rk .s b{font-weight:600;color:var(--tx)}
.report .rk-note{margin:16px 0 0;font-size:13px;color:var(--tx3)}
@keyframes rpBar{from{transform:scaleX(0)}}
/* 排名框窄了（平板竖屏、手机，框里不到 700px）：第一行名字和估值，第二行角色和与第 1 名，条占满第三行（每人的条一样长才好比），小字第四行 */
@container (max-width:700px){
  .report .rk li{grid-template-columns:14px 22px minmax(0,1fr) auto;column-gap:10px;row-gap:2px}
  .report .rk .no{grid-row:1}
  .report .rk .pawn{grid-row:1/3;align-self:start;margin-top:2px}
  .report .rk .v{grid-column:4;grid-row:1}
  .report .rk .g{grid-column:4;grid-row:2}
  .report .rk li.ng .rkr{grid-column:3/-1}   /* 赢家那行右边没有「与第 1 名」：角色那段可以用上那一格 */
  .report .rk .bar{grid-column:3/-1;grid-row:3;margin:6px 0 4px}
  .report .rk .s{grid-column:3/-1;grid-row:4}
  .report .rk .v b{font-size:20px}
}

/* 总览下半：本局之最在左、关键时刻在右，宽屏并排，窄了上下排 */
.report .ov{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:40px 48px;align-items:start;margin-top:40px}
.report .ov.one{grid-template-columns:minmax(0,1fr)}
.report .ov.one>.ld{max-width:640px}
/* 本局之最：像小票，外号 ……… 谁 · 多少；点是圆点（不是虚线，虚线只表示差一块）。新加的两项另起一段，上面一条细线 */
.report .lead{container-type:inline-size;list-style:none;margin:0;padding:0}
.report .lead.nw{margin-top:8px;padding-top:8px;border-top:1px solid var(--ln2)}
.report .lead li{display:flex;flex-wrap:wrap;align-items:center;column-gap:10px;row-gap:2px;min-height:34px;padding:4px 0}
.report .lead .nk{flex:none;display:flex;align-items:baseline;gap:8px;min-width:0;max-width:100%}
.report .lead .nk b{font-size:14px;color:#fff;white-space:nowrap}
.report .lead .nk small{font-size:13px;color:var(--tx3)}
/* 点线下移 4px，落在字的基线附近（像小票上的点），不是正中间 */
.report .lead .ld{flex:1 1 12px;min-width:12px;height:2px;transform:translateY(4px);background:radial-gradient(circle,rgba(255,255,255,.4) 0 1px,transparent 1.3px) 0 0/6px 2px repeat-x}
/* 谁和多少是一整块（.rt）：外号那一行放不下时整块换到下一行、靠右，金额那一列照样对齐 */
.report .lead .rt{display:flex;align-items:center;gap:10px;min-width:0;max-width:100%;margin-left:auto}
.report .lead .wh{display:flex;flex-wrap:wrap;justify-content:flex-end;align-items:center;gap:2px 12px;min-width:0}
/* 名字特别长、一行放不下时名字出省略号（棋子、服务图标和服务名不缩），不会把图标挤出左边 */
.report .lead .wh>span{display:inline-flex;align-items:center;gap:6px;min-width:0;max-width:100%;white-space:nowrap}
.report .lead .wh>span>*{flex:none}
.report .lead .wh>span>b:last-child,.report .lead .hs em{flex:0 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis}
.report .lead .wh b{color:var(--tx);font-weight:600}
.report .lead .hs img.awsi{width:20px;height:20px}
.report .lead .hs em{font-style:normal;color:var(--tx2)}
.report .lead .vv{flex:none;min-width:4.2em;text-align:right;font-weight:700;color:#fff}
/* 窄了（手机）：比的是什么写在外号下面一行，点线和谁、多少留在外号那一行 */
@container (max-width:440px){
  .report .lead .nk{flex-direction:column;gap:0;flex-shrink:1}
  .report .lead .nk small{font-size:12px;line-height:1.35}
}
/* 关键时刻：上面是估值走势（每人一条线，赢家橙色粗线，出局的线断在出局那一轮、打红叉），下面是事件条和轮次刻度，同一根横轴 */
.report .tr-f{position:relative;margin:0 78px 0 52px}
.report .tr-f.nc{margin:0 10px}
.report .tr-cap{margin:0 0 8px -52px;font-size:13px;font-weight:700;color:var(--tx)}
.report .tr-cap span{margin-left:10px;font-weight:400;color:var(--tx3)}
.report .tr-c{position:relative;height:150px}
.report .tr-c svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.report .tr-c line{stroke:rgba(255,255,255,.09);stroke-width:1}
.report .tr-c line.z{stroke:rgba(255,255,255,.28)}
.report .tr-c line.gd{stroke:rgba(255,255,255,.07)}
.report .tr-c line.gd.out{stroke:rgba(240,97,79,.3)}
.report .tr-c polyline{fill:none;stroke-width:1.6;stroke-linejoin:round;stroke-linecap:round}
.report .tr-c polyline.w{stroke-width:2.6}
.report .tr-c .ty{position:absolute;right:calc(100% + 8px);transform:translateY(-50%);font-size:12px;line-height:1;color:var(--tx3);white-space:nowrap}
.report .tr-c .te{position:absolute;left:calc(100% + 8px);transform:translateY(-50%);display:flex;align-items:center;gap:5px;white-space:nowrap}
.report .tr-c .te b{font-size:12.5px;line-height:1;font-weight:700;color:#dfe5ec}
.report .tr-c .te.w b{color:var(--or)}
.report .tr-c .te .pawn,.report .tr-c .tx .pawn{width:18px;height:18px;font-size:10px}
/* 出局标记：.tx 是线尾那一点，红叉画在点上；棋子默认在红叉右边，和别的棋子、线尾标签撞了由 repLayout 挪到右上、左边或更高处 */
.report .tr-c .tx{position:absolute;width:0;height:0}
.report .tr-c .tx i{position:absolute;left:-5px;top:-5px;width:10px;height:10px}
.report .tr-c .tx i::before,.report .tr-c .tx i::after{content:'';position:absolute;left:-1px;top:4px;width:12px;height:2px;background:var(--rd);transform:rotate(45deg)}
.report .tr-c .tx i::after{transform:rotate(-45deg)}
.report .tr-c .tx .pawn{position:absolute;left:8px;top:-9px;opacity:.75}
/* 事件条：竖线从底线往上立，过路费越大越高越亮（--h、--o），出局的红色。编号排成一行（底边离底线 34px，比最高的竖线高 6px，上面离走势图还有十几像素），
   挨得近的由 repLayout 左右推开、细线连回自己的竖线顶，所以编号永远不会叠在一起，也不会顶进上面的走势图 */
.report .tr-a{position:relative;height:62px;margin-top:8px;border-bottom:1px solid rgba(255,255,255,.4)}
.report .tr-a.bare{height:0}
.report .tr-a .lk{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.report .tr-a .lk line{stroke:rgba(255,255,255,.3);stroke-width:1}
.report .tr-a .lk line.out{stroke:rgba(240,97,79,.6)}
.report .tr-a .pin{position:absolute;bottom:0;width:2px;height:var(--h);margin-left:-1px;background:rgba(233,237,242,var(--o));font-style:normal}
.report .tr-a .pin.out{background:var(--rd)}
.report .tr-a .pl{position:absolute;bottom:34px;transform:translateX(-50%);box-sizing:border-box;min-width:18px;padding:0 3px;font-size:11px;font-weight:700;line-height:16px;text-align:center;color:#fff;background:var(--bg);border:1px solid rgba(255,255,255,.5)}
.report .tr-a .pl.out{color:var(--rd);border-color:var(--rd)}
.report .tr-t{position:relative;height:22px}
.report .tr-t .tk{position:absolute;top:5px;transform:translateX(-50%);font-size:12px;line-height:1;color:var(--tx3);white-space:nowrap}
/* 终点「第 N 轮」右边和轴的右端对齐，压到它的中间刻度由 repLayout 藏掉 */
.report .tr-t .tk.end{left:auto;right:0;transform:none;color:var(--tx);font-weight:600}
.report .tl{list-style:none;margin:12px 0 0;padding:0}
.report .tl li{display:grid;grid-template-columns:20px 4.6em minmax(0,1fr);gap:10px;align-items:baseline;padding:7px 0;border-top:1px solid var(--ln3);line-height:1.5}
.report .tl .no{align-self:center;display:inline-flex;align-items:center;justify-content:center;height:18px;font-size:11px;line-height:1;color:#fff;border:1px solid rgba(255,255,255,.5)}
.report .tl .r{color:var(--tx3);white-space:nowrap}
.report .tl li.out .no{color:var(--rd);border-color:var(--rd)}
.report .tl li.out .t{color:var(--rd)}

/* 玩家档案：棋子切换条吸顶（停在标题栏下面），选中的那个下面一条白线；赢家的名次数字是橙色 */
.report .dsr{margin-top:44px}
.report .dtabs{position:sticky;top:var(--rh);z-index:2;display:flex;max-width:100%;margin:0 0 20px;overflow-x:auto;scrollbar-width:none;background:var(--bg);box-shadow:inset 0 -1px 0 var(--ln2)}
.report .dtabs button{flex:0 1 auto;min-width:0;min-height:46px;display:flex;align-items:center;gap:8px;padding:0 18px;margin:0;font-size:15px;font-weight:700;color:var(--tx2);background:transparent;border:0;border-radius:0;box-shadow:none}
.report .dtabs button:hover:not(:disabled){color:#fff;background:rgba(255,255,255,.05)}
.report .dtabs button b{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.report .dtabs button .n{font-size:12px;color:var(--tx3);white-space:nowrap}
/* 多人局（5 人以上）：档案标签不挤成一字一行，按原宽排开、左右滑 */
.report .dtabs:has(button:nth-child(5)) button{flex:none;padding:0 12px}
.report .dtabs button.win .n{color:var(--or)}
.report .dtabs button.out .pawn{opacity:.6}
.report .dtabs button[aria-selected=true]{color:#fff;box-shadow:inset 0 -2px 0 #fff}
.report .dtabs button:focus-visible{outline-offset:-2px}
/* 档案框：和结束画面的泳道一个样子，左上角贴名次标签；赢家橙框、橙标签 */
.report .dz{position:relative;container-type:inline-size;padding:46px 24px 24px;border:1px solid var(--ln);background:rgba(255,255,255,.02)}
.report .dz .lt{position:absolute;top:-1px;left:-1px;padding:2px 10px;font-size:12px;font-weight:700;line-height:18px;color:#cfd6df;background:#152030;border:1px solid var(--ln);white-space:nowrap}
.report .dz.win{border-color:var(--or);background:rgba(236,114,17,.06)}
.report .dz.win .lt{color:#16191f;background:var(--or);border-color:var(--or)}
.report .dz-h{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px 32px;padding-bottom:20px;border-bottom:1px solid var(--ln2)}
.report .dz-id{display:grid;grid-template-columns:30px minmax(0,1fr);column-gap:12px;align-items:center;min-width:0}
.report .dz-id .pawn{width:30px;height:30px;font-size:14px;grid-row:span 2}
.report .dz-id b{font-size:22px;line-height:1.2;color:#fff;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.report .dz-id small{font-size:13px;color:var(--tx3)}
.report .dz-k{display:flex;flex-wrap:wrap;gap:12px 32px;margin:0}
.report .dz-k div{min-width:0}
.report .dz-k dt{font-size:12px;line-height:1.4;color:var(--tx3)}
.report .dz-k dd{display:flex;align-items:baseline;gap:6px;margin:2px 0 0;white-space:nowrap}
.report .dz-k dd b{font-size:20px;line-height:1.2;color:#fff}
.report .dz-k dd small{font-size:12px;color:var(--tx3)}
.report .dz-x{flex:1 1 100%;display:flex;flex-wrap:wrap;gap:4px 28px;margin:0;font-size:13px;line-height:1.5;color:var(--tx2)}
.report .dz-x>span{white-space:nowrap}
.report .dz-x em{margin-right:8px;font-style:normal;color:var(--tx3)}
.report .dz-x b{font-weight:700;color:var(--tx)}
/* 档案正文分三排：钱花在哪 | 钱从哪来 | 服务；架构小图（凑成的、差一块的接着往右排，放不下换行）；想赢可以怎么改。
   档案框窄了：第一排先变成钱两列、服务占一整行，再窄就一列一个 */
.report .dz-r1{display:grid;grid-template-columns:minmax(0,1fr);gap:26px 40px;margin-top:22px}
.report .dz-r1>section{min-width:0}
@container (min-width:520px){
  .report .dz-r1{grid-template-columns:repeat(2,minmax(0,1fr))}
  .report .dz-r1:not(.n2) .dz-s{grid-column:1/-1}
  .report .dz-r1:not(.n2) .dz-s .sv{grid-template-columns:repeat(2,minmax(0,1fr));column-gap:40px}
}
@container (min-width:820px){
  .report .dz-r1:not(.n2){grid-template-columns:minmax(0,1fr) minmax(0,1fr) minmax(0,.86fr)}
  .report .dz-r1:not(.n2) .dz-s{grid-column:auto}
  .report .dz-r1:not(.n2) .dz-s .sv{grid-template-columns:minmax(0,1fr)}
}
.report .dz-ar{display:flex;flex-wrap:wrap;align-items:flex-start;gap:26px 40px;margin-top:30px}
.report .dz-ar>section{flex:0 1 auto;min-width:0;max-width:100%}
.report .dz-t{margin-top:30px;padding-top:22px;border-top:1px solid var(--ln2)}
/* 钱：两条线同一个比例尺；一类一段，段之间留 2px 缝，下面是小账（金额右对齐、占比、合计） */
.report .ml{display:flex;gap:2px;width:var(--w);min-width:12px;height:10px;margin:0 0 12px}
.report .ml i{flex-basis:0;min-width:3px}
.report table.lgr{width:100%;border-collapse:collapse;font-size:13px}
.report table.lgr th,.report table.lgr td{padding:3px 0;border:0;background:none;font-size:13px;line-height:20px;font-weight:400;color:var(--tx);vertical-align:baseline}
.report table.lgr th{text-align:left;white-space:nowrap}
.report table.lgr th i{display:inline-block;width:10px;height:10px;margin-right:8px;vertical-align:-1px;background:var(--c)}
.report table.lgr td{text-align:right;padding-left:12px;white-space:nowrap}
.report table.lgr td.pc{width:3.4em;color:var(--tx3)}
.report table.lgr tr.rd td:not(.pc){color:var(--rd)}
.report table.lgr tfoot th,.report table.lgr tfoot td{padding-top:6px;border-top:1px solid var(--ln2);font-weight:700;color:#fff}
/* 钱从哪来下面那句：过路费应收多少、对方没付上多少，和排名里的数对得上 */
.report .mf-n{margin:10px 0 0;font-size:12.5px;line-height:1.5;color:var(--tx2);text-wrap:pretty}
.report .mf-n b{font-weight:700;color:var(--tx)}
.report .mf-n span{white-space:nowrap}
/* 服务：最赚钱、最烧钱各一行，前面是图标 */
.report .sv{list-style:none;margin:0;padding:0;display:grid;gap:12px}
.report .sv li{display:grid;grid-template-columns:32px minmax(0,1fr);column-gap:12px;align-items:center}
.report .sv li.no{display:block;color:var(--tx3);font-size:13px}
.report .sv img.awsi{width:32px;height:32px;grid-row:span 2}
.report .sv small{font-size:12px;line-height:1.3;color:var(--tx3)}
.report .sv span{line-height:1.4;color:var(--tx2)}
.report .sv span b{color:#fff}
/* 架构小图：凑成的实线框、图标之间实线连；差一块的虚线框，缺的那一环是虚线空位，里面灰着放能补上的服务 */
.report .acs{display:flex;flex-wrap:wrap;gap:12px}
.report .ag{display:flex;flex-direction:column;gap:8px;padding:8px 12px 10px;border:1px solid rgba(255,255,255,.4)}
.report .ag>b{font-size:12px;line-height:16px;color:#dfe4ea;white-space:nowrap}
.report .ag>b small{margin-left:8px;font-size:12px;font-weight:400;color:var(--tx3)}
.report .ag.near{border-style:dashed;border-color:rgba(255,255,255,.42)}
.report .ag>p{margin:0;max-width:19em;font-size:12.5px;line-height:1.45;color:var(--tx2)}
.report .ag>p span{white-space:nowrap}
.report .ach{display:flex;align-items:flex-start}
/* 节点 66px 宽、名字不超出节点（长名字在空格处折成两行，「SageMaker AI」→「SageMaker / AI」），连线让相邻两个节点之间留 6px：名字之间不会粘成一串 */
.report .nd{flex:none;display:flex;flex-direction:column;align-items:center;gap:4px;width:66px;text-align:center}
.report .nd img.awsi{width:30px;height:30px}
.report .nd em{width:100%;font-style:normal;font-size:11px;line-height:1.2;color:#cfd6df;text-wrap:balance}
.report .ach .ln{flex:0 0 34px;height:1px;margin:15px -14px 0;background:rgba(255,255,255,.55)}
.report .nd.gap .slot{display:flex;align-items:center;justify-content:center;gap:1px;width:32px;height:32px;margin-top:-1px;border:1px dashed rgba(255,255,255,.7)}
.report .nd.gap .slot img.awsi{width:22px;height:22px;opacity:.42;filter:grayscale(1)}
.report .nd.gap .slot img.awsi+img.awsi{width:13px;height:13px;margin-left:-1px}
.report .nd.gap .slot:has(img+img) img.awsi{width:13px;height:13px}
.report .nd.gap em{color:var(--tx3)}
/* 怎么改：短句编号 */
.report .tips{list-style:none;margin:0;padding:0;counter-reset:tp;display:grid;gap:8px;max-width:60em}
.report .tips li{display:grid;grid-template-columns:22px minmax(0,1fr);gap:8px;font-size:14px;line-height:1.6;color:var(--tx)}
.report .tips li::before{counter-increment:tp;content:counter(tp);font-weight:700;color:var(--tx3);text-align:right;font-variant-numeric:tabular-nums}
/* 档案框只剩手机那么窄：架构框一个占一整行（差一块的框也不会挤成两百来像素宽） */
@container (max-width:480px){.report .dz-ar>section{flex-basis:100%}.report .ag{flex:1 1 100%}}

/* 详细数据：折起来；展开后两张深色表，数字右对齐，第一列吸左（手机上横着滚） */
.report details.more{margin-top:40px;border-top:1px solid var(--ln2)}
.report details.more summary{display:flex;align-items:center;gap:12px;min-height:52px;cursor:pointer;list-style:none;font-size:15px;font-weight:700;color:#fff}
.report details.more summary::-webkit-details-marker{display:none}
.report details.more summary::before{content:'';flex:none;width:7px;height:7px;margin:0 2px 0 3px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(-45deg);transition:transform .15s}
.report details.more[open] summary::before{transform:rotate(45deg) translate(-2px,-2px)}
.report details.more summary small{margin-left:-6px;font-size:13px;font-weight:400;color:var(--tx3)}
.report details.more summary:hover{color:var(--tx2)}
.report .dt-note{margin:4px 0 18px;font-size:13px;line-height:1.6;color:var(--tx2);text-wrap:pretty}
.report .dt-note b{color:#fff}
.report details.more h5{margin:0 0 6px}
.report .dt-x{overflow-x:auto;overscroll-behavior-x:contain;margin:0 0 24px}
.report table.dt{width:100%;border-collapse:collapse;font-size:13px}
.report table.dt th,.report table.dt td{padding:8px 12px;border:0;border-bottom:1px solid var(--ln3);background:none;font-size:13px;font-weight:400;line-height:1.45;color:var(--tx);text-align:left;white-space:nowrap;vertical-align:middle}
.report table.dt thead th{font-size:12px;font-weight:700;color:var(--tx3);border-bottom-color:var(--ln2)}
.report table.dt tbody th{color:var(--tx2)}
.report table.dt .n{text-align:right}
.report table.dt td.wr{white-space:normal;min-width:9em}
.report table.dt td b{color:#fff;font-weight:700}
.report table.dt td small{display:block;font-size:12px;color:var(--tx3)}
.report table.dt .w{background:rgba(236,114,17,.08)}
.report table.dt thead .w{box-shadow:inset 0 2px 0 var(--or)}
.report table.dt .how{color:var(--tx3);font-size:12px}
.report table.dt tfoot th,.report table.dt tfoot td{border-top:1px solid var(--ln);border-bottom:0;font-weight:700;color:#fff}
.report table.dt tfoot .how{font-weight:400;color:var(--tx3)}
.report table.dt .vh{display:inline-flex;align-items:center;gap:8px;font-weight:700;color:var(--tx)}
.report table.dt .pn{position:sticky;left:0;z-index:1;background:var(--bg)}
.report table.dt.tp{display:none}
/* 估值拆分和每人明细（转置表）用同一套定宽的列：第一列 120px、每个玩家一列 104px，估值拆分多出来的「怎么算」放最后、占掉剩下的宽度。
   平板竖屏两张表上下排时，同一个人的数上下对得齐 */
.report table.dt.vb,.report table.dt.tp{table-layout:fixed}
.report table.dt.vb thead .pn,.report table.dt.tp thead .pn{width:120px}
.report table.dt.vb thead .n,.report table.dt.tp thead .n{width:104px}
.report table.dt.tp{width:calc(120px + var(--n) * 104px)}
.report table.dt.vb .how{white-space:normal}
.report table.dt.vb .vh,.report table.dt.tp .vh{max-width:100%}
.report table.dt.vb .vh>span,.report table.dt.tp .vh>span{min-width:0;overflow:hidden;text-overflow:ellipsis}
/* 架构名每个都不拆开，只在顿号后面折行 */
.report table.dt .nw{white-space:nowrap}
/* 转置表里架构名那一整行：格子里只写个数，名字按人一行 */
.report table.dt.tp tr.wr td{padding:2px 12px 10px;white-space:normal;text-align:left;font-size:12.5px;line-height:1.5;color:var(--tx2)}
.report table.dt.tp tr.wr td>span{display:block}
.report table.dt.tp tr.wr td b{margin-right:6px;font-weight:700;color:var(--tx)}
.report table.dt tr.gh th{padding:14px 12px 6px;font-size:12px;font-weight:700;color:#fff;border-bottom-color:var(--ln2)}
/* 导出 PDF 战报（printPrep 给 html 加 .prt）：只印战报，深色底整页铺满，所有档案摊开 */
@media print{
  @page{size:A4;margin:0}
  html.prt,html.prt body{background:#0b0f17!important;margin:0!important}
  html.prt,html.prt *{-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important}
  html.prt body>*:not(#modal){display:none!important}
  html.prt #modal{position:static!important;display:block!important;padding:0!important;background:none!important}
  html.prt #modal .box{max-height:none!important;height:auto!important;overflow:visible!important;box-shadow:none!important;border:0!important;max-width:none!important;width:auto!important;padding:24px!important}
  html.prt #modal .box>h3,html.prt #modal .btns,html.prt .report .dtabs,html.prt .report .rp-foot,html.prt .report .dsr>.sx-h .tag{display:none!important}
  html.prt .report .dp::before{content:attr(data-ttl);display:block;margin:18px 0 10px;padding-bottom:6px;border-bottom:1px solid rgba(255,255,255,.18);font-size:17px;font-weight:700;color:#fff}
  html.prt .report *{animation:none!important;transition:none!important}
  html.prt .report .sx,html.prt .report li,html.prt .report tr{break-inside:avoid}
}
/* 点「导出对局记录」后重画的那一次不再放横条动画 */
.report.again .rk .bar i{animation:none}
.report .rp-foot{margin:28px 0 14px;font-size:13px;color:var(--tx3)}
@media (prefers-reduced-motion:reduce){.report .rk .bar i{animation:none}.report details.more summary::before{transition:none}}

/* 平板竖屏和更窄：总览上下排，关键时刻在本局之最下面 */
@media (max-width:900px){
  .report .ov{grid-template-columns:minmax(0,1fr)}
  .report .ov>.ld{max-width:560px}   /* 占满一整行时点线太长，眼睛从外号走到人名要扫半屏：清单收窄一点 */
}
/* 手机（竖屏和横屏）：标题栏、按钮栏收薄（按钮照旧 44px 高、排一行），抬头框和档案框收紧 */
@media (max-width:640px),(max-height:520px) and (orientation:landscape){
  #modal:has(>.box.rep){padding:8px}
  .box.rep{--rh:44px;max-height:calc(100vh - 16px);max-height:calc(100svh - 16px)}
  .box.rep>h3{padding:0 4px 0 16px;font-size:15px}
  .box.rep>h3 .minbtn{min-height:44px;padding:0 10px;border-color:transparent;font-size:13px}
  .box.rep .btns{flex-wrap:nowrap;gap:8px;padding:8px 12px calc(8px + env(safe-area-inset-bottom))}
  .box.rep .btns button{min-height:44px;padding:0 20px;white-space:nowrap}
  .report{padding:16px 14px 6px}
  .report .rp-top{padding:40px 16px 18px}
  .report h2{gap:10px;font-size:32px}
  .report h2 .pawn{width:28px;height:28px;font-size:14px}
  .report .rp-sub{font-size:14px}
  .report .rp-facts{gap:2px 16px}
  .report .rk{margin-top:20px;gap:18px}
  .report .ov{margin-top:32px;gap:32px}
  .report .dsr{margin-top:36px}
  .report .dtabs{margin-bottom:16px}
  .report .dz{padding:40px 16px 18px}
  .report .dz-h{gap:14px 24px;padding-bottom:16px}
  .report .dz-r1{margin-top:18px}
  .report .dz-ar{margin-top:26px}
  .report .dz-t{margin-top:26px;padding-top:18px}
  .report .tr-f{margin-right:70px;margin-left:46px}
  .report .tr-cap{margin-left:-46px}
  .report .tr-c{height:120px}
  .report details.more{margin-top:32px}
  .report table.dt th,.report table.dt td{padding:8px 10px}
  .report .rp-foot{margin-top:22px}
}
/* 竖屏手机：三个按钮、切换条的每个棋子都平分一份宽；档案抬头的几个数排成两列 */
@media (max-width:640px){
  .box.rep .btns button{flex:1 1 0;min-width:0;padding:0 8px}
  .report .dtabs button{flex:1 1 0;justify-content:center;gap:4px;padding:0 4px;font-size:14px}
  .report .dz-k{display:flex;flex-wrap:wrap;gap:4px 24px;width:100%}
  .report .dz-k div{display:flex;align-items:baseline;gap:8px}
  .report .dz-k dd{margin:0}
  .report .dz-k dd b{font-size:18px}
  .report .dz-x{row-gap:2px}
  .report .tr-cap span{display:block;margin:2px 0 0}
  .report details.more summary{flex-wrap:wrap;row-gap:0;padding:6px 0}
}
/* 平板竖屏和手机：每人明细一行一个人的宽表放不下（要横着滑），换成一列一个玩家的转置表 */
@media (max-width:800px){
  .report table.dt.pp{display:none}
  .report table.dt.tp{display:table}
}
/* 手机（≤480px）：两张表都按固定列宽排，四个人不用横着滑；估值拆分收掉「怎么算」一列（公式在上面那段说明里） */
@media (max-width:480px){
  .report table.dt.vb .how{display:none}
  .report table.dt.vb,.report table.dt.tp{table-layout:fixed}
  .report table.dt.vb thead .pn,.report table.dt.tp thead .pn{width:5.6em}
  .report table.dt.vb thead .n,.report table.dt.tp thead .n{width:auto}
  .report table.dt.tp{width:100%}
  .report table.dt.vb th,.report table.dt.vb td,.report table.dt.tp th,.report table.dt.tp td{padding:7px 4px}
  .report table.dt.vb .pn,.report table.dt.tp .pn{position:static;white-space:normal;word-break:keep-all;padding-left:0;line-height:1.35}
  .report table.dt.vb .vh,.report table.dt.tp .vh{display:flex;flex-direction:column;align-items:flex-end;gap:3px}
  .report table.dt.vb .vh>span,.report table.dt.tp .vh>span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .report table.dt.tp tr.gh th{padding:14px 0 6px}
  .report table.dt.tp tr.wr td{padding:2px 0 10px}
  .report .dt-x{overflow-x:visible}
}
/* 360 宽：「导出对局记录」显示成「导出记录」，三个按钮排得下一行；切换条里的名次数字省掉 */
@media (max-width:380px){
  .box.rep .btns button .xl{display:none}
  .report .dtabs button .n{display:none}
  .report h2{font-size:30px}
}
/* 手机横屏：按钮栏上下只留 4px，标题小一号，正文多出一截 */
@media (max-height:520px) and (orientation:landscape){
  .report .dtabs{position:static}
  .box.rep .btns{padding:4px 12px calc(4px + env(safe-area-inset-bottom))}
  .report h2{font-size:30px}
  .report .rp-top{padding-top:38px}
}
@media (pointer:coarse){.box.rep .btns button,.box.rep>h3 .minbtn{min-height:44px}}
/* 结束后台面中间的最终排名：白底细线，名次和估值用等宽数字对齐 */
.fin{width:min(100%,320px);font-size:14px}
.fin-h{display:flex;align-items:baseline;justify-content:space-between;flex-wrap:wrap;gap:2px 10px;padding:0 4px 6px;border-bottom:2px solid var(--ink2)}
.fin-h b{display:inline-flex;align-items:center;gap:6px;font-size:17px;color:var(--ink)}
.fin-h b .pawn{width:18px;height:18px;font-size:10px;align-self:center}
.fin-h small{color:var(--mut2);font-size:12px;white-space:nowrap}
.fin ol{list-style:none;margin:0;padding:0}
.fin li{display:grid;grid-template-columns:1.4em 20px minmax(0,auto) 1fr auto;align-items:center;gap:8px;padding:5px 6px;border-bottom:1px solid var(--line2)}
.fin li .r{font:700 13px/1 var(--mono);color:var(--mut2);text-align:center}
.fin li b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fin li small{color:var(--mut2);font-size:12px;white-space:nowrap}
.fin li .v{grid-column:5;font:700 14px/1 var(--mono);font-variant-numeric:tabular-nums;text-align:right}
.fin li.win{background:var(--warning-bg);box-shadow:inset 3px 0 0 var(--orange)}
.fin li.win .r{color:#a84b00}
.fin li.out b,.fin li.out .v{color:var(--mut2)}
@media (max-width:900px),(max-height:500px) and (orientation:landscape){
  #center .stage>.fin{grid-row:2/11;grid-column:2/15;justify-self:center;align-self:center;width:min(calc(var(--cw) * 11.5),340px);font-size:13px}
  .fin li{padding:3px 6px}
  .fin-h b{font-size:15px}
}
/* 竖着的平板：回合条结束后不显示，排名表放大一号，占棋盘中间那块 */
@media (min-width:600px) and (max-width:900px) and (orientation:portrait){
  #center .stage>.fin{width:min(calc(var(--cw) * 12),420px);font-size:15px}
  .fin-h b{font-size:18px}
  .fin li{padding:6px 8px}
  .fin li .v{font-size:15px}
}
@media (max-height:500px) and (orientation:landscape){.fin{font-size:12px}.fin li{padding:1px 4px;gap:6px}.fin-h{padding-bottom:3px}.fin-h b{font-size:13px}.fin .pawn{width:16px;height:16px;font-size:10px}.fin li .v{font-size:12px}}
/* 结束后右栏：赢家的估值一项一项列出来，解释中间为什么写 $4030、右边玩家卡上只有 $2010 现金 */
.cright .fval{width:100%;max-width:260px;font-size:13px}
.cright .fval th,.cright .fval td{padding:3px 0;border-bottom:1px solid var(--line2);background:none}
.cright .fval th{font-weight:400;color:var(--mut);font-size:12.5px}
.cright .fval td{text-align:right;font:13px var(--mono);font-variant-numeric:tabular-nums}
.cright .fval tfoot th,.cright .fval tfoot td{border-top:2px solid var(--ink2);border-bottom:0;font-weight:700;color:var(--ink)}
.cright h4.fv-h{margin-top:12px}

.box h3 .minbtn{font-weight:600;color:var(--blue);border-color:#b8d7f0;background:var(--info-bg)}
.box h3 .minbtn:hover{border-color:var(--blue)}
.modal.min .box h3 .minbtn{background:var(--info-fill);color:#fff;border-color:var(--blue)}
.modal.min .box{border-top:3px solid var(--blue)}

.tiles.dlc .tile.qdlc{border-left:3px solid #0972d3}
.wbtag{display:inline-block;font-size:12px;font-weight:700;color:var(--warning-ink);background:var(--warning-bg);border:1px solid #f5c69a;padding:1px 8px;margin:0 0 6px}
.prac .bar{height:8px;background:var(--surface-muted);width:180px}.prac .bar i{display:block;height:100%;background:#1d8102}
.log .lt{display:inline-block;min-width:62px;margin-right:6px;font-size:11px;color:var(--mut2);font-variant-numeric:tabular-nums}

.ledbtn{margin-top:8px}
.ledger .lsum{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px;margin-bottom:12px}
.ledger .lsum div{border:1px solid var(--line);padding:6px 10px;background:var(--surface-soft)}
.ledger .lsum small{display:block;font-size:11px;color:var(--mut2)}
.ledger .lsum b{font-size:17px;font-variant-numeric:tabular-nums}
.ledger td{font-size:13px;vertical-align:middle}
.ledger td img.awsi{width:20px;height:20px;vertical-align:-5px;margin-right:6px}
.ledger td small{color:var(--mut2);margin-left:4px}
.ledger td:first-child{white-space:nowrap}
.ledger .llog{max-height:260px;overflow:auto;border:1px solid var(--line2);padding:6px 8px;font-size:13px}
/* 收费明细表 7 列：手机上撑宽的是整个弹窗（标题、「关闭」跟着横滑，最右一列被切）。照图鉴的宽表那样只让表格自己横滑、第一列钉住，
   滑到右边也知道是哪块服务；表头不在字中间断开；运行费「$5/圈 · 累计 $0」不折成四行 */
.ledger th{word-break:keep-all}
@media (max-width:700px){
  .ledger table{display:block;overflow-x:auto;overscroll-behavior-x:contain;isolation:isolate}
  .ledger table>tbody{display:table;width:100%}
  .ledger td:first-child,.ledger th:first-child{position:sticky;left:0;z-index:1;background:var(--surface)}
  .ledger th:first-child{background:var(--surface-soft)}
  .ledger td:nth-child(6){white-space:nowrap}
}

.tiles:has(input[value=party]){grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.mulrow{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;margin-top:10px;font-size:13px}
.mulrow label{display:flex;align-items:center;gap:4px;cursor:pointer}
.sq.blind{background:var(--warning-bg)}
.sq.blind .nm{color:var(--warning-ink);font-weight:800}
/* ===== 平板和手机（联机时常用手机加入） ===== */
@media (max-width:1200px){
  #side{width:100%!important;max-height:none;display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px;position:static}
  #board{width:min(calc(100vw - 64px),calc((100vh - 88px) * 1.345))!important;min-width:0!important}
  .frame{max-width:100%}
  .logpanel{position:relative;bottom:auto;box-shadow:none}
}
@media (max-width:900px),(max-height:500px) and (orientation:landscape){
  #game{padding:8px;gap:12px}
  .frame{padding:34px 6px 6px;width:100%}
  #board{--cw:calc((100vw - 34px) / 15.6);width:100%!important;aspect-ratio:auto!important;grid-template-rows:calc(var(--cw) * 1.3) repeat(9,var(--cw)) calc(var(--cw) * 1.3) auto!important;grid-template-columns:calc(var(--cw) * 1.3) repeat(13,var(--cw)) calc(var(--cw) * 1.3)!important}
  #center,#center *{min-width:0}
  #center .gm{min-width:160px}   /* 上一条会把「对局」下拉压成 summary 那么窄，菜单项两个字一折；要 id + class 才压得过 */
  .sq{min-width:0;overflow:hidden}
  #center{grid-row:12!important;grid-column:1/-1!important;border-left:1px solid var(--line);padding:12px!important;gap:12px!important}
  .sq{position:relative;padding:1px!important;gap:0!important;flex-direction:column!important;justify-content:center!important;align-items:center!important}
  .sq .txt,.sq .bill,.sq .lv,.corner .nm,.corner .pr{display:none!important}
  .sq .art img.awsi,.sq.l .art img.awsi,.sq.r .art img.awsi{width:calc(var(--cw) * .7)!important;height:calc(var(--cw) * .7)!important}
  .sq.g::before{display:none}
  #board .sq.owned::before{content:'';display:block;position:absolute;left:0;right:0;top:auto;bottom:0;width:auto;height:3px;background:var(--oc)}   /* 主人色条用 ::before，::after 留给「补齐」角标 */
  .toks .pawn{width:12px;height:12px;font-size:8px}
  .sq .toks.many .pawn{width:9px;height:9px;font-size:6px}
  .c-head{flex-direction:column;gap:8px}
  .c-head .gtitle h1{font-size:18px!important}
  .c-head .sub{font-size:12px}
  .cmain{display:flex!important;flex-direction:column;gap:14px}
  .cleft{grid-template-columns:1fr 1fr!important}
  .cleft .stack{aspect-ratio:auto;max-height:none;flex-direction:row;flex-wrap:wrap;justify-content:flex-start;padding:10px;gap:4px 8px}
  .cleft .stack span{flex-basis:100%;padding-left:38px}
  .cleft .stack img.awsi{width:30px;height:30px}
  .cleft .stack b{font-size:13px}.cleft .stack span{font-size:12px}
  .stage .who{font-size:18px}.stage .st{font-size:13px}
