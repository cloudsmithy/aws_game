/* 封面那条架构：上面 5 块服务和下面 10 个色组排成同样宽的 5 列，上下对齐 */
.hero .flow{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;align-items:start}.hero .flow .link{display:none}.hero .flow .node{position:relative}
.hero .flow .node:not(:last-of-type)::after{content:'';position:absolute;top:21px;left:calc(50% + 30px);width:calc(100% - 50px);height:2px;background:repeating-linear-gradient(90deg,#ffb36b 0 6px,transparent 6px 12px);background-size:24px 2px;animation:hflow 1.2s linear infinite;opacity:.8}
.hero .cats{grid-template-columns:repeat(5,minmax(0,1fr))}.hero .cat span{overflow:hidden;text-overflow:ellipsis}
/* 英文版、日文版：字长，对局中间的标题只留「Cloud Tycoon」「クラウドタイクーン」（全名在网页标题和封面上），封面色组名字可以折成两行 */
html:is([lang=en],[lang=ja]) .c-head .gt-pre{display:none}
/* 对局顶上的标题放不下时整词折行（「亚马逊云科技 User Group」/「云上大亨」），不把「云上大亨」拆开 */
.c-head .gtitle h1{word-break:keep-all}
/* 日文版：汉字用日文字形（别让 PingFang SC 先接住） */
html[lang=ja]{--sans:'Amazon Ember',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,'Hiragino Sans','Hiragino Kaku Gothic ProN','Yu Gothic UI','Yu Gothic',Meiryo,'Noto Sans JP',sans-serif}
/* 语言按钮和它的下拉菜单 */
.langsw{display:inline-flex;align-items:center;gap:5px}.langsw .lc{font-style:normal;font-size:10px;color:var(--mut2)}
#langmenu{position:fixed;z-index:2147481000;min-width:168px;padding:4px;background:var(--surface);border:1px solid var(--line);box-shadow:0 8px 24px rgba(0,28,36,.18)}
#langmenu button{display:flex;align-items:center;justify-content:space-between;gap:16px;width:100%;min-height:34px;padding:6px 12px;border:0;background:var(--surface);color:var(--ink);font:inherit;font-size:14px;text-align:left;cursor:pointer}
#langmenu button:hover{background:var(--info-bg);outline:none}#langmenu button:focus-visible{background:var(--info-bg);outline:2px solid var(--focus);outline-offset:-2px}#langmenu button[aria-checked=true]{font-weight:700}#langmenu button i{font-style:normal;color:var(--blue)}
@media (pointer:coarse){#langmenu button{min-height:44px}}
html:is([lang=en],[lang=ja]) .hero .cat span{white-space:normal;overflow:visible;line-height:1.15;font-size:12px}
/* 日文版封面：片假名的标题一行放下（不在词中间折行）；色组排三列，名字一行放得下，不在词中间折行（再窄就省略号，悬停看全名） */
html[lang=ja] .hero h1 span{font-size:min(clamp(40px,4.1vw,64px),calc((100vw - 48px) / 9.8));white-space:nowrap;letter-spacing:.02em}
/* 日文版对局中间：帮助按钮的字比中文长，棋盘窄的时候（窗口矮、棋盘被压小）标题和按钮上下排，按钮折行，别把中间撑出棋盘 */
html[lang=ja] .todo button{flex:0 1 auto;max-width:100%}   /* 右栏窄的时候按钮里的字折行，不被裁掉 */
@container (max-width:820px){html[lang=ja] .c-head{flex-direction:column;gap:6px}html[lang=ja] .c-head .meta{max-width:100%;justify-content:flex-start}html[lang=ja] .c-head .tgrp{flex-wrap:wrap}}
html[lang=ja] .hero .cats{grid-template-columns:repeat(3,minmax(0,1fr))}html[lang=ja] .hero .cat{gap:6px;padding:7px 6px}html[lang=ja] .hero .cat span{font-size:11.5px;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* 角落格：名字最多两行，放不下就省略号；英文名字长，字收小一点，下面一行说明照样露得出来（全文在格子的悬停提示里） */
.corner .nm{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;text-align:center}
html:is([lang=en],[lang=ja]) .corner .nm{font-size:.92cqw;line-height:1.12}html:is([lang=en],[lang=ja]) .sq.corner .pr{font-size:.72cqw}
/* 四角先保留标题和说明的行高，图标使用剩余高度；棋盘铺满窗口时不能按宽度把文字挤扁。 */
.sq.corner{display:grid;grid-template-rows:minmax(0,1fr) auto auto;justify-items:center;padding:min(.6cqw,6px);gap:min(.3cqw,4px)}
.corner .art{height:100%;min-height:0;max-width:100%;display:flex;align-items:center;justify-content:center}
.corner .art img.awsi{max-height:100%;max-width:100%;object-fit:contain}
.corner .nm,.sq.corner .pr{max-width:100%;min-width:0;margin:0}
.sq .nm{overflow-wrap:anywhere}
@media (min-width:1201px) and (min-height:501px){
  .corner .nm{font-size:min(1.15cqw,1.8vh)}
  .sq.corner .pr{font-size:min(.74cqw,1.3vh)}
  html:is([lang=en],[lang=ja]) .corner .nm{font-size:min(.92cqw,1.8vh)}
  html:is([lang=en],[lang=ja]) .sq.corner .pr{font-size:min(.72cqw,1.3vh)}
}
/* 英文版对局中间：帮助按钮收紧一点，让左边的对局信息少折几行；玩家条去掉中间的箭头，四个人尽量一行放下 */
html:is([lang=en],[lang=ja]) .c-head .tgrp button,html:is([lang=en],[lang=ja]) .c-head .gmenu summary{padding-left:8px;padding-right:8px}
html:is([lang=en],[lang=ja]) .c-head .sub{font-size:12px;line-height:1.45}
html:is([lang=en],[lang=ja]) .turnbar{gap:4px}html:is([lang=en],[lang=ja]) .turnbar .tbar{display:none}html:is([lang=en],[lang=ja]) .turnbar .tb{padding:3px 8px 3px 5px;gap:5px;font-size:12.5px}
@media (prefers-reduced-motion:reduce){.hero .flow .node::after{animation:none}}
.ggrps{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0 4px}
.ggc{display:inline-flex;align-items:center;gap:7px;height:30px;padding:0 10px;border:1px solid var(--line);border-left:3px solid var(--gc);border-radius:0;background:var(--surface);color:var(--ink2);font:inherit;font-size:12.5px;font-weight:700;cursor:pointer}
.ggc i{display:none}.ggc b{font-weight:500;color:var(--mut2);font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px}.ggc em{font-style:normal;color:var(--warning-ink);font-size:12px}
button.ggc:hover{border-color:var(--ink);border-left-color:var(--gc)}button.ggc.on{background:#232f3e;border-color:#232f3e;border-left-color:var(--gc);color:#fff}button.ggc.on b{color:#d5dbdb}
span.ggc.wild{border-style:dashed;border-left-style:solid;cursor:help}.svc-intro .sv-gal a{font-weight:700;text-decoration:none}.svc-intro .sv-gal a:hover{text-decoration:underline}
.box.doc .mb tr.gflash>td{animation:gflash 2s ease-out}@keyframes gflash{0%,35%{background:var(--warning-bg)}100%{background:transparent}}
@media (prefers-reduced-motion:reduce){.box.doc .mb tr.gflash>td{animation:none;background:var(--warning-bg)}}
.gitem-empty{padding:16px;text-align:center}
.glegend{display:flex;flex-wrap:wrap;gap:6px 18px;margin:8px 0 10px;padding:8px 12px;background:var(--surface-soft);border:1px solid var(--line2);font-size:12.5px;line-height:1.5;color:var(--mut)}
.glegend span{display:inline-flex;align-items:center;gap:6px}
.glegend b{display:inline-flex;align-items:center;justify-content:center;min-width:22px;height:20px;padding:0 4px;border:1px solid var(--line2);background:var(--surface);color:var(--ink);font-size:12px}
.glegend i.lg-opt{font-style:normal;padding:0 6px;border:1.5px dashed #879596;font-size:11px;line-height:17px;color:var(--mut);background:var(--surface)}
.gwild{margin:0 0 4px;padding:8px 14px;background:var(--surface-soft);border:1px solid var(--line2);border-left:3px solid #687078;border-radius:0 4px 4px 0;font-size:12.5px;line-height:1.7;color:var(--mut)}
.gwild summary{cursor:pointer;list-style:none;color:var(--mut)}.gwild summary::-webkit-details-marker{display:none}.gwild summary b{margin-right:8px;color:var(--ink)}.gwild summary::after{content:'展开';margin-left:8px;color:var(--blue);font-weight:600}.gwild[open] summary::after{content:'收起'}
.gwild ul{margin:6px 0 2px;padding-left:18px}
table.gwho{table-layout:fixed;width:100%}table.gwho th:first-child,table.gwho td:first-child{width:8em}table.gwho td{min-width:0}
@media (max-width:900px){.gac-links{margin-left:0;width:100%}.gacard{padding:10px 12px 12px}}
@media (max-width:600px){.arg{flex-wrap:wrap}}   /* 手机上架构图一行放不下就折行，不再缩到看不清 */
.box.doc .mb tr.ggrp>th{padding:14px 12px 8px;background:var(--surface);border-bottom:1px solid var(--line);font-size:13.5px;color:var(--ink);text-align:left}
.box.doc .mb tr.ggrp>th small{margin-left:10px;font-size:12px;font-weight:400;color:var(--mut2)}
.box.doc .mb tr.ggrp[hidden]{display:none!important}
.box.doc .mb td:first-child{min-width:8.5em}
/* 图鉴里 Health、re:Invent 表第一列只是编号，不吃上面的 8.5em，省下的宽度给类别和正文 */
.box.doc .mb td.no{min-width:0;width:2.5em}
.box.doc .mb td.cat{white-space:nowrap}
/* 手机上宽表（图鉴的服务一览、角色，完整版手册的角色、服务类型）只让表格自己横滑：原来撑宽的是整个弹窗，
   一横滑标题栏、章节标签、「关闭」和第一列一起滑出屏幕。第一列钉住，滑到右边也知道是哪一行。
   表格自成一层（isolation），钉住的格子往上滚时不会盖到标题栏、章节标签上面 */
@media (max-width:700px){
  .box.doc .mb table{display:block;overflow-x:auto;overscroll-behavior-x:contain;isolation:isolate}
  .box.doc .mb table>tbody{display:table;width:100%}   /* 表格本身成了块，内容窄的表不再撑满整行；里面那层照旧铺满 */
  .box.doc .mb td:first-child,.box.doc .mb th:first-child{position:sticky;left:0;z-index:1;background:var(--surface)}
  .box.doc .mb th:first-child{background:var(--surface-soft)}
}

/* ===== 第四轮润色（UI/UX 复查）===== */
/* 开局页：代理商勾选只在代理商模式里出现；座位那一行放不下就换行 */
.rsopt[hidden]{display:none!important}
.rsopt.off{opacity:.45;cursor:not-allowed}
.nrow{flex-wrap:wrap;row-gap:4px}
.nrow input[type=checkbox]{flex:none}
.nrow input[id^=nm]{flex:1 1 120px}
/* 单选、复选框太小不好点：放大到 18px，用主题橙 */
#setup input[type=radio],#setup input[type=checkbox]{width:18px;height:18px;accent-color:var(--orange);flex:none;margin:0}
.aiopt{min-height:32px;gap:6px}
/* 对局页顶栏：标题和说明可以折行，右边的帮助按钮不许被挤成一个字一行 */
.c-head .gtitle{flex:1 1 auto;min-width:0}
.c-head .meta{flex:none}
.tgrp button,.gmenu summary{white-space:nowrap}
/* 灰掉的按钮字太浅：加深一点，看得清写的是什么。主按钮要单独列上（开头那条 button.pri:disabled 优先级更高，不列就还是白底浅字），和操作区的 .off 统一成一个样子 */
button:disabled,button.pri:disabled{color:var(--mut2);background:var(--surface-muted);border-color:var(--line)}
/* 操作按钮之间至少 8px，高度够点 */
.stage .row.more{gap:8px!important}
.stage .row.more button{min-height:36px}

/* ===== 第五轮润色 ===== */
/* 开局角色卡：两面叠在同一个 grid 格子里，卡高跟着同一行最长的那张走。原来固定 480px，独立开发者、金融合规的地狱限制被裁掉（滚动条是隐藏的，看不出能滚），手机上短卡底下又空一大块 */
.rcard{height:auto;min-height:300px}
.rc-in{display:grid}
.rc-back,.rc-front{position:relative;inset:auto;grid-area:1/1}
.rc-front{justify-content:flex-start}
.rc-front .rc-ab,.rc-front .rc-wk{font-size:12px;line-height:1.45}
/* 手机：棋盘下面那几块不许比屏幕宽（按钮、回合条、牌堆原来会把整列撑出屏幕） */
@media (max-width:900px),(max-height:500px) and (orientation:landscape){
  #center>.c-head,#center>.turnbar,#center .stage>.row.more,#center .stage>.here,#center .cleft,#center .cright{min-width:0;max-width:calc(100vw - 20px);box-sizing:border-box;overflow-wrap:anywhere}
  #center .stage>.row.more{grid-template-columns:repeat(2,minmax(0,1fr))!important}
  #center .stage>.row.more button{white-space:normal;line-height:1.25}
  #center .cleft{grid-template-columns:repeat(2,minmax(0,1fr))!important}
  #center .cright .kv{gap:8px}
  /* 320px 宽的手机上「玩法 / 图鉴 / 新手引导 / 快捷键 / 音效」一排放不下，原来会撑出十几 px 横向滚动 */
  #center>.c-head .meta{max-width:100%}
  #center>.c-head .tgrp{flex-wrap:wrap}
  /* 兜底：单项比一整行还宽（280px 的折叠屏上「经典 + Well-Architected + 限时 + 30 轮」那项）才在项里折行，放得下的照旧整项换行 */
  #center>.c-head .sub .mi{display:inline-block;max-width:100%;white-space:normal}
  /* DLC 那项保持 inline，名字之间能折行；手机上顶栏占满一整行，名单照常列全，不用缩写 */
  #center>.c-head .sub .mi:has(>.dnl){display:inline}
  #center>.c-head .sub .mi:has(>.dls)>.dnl{display:inline}
  #center>.c-head .sub .dls{display:none}
}
/* 触屏手机没有键盘，「快捷键」说明用不上；藏掉后 390px 宽的手机上帮助按钮和「对局」能放进一行 */
/* 触屏上不显示键盘快捷键：原来按 title 选中，而 title 是翻译过的，英日版选不中、按钮一直留在屏幕上。改挂 class */
@media (hover:none) and (pointer:coarse){.tgrp button.keyshelp{display:none}}
/* 手机上顶栏在标题下面单独一行：帮助按钮跟标题左对齐；「对局」始终贴右，下拉菜单（right:0）往里开，不会出屏 */
@media (max-width:900px),(max-height:500px) and (orientation:landscape){
  #center>.c-head .meta{justify-content:flex-start}
  #center>.c-head .gmenu{margin-left:auto}
}

/* ===== 第六轮润色 ===== */
/* 部署点数：技能卡片 */
.skbar{height:8px;background:var(--line2);position:relative;overflow:hidden}
.skbar span{position:absolute;left:0;top:0;bottom:0;width:var(--w);background:linear-gradient(90deg,#0972d3,#ec7211)}
.skgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px}
.sk{display:grid;grid-template-columns:auto 1fr;grid-template-rows:auto auto auto;gap:2px 8px;text-align:left;align-items:start;padding:10px 12px;min-height:92px;border:1px solid var(--line);background:var(--surface);white-space:normal;line-height:1.35}
.sk .skc{grid-row:1/3;font:700 20px/1 sans-serif;color:var(--blue);min-width:26px;text-align:center;padding-top:2px}
.sk b{font-size:14px}
.sk .skd{grid-column:2;font-size:12px;color:var(--ink2);font-weight:400}
.sk .skw{grid-column:1/-1;font-size:11.5px;color:var(--warning-ink);font-weight:600;margin-top:2px}
.sk.on{border-color:#0972d3;box-shadow:inset 3px 0 0 #0972d3;cursor:pointer}
.sk.on:hover{background:var(--info-bg)}
.sk.on.atk{border-color:#d13212;box-shadow:inset 3px 0 0 #d13212}.sk.on.atk .skc{color:var(--red)}.sk.on.atk:hover{background:var(--danger-bg)}
.sk:disabled{background:var(--surface-soft);color:var(--mut2)}.sk:disabled .skc{color:#aab7b8}.sk:disabled .skd{color:var(--mut2)}
.sk.react:disabled .skw{color:var(--blue)}
/* 欠款弹窗：先看数字 */
.debtsum{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--line);margin:0 0 10px}
.debtsum div{padding:10px 14px;border-right:1px solid var(--line2)}.debtsum div:last-child{border-right:0}
.debtsum small{display:block;font-size:12px;color:var(--mut2)}
.debtsum b{font-size:22px;font-variant-numeric:tabular-nums}
.debtsum b.hi{color:var(--red)}.debtsum b.ok{color:var(--green)}
.warnline{background:var(--danger-bg);border-left:3px solid var(--red);padding:8px 12px;margin:0 0 10px;font-weight:600}
ul.ways{margin:6px 0 8px;padding-left:20px}ul.ways li{margin:3px 0}
/* 资产管理：没集齐整组的小标签 */
.tagm{display:inline-block;font-size:11.5px;color:var(--mut2);border:1px dashed var(--line);padding:1px 6px;cursor:help;white-space:nowrap}
/* 「选一块」类弹窗：选项竖排、左对齐 */
.box.pick .btns{flex-direction:column;align-items:stretch}
.box.pick .btns button{justify-content:flex-start;text-align:left;width:100%}
/* 右侧栏：玩家卡收起后，日志填满下面的空白 */
@media (min-width:1201px){
  #side .plist{flex:0 1 auto}
  #side .logpanel{flex:1 1 22vh;min-height:22vh;max-height:none!important}
}

/* 玩家卡上的技能持续效果标签 */
.fxchip{display:inline-block;font-size:11.5px;font-weight:600;color:var(--blue);background:var(--info-bg);border:1px solid #b9d7f0;padding:0 6px;margin:2px 4px 0 0;white-space:nowrap}
.fxchip .warn{color:var(--red)}

.psneed{margin:0 0 6px;padding:5px 9px;border-radius:6px;background:var(--success-bg);border:1px solid #9fd38a;color:#1d6b00;font-weight:700;font-size:13px}
/* 深色模式：#1d6b00 是浅色底上的深绿，配深色的 --success-bg 只有 1.98:1 */
:root[data-theme=dark] .psneed{color:var(--green);border-color:#2f6b3f}
/* 日志上色（logRow）：人名是主人颜色的底色小块，比钱数、服务名都显眼；钱数绿是进账、红是花出去；获胜、破产、支柱达标整行带底色 */
/* 名字：照主人的颜色写，粗体；只有 1 号位的红色不用在名字上（像报错），这几处写成深色。不加框、不加圆点。旧存档里的日志也是 <b style="color:…">，一起管 */
.log b[style^="color:"],#modal .box:not(.rep) .mb b[style^="color:"],#vmodal .mb b[style^="color:"],#sqpop b[style^="color:"]{font-weight:800;white-space:nowrap}
:is(.log,#modal .box:not(.rep) .mb,#vmodal .mb,#sqpop) :is(b[style^="color:#c62a2f"],b[style^="color:#e5484d"]){-webkit-text-fill-color:#16191f}
.log .lm{font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums}.log .lm.up{color:var(--green)}.log .lm.dn{color:var(--red)}

.sec h5.h5sw{display:flex;align-items:center;gap:10px 14px;flex-wrap:wrap}.sec h5.h5sw>.h5ctl{margin-left:auto;display:flex;align-items:center;justify-content:flex-end;flex-wrap:wrap;gap:8px 12px}
.sec h5 .mulrow.hmul{margin:0;padding:4px 6px 4px 12px;border-radius:10px;background:var(--surface-soft);font-size:13px;font-weight:400;gap:8px;flex-wrap:nowrap}.sec h5 .mulrow.hmul b{font-size:13px}.sec h5 .mulrow.hmul select{font:inherit;padding:4px 8px;border:1px solid var(--line);border-radius:8px;background:var(--surface);cursor:pointer}.sec h5 .switch.hsw{margin:0;flex-wrap:nowrap;gap:8px;font-weight:400}.sec h5 .switch.hsw b{font-size:13px}.sec h5 .switch.hsw .muted{flex:none;font-size:12px}
.lvt td:first-child{min-width:7.5em}.lvt td:nth-child(2){min-width:6.5em}.lvt td{white-space:normal}
.lvt .lvp{display:block;font-size:12px;font-weight:600;color:var(--warning-ink)}
/* 服务面板（sqPanelHtml）：三个数一排、归谁一行、分节标题统一 */
.sp-kpi{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:10px 0}
.sp-k{border:1px solid var(--line2);border-radius:8px;padding:8px 10px;background:var(--surface-soft);min-width:0}
.sp-k small{display:block;font-size:12px;color:var(--mut)}.sp-k b{display:block;font-size:17px;line-height:1.3;color:var(--ink);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}.sp-k em{display:block;font-style:normal;font-size:11.5px;color:var(--mut2);line-height:1.35;margin-top:2px}
.sp-own{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;margin:0 0 10px;font-size:13px;color:var(--ink)}.sp-own.none{color:var(--mut)}
.sp-who{display:inline-flex;align-items:center;gap:6px;font-weight:800}.sp-who i{width:10px;height:10px;border-radius:50%;flex:none}
.sp-chip{font-size:12px;font-weight:700;padding:1px 7px;border-radius:999px;background:var(--surface-muted);color:var(--mut)}.sp-chip.imp,.sp-chip.ddos{background:var(--danger-bg);color:#b0281a}.sp-chip.off{background:var(--surface-muted);color:var(--mut)}.sp-chip.spot{background:var(--warning-bg);color:var(--warning-ink)}
#sqpop .sp-b h5,.sp-full h5{display:flex;align-items:baseline;gap:8px;margin:16px 0 6px;font-size:13px;font-weight:800;color:var(--ink)}#sqpop .sp-b h5 .muted,.sp-full h5 .muted{font-size:12px;font-weight:400}
.sp-cb{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}.sp-cb li{display:grid;grid-template-columns:1fr auto;gap:0 8px;padding:6px 9px;border:1px solid var(--line2);border-radius:6px;cursor:help}
.sp-cb li small{grid-column:1 / -1;font-size:12px;color:var(--mut)}.sp-cb li.done{background:var(--success-bg);border-color:#b7dfa9}.sp-cb .sp-pg{font-variant-numeric:tabular-nums;font-weight:700;color:var(--mut)}
.sp-hist{margin-top:14px}.sp-hist summary{cursor:pointer;font-size:13px;font-weight:700;color:var(--ink)}.sp-hist[open] summary{margin-bottom:6px}
.sp-full .sp-kpi{grid-template-columns:repeat(3,minmax(0,1fr))}.box.svcfull{max-width:720px}
.lvc{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.lvc li{border:1px solid var(--line2);border-radius:8px;padding:8px 10px;background:var(--surface)}.lvc li.cur{border-color:#0972d3;background:var(--info-bg)}
.lvc-h{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}.lvc-h b{font-size:13.5px;color:var(--ink)}.lvc-now{font-size:11.5px;font-weight:700;color:var(--blue)}.lvc-p{margin-left:auto;font-size:12.5px;font-weight:700;color:var(--warning-ink);white-space:nowrap}
.lvc-n{font-size:12.5px;color:var(--mut);margin-top:3px;font-variant-numeric:tabular-nums}.lvc-n b{color:var(--ink)}.lvc-up{margin-left:6px;color:var(--green);font-weight:700}
.lvc-e{font-size:12.5px;color:var(--ink);margin-top:3px}.lvc-d{font-size:12px;color:var(--mut2);margin-top:2px;line-height:1.45}
.mprow{display:flex;align-items:flex-start;gap:10px}.mprow>#mpbox{flex:0 1 auto;min-width:0}
.sec h5 .icotxt{display:inline-flex;align-items:center;gap:6px;font-weight:600}.sec h5 .icotxt svg{flex:none;color:var(--mut)}.sec h5 .icotxt:hover svg{color:currentColor}
/* 中间右栏：这回合还能做什么 */
.todo{flex-wrap:wrap}.todo>span:first-child{flex:1 1 11em;min-width:11em}
/* 按钮组不要 margin-left:auto：挤得下时 .todo 自己的 space-between 已经把它推到右边，
   挤不下换行后 auto 会把它钉在右边，而按钮多、填满一行的那几行看着是左对齐的，一栏里就参差不齐。
   去掉以后换行的按钮组一律从左边起，和上面的说明文字对齐。 */
.todo>.tb{display:flex;flex-wrap:wrap;gap:6px}
/* 过路费明细：联合收费是哪几块、各多少钱。原来只在格子的悬停提示里，点进服务看不到 */
.rentbk{list-style:none;margin:6px 0 10px;padding:0;display:flex;flex-direction:column;gap:4px}
.rentbk li{display:flex;align-items:center;gap:8px;padding:4px 8px;border:1px solid var(--line2);background:var(--surface-soft)}
.rentbk li.here{border-color:var(--orange)}
.rentbk li>span{flex:1 1 auto;min-width:0}
.rentbk li>b{flex:none;font-variant-numeric:tabular-nums}
.rentbk li>em{flex:none;font-style:normal;font-size:11px;color:var(--mut)}
.rentbk img.awsi{width:20px;height:20px;flex:none}
.rentbk li.tot{justify-content:flex-end;gap:4px;background:none;border:0;border-top:1px solid var(--line);font-weight:700;padding:6px 8px 0}
.todo.dim>span{color:var(--mut2);font-size:12.5px}
.briefline{font-size:12.5px;color:var(--mut2);margin:-2px 0 4px}
.todo{display:flex;align-items:center;justify-content:space-between;gap:8px;line-height:1.45;border-bottom:1px solid var(--line2)}
.todo:last-child{border-bottom:0}
.todo span{min-width:0}
.todo button{flex:none}
.todo.hot{font-weight:700;color:var(--warning-ink)}
/* 宽屏：右侧栏加宽，玩家卡排两列，日志多显示几条 */
@media (min-width:1800px){
  #game{grid-template-columns:minmax(0,1fr) 460px!important}
  #side .plist{display:grid!important;grid-template-columns:repeat(auto-fit,minmax(min(100%,210px),1fr));align-content:start;gap:12px}
  /* 双列卡片按侧栏宽度收缩；长译文换行，现金不足一行时移到下一行 */
  #side .pl .pacc{flex-wrap:wrap}
  #side .pl .pacc .pn{flex-basis:100px}
  #side .pacc .cash{margin-left:auto}
  #side .plist .parch .pnw,#side .plist .res .ri{white-space:normal;overflow-wrap:anywhere}
  #side .plist .pl.cur{grid-column:1/-1}
}

.cright:has(.todo){justify-content:flex-start;overflow:auto;min-height:0}
.todo{padding:4px 0;font-size:12.5px}

/* 服务详情：现在的状态 */
.pstat{width:100%;margin:10px 0 8px;border:1px solid var(--line);border-collapse:collapse;font-size:13px}
.pstat th{width:96px;text-align:left;font-weight:600;color:var(--mut2);background:var(--surface-soft);padding:6px 10px;vertical-align:top;white-space:nowrap}
.pstat td{padding:6px 10px;border-bottom:1px solid var(--line2);text-align:left!important}
.pstat tr:last-child td{border-bottom:0}
.pstat .runc .lvr{white-space:nowrap}.pstat .runc .cur{font-weight:700;color:var(--ink)}
.pstat .pawn{margin-right:6px}   /* 「谁拥有」一行的 td 不是 flex，圆点和名字之间要自己留空 */
.lvt th{white-space:nowrap}
.lvt td:nth-child(n+3){text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.lvt td:nth-child(3){font-weight:700}.lvt td:last-child{font-weight:400}
/* 窄屏：等级表按内容宽 358px，比弹窗内容区（320 宽时 286px）宽，原来是整个弹窗横向
   平移 103px，吸顶的标题和按钮跟着被拖出屏幕。改成表格自己横向滚 */
@media (max-width:480px){.lvt,.pstat{display:block;overflow-x:auto;max-width:100%}}
.lvt tr.hi td{background:var(--info-bg)}
.pscb{padding:2px 0;cursor:help}.pscb.done{color:var(--green)}.pscb.done b{color:var(--green)}

/* 手机：主按钮（掷骰子 / 轮到下一位 / 维护窗口里的选项）固定在屏幕底部，不用往下滚 */
#mbar{display:none}
@media (max-width:900px),(max-height:500px) and (orientation:landscape){
  /* 层级 7：要高过 3D 骰子（.dwrap.rolling3d 5）和对局菜单（.gm 6），但得低于飞行、UG 的夜空压暗（#fxdim 8），不然整屏压暗时底部一条亮白 */
  #mbar:not(:empty){display:flex;position:fixed;left:0;right:0;bottom:0;z-index:7;background:rgba(255,255,255,.97);border-top:1px solid var(--line);box-shadow:0 -4px 12px rgba(0,28,36,.08);padding:8px 12px calc(8px + env(safe-area-inset-bottom));justify-content:center;gap:8px}
  #mbar button{flex:1 1 0;max-width:340px;min-height:44px}
  #center .stage>.row:not(.more){display:none!important}
  /* 栏高按实际量（--mbar-h，见 minPlace 后面的 ResizeObserver）：维护窗口三个按钮、电脑回合名字长时会折到 110px 以上，写死 72px 盖住页面最后一截和收起的横条 */
  body:has(#mbar:not(:empty)){padding-bottom:var(--mbar-h,calc(72px + env(safe-area-inset-bottom)))}
  .modal.min{padding-bottom:calc(var(--mbar-h,calc(72px + env(safe-area-inset-bottom))) + 8px)}
  /* Tab 到最后一排按钮时浏览器按这个余量滚动，不然按钮正好被固定栏整个盖住（放大 200% 也一样） */
  html:has(#mbar:not(:empty)){scroll-padding-bottom:calc(var(--mbar-h,calc(72px + env(safe-area-inset-bottom))) + 12px)}
}
/* 竖屏手机：维护窗口带 Enterprise Support 时底栏三个按钮，挤一行每个才一百来 px，「掷骰子，争取对子」折成四行；主按钮占一整行，另两个并排。
   只管竖屏：568x320 这种横屏也不到 600 宽，横屏是右边竖排（下一段） */
@media (max-width:600px) and (orientation:portrait){#mbar:has(>button:nth-child(3)){display:grid;grid-template-columns:1fr 1fr}#mbar:has(>button:nth-child(3))>button:first-child{grid-column:1/-1}}
/* 手机横屏（高不到 500）：底部一条按钮栏要吃掉 60 多 px，棋盘只剩 21px 一格，左右却各空着两百多 px。主按钮改成右边一竖条，棋盘按整屏高度算；
   收起的弹窗横条也放进这一栏、贴在最上面那个按钮上方（底边距 minPlace 按按钮实际位置写），不再横着压住棋盘底排 */
@media (max-height:500px) and (orientation:landscape){
  #game{padding-right:200px}
  #mbar:not(:empty){left:auto;right:0;top:0;bottom:0;width:192px;flex-direction:column;justify-content:flex-end;border-top:0;border-left:1px solid var(--line);box-shadow:-4px 0 12px rgba(0,28,36,.08);padding:12px 10px calc(12px + env(safe-area-inset-bottom))}
  #mbar button{flex:none;max-width:none;width:100%}
  body:has(#mbar:not(:empty)){padding-bottom:0}
  html:has(#mbar:not(:empty)){scroll-padding-bottom:0}
  /* 下面几条只在对局里（右边有按钮栏时）：开局页底部那条「开始游戏」还在，toast、收起的横条照旧 */
  /* toast 中心挪到棋盘那块（扣掉 192px 按钮栏）的正中，宽度也得跟着扣，两边各留 12px：不然 568 宽时 520px 的长说明左边出屏、右边压住「轮到下一位」 */
  body:has(#mbar:not(:empty)) #toast{bottom:16px;left:calc(50% - 96px);max-width:min(520px,calc(100vw - 216px))}
  body:has(#mbar:not(:empty)) .modal.min{justify-content:flex-end;align-items:flex-end;padding:0 0 72px}
  body:has(#mbar:not(:empty)) .modal.min .box{max-width:192px}
  body:has(#mbar:not(:empty)) .modal.min .box h3{flex-direction:column;align-items:stretch;gap:6px;padding:10px;font-size:14px}
}
/* 矮桌面窗口（宽 1201 以上、高不到 500）也走横屏手机布局：解除固定高度，让棋盘下面的操作区能随页面滚动（PR #3，ratio-dd） */
@media (min-width:1201px) and (max-height:500px){
  #game{display:flex;height:auto;overflow:visible}
  .frame{height:auto}
  #side{width:100%;max-height:none}
  #side .plist{max-height:50vh}
}
/* 棋盘两侧竖排的格子：有主人时行数太多，省掉计费类型那一行（点格子能看到） */
.sq.l.owned .txt .bill,.sq.r.owned .txt .bill{display:none}
.sq.l .txt,.sq.r .txt{min-width:0}
.sq.l .rent .rk,.sq.r .rent .rk{display:none}

/* 宽屏右侧栏加宽后，两侧竖排的格子变窄：图标缩小，给名字和过路费腾地方 */
@media (min-width:1800px){
  .sq.l .art img.awsi,.sq.r .art img.awsi{width:2.2cqw!important;height:2.2cqw!important}
  .sq.l .txt .nm,.sq.r .txt .nm{font-size:.9em}
}
/* ===== 第七轮：布局 ===== */
/* 格子上的过路费标签：再长也不许压到隔壁格子 */
.rent{max-width:100%;overflow:hidden;text-overflow:ellipsis;box-sizing:border-box}
/* ===== 格子信息：主人、价格、联合收费、升级后不溢出 ===== */
/* 价格和主人名不小于 9px、颜色深一档，投影和大屏上也看得清 */
.pr,.ownr{font-size:max(.74cqw,9px)}
.pr{color:var(--mut)}
/* 过路费按整套架构联合收费：橙底，悬停看是哪几块加起来的 */
.rent.jr{background:var(--warning-bg);color:var(--warning-ink);box-shadow:inset .25cqw 0 0 var(--orange)}
.sq.impaired .rent.off{color:var(--warning-ink);font-weight:700}
/* 上下两排：文字区不比格子宽，过路费的省略号才生效；有主的格子和左右两列一样省掉类型字（点格子能看到），不然升级后被挤出格子底边 */
.sq.t .txt,.sq.b .txt{max-width:100%}
.sq.owned.t .bill,.sq.owned.b .bill{display:none!important}
/* 升级方块后面跟着加的容量「+2」；上下两排竖着贴右上角，不压文字 */
.lvh{align-items:center}
.lvh .capn{font-size:max(.58cqw,8px);line-height:1;color:var(--blue);font-weight:700}
/* 3 级加容量时这一列有 3 个方块加「+N」，比图标高；方块、间距收小，再往上提，「+N」才不落到名字那一行 */
.sq.t .lvh,.sq.b .lvh{left:auto;bottom:auto;right:.3cqw;top:.35cqw;flex-direction:column;gap:.12cqw}
.sq.t .lvh i,.sq.b .lvh i{width:.6cqw;height:.6cqw;min-width:4px;min-height:4px}
.sq.l .lvh,.sq.r .lvh{left:.75cqw}   /* 左右两列让开格子边上的主人色条和组色条 */
/* 左右两列的方块横排在图标下面，右边紧挨着文字：棋盘不大时和原来的容量字一样不标「+N」（点格子看）；大棋盘把方块收小，「+N」才不伸到文字下面 */
@container (max-width:1250px){.sq.l .lvh .capn,.sq.r .lvh .capn{display:none}}
@container (min-width:1251px){
  .sq.l .lvh,.sq.r .lvh{gap:.12cqw}
  .sq.l .lvh i,.sq.r .lvh i{width:.6cqw;height:.6cqw}
}
/* 上下两排有主的格子不单列 DLC 倍率：已经算进过路费，悬停过路费能看到。没人买的格子没有过路费标签，照旧显示 */
.sq.owned.t .dlcm,.sq.owned.b .dlcm{display:none}
/* 上下两排格子窄：过路费只写数字（左右两列一直这样） */
@container (max-width:1450px){.sq.t .rent .rk,.sq.b .rent .rk{display:none}}
/* 上下两排行高收一点：名字两行的（Backup、Config）升到有等级徽章时，最后一行才不压到色条上 */
.sq.t .txt,.sq.b .txt,.sq.t .nm,.sq.b .nm{line-height:1.1}
/* 再窄：等级只看方块，徽章不占行；按 token 收的换成「≈$xx」；图标收一点 */
.rent .tk2{display:none}
@container (max-width:1100px){
  .sq.t .lv,.sq.b .lv{display:none!important}
  .sq.t .rent .tk,.sq.b .rent .tk{display:none}
  .sq.t .rent .tk2,.sq.b .rent .tk2{display:inline}
  .sq.t .art img.awsi,.sq.b .art img.awsi{width:2.9cqw;height:2.9cqw}
}
/* 宽屏（1920 以上）：棋盘宽度涨得比高度快，字号跟着宽度变大，上下两排的图标收一点，升级、加容量后才放得下 */
@container (min-width:1300px){.sq.t .art img.awsi,.sq.b .art img.awsi{width:2.6cqw;height:2.6cqw}}
/* 手机：格子只剩图标，升级方块照旧横排在左下角，容量不标（点格子看）。竖着的平板（740–900）格子上有字，见后面那段 */
@media (max-width:900px),(max-height:500px) and (orientation:landscape){
  .sq.t .lvh,.sq.b .lvh{left:.35cqw;right:auto;top:auto;bottom:.35cqw;flex-direction:row;gap:.18cqw}
  .sq.t .lvh i,.sq.b .lvh i{width:.75cqw;height:.75cqw;min-width:5px;min-height:5px}
  .lvh .capn{display:none}
}
/* 矮屏（1280×720、1366×768）：上下两排格子更矮，再收图标和上边距。再矮（≤500）就是上面的手机横屏布局了，不归这里管 */
@media (min-width:1201px) and (min-height:501px) and (max-height:700px){
  .sq.t,.sq.b{padding-top:.5cqw;gap:.2cqw}
  .sq.g.b{padding-top:.8cqw}
  .sq.t .art img.awsi,.sq.b .art img.awsi{width:2.5cqw;height:2.5cqw}
  /* 名字离格子上边只剩 3cqw 出头，3 级加容量那一列再收一点 */
  .sq.t .lvh,.sq.b .lvh{top:.25cqw;gap:.1cqw}
  .sq.t .lvh i,.sq.b .lvh i{width:.5cqw;height:.5cqw}
}
/* 上下两排和四角一样先给文字留空间，避免主人、过路费被 Flex 压成半行。 */
@media (min-width:901px) and (min-height:501px){
  .sq.t,.sq.b{display:grid;grid-template-rows:minmax(0,1fr) auto;justify-items:center;padding:2px min(.4cqw,4px);gap:2px}
  .sq.t .art,.sq.b .art{height:100%;min-height:0;display:flex;align-items:center;justify-content:center}
  .sq.t .art img.awsi,.sq.b .art img.awsi{max-height:100%;max-width:100%;object-fit:contain}
  .sq.t .txt,.sq.b .txt{width:100%}
  /* 同一排的图标排成一条线：原来第一行是 minmax(0,1fr)，图标在「文字用剩的空间」里居中，
     文字几行就决定图标多高 —— re:Invent、Health 事件只有一行字，图标比邻居低 20px；
     娱乐模式的盲盒格字少，也会散开 6px。改成给文字行固定高度、再把没有色组条的格子内边距补齐，
     图标带高度就和文字多少无关，一排里图标和名字都落在同一条线上。
     行高取 max(4.3cqw,46px)：字号带 10px 下限，窗口小到 1280 宽时字不再跟着缩，
     纯 cqw 的行高会把 NAT Gateway 账单那格裁掉 7px，所以要有 px 兜底。
     实测各档需要的最大高度：2560→83px、1920→57px、1600→48px、1440→45px、1366/1280→44px。
     左右方向：原来只写了 grid-template-rows，隐式列按内容宽度收缩并靠左，justify-items:center
     只能把内容在这条窄列里居中，所以名字短的格子（EBS、WAF、DMS）整块内容朝左偏 20px。
     补一条 grid-template-columns 让列铺满格子，内容才真的在横向正中。 */
  .sq.t:not(.g){padding-bottom:1cqw}
  .sq.b:not(.g){padding-top:1.2cqw}
  .sq.t,.sq.b{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr) max(4.3cqw,46px)}
  .sq.t .txt,.sq.b .txt{height:100%;justify-content:flex-start}
  /* 等级已有图标旁的方块表示，矮屏不再重复占一行。 */
  @media (max-height:1000px),(min-aspect-ratio:2/1){.sq.t .lv,.sq.b .lv,.sq.l .lv,.sq.r .lv,.sq.l .cap,.sq.r .cap{display:none!important}}
  /* 两侧名字、价格优先；类型可在详情中查看，避免留下半行。 */
  @media (max-height:1000px),(min-aspect-ratio:2/1){
    .sq.l .bill,.sq.r .bill{display:none}
    .sq.l,.sq.r{padding-top:2px;padding-bottom:2px}
    .sq.l .txt,.sq.r .txt{gap:1px}
    .sq.l .txt>*,.sq.r .txt>*{flex-shrink:0}
  }
}
/* 英文、日文较长的牌堆标签不能撑破左栏；空间不足时折行并在栏内滚动。 */
.cleft{grid-template-columns:repeat(2,minmax(0,1fr));align-content:safe center}
.cleft .stack b,.cleft .stack span{white-space:normal;overflow-wrap:anywhere;max-width:100%}
.cleft .potbox{flex-wrap:wrap;min-width:0}
.cleft .lastcard{min-width:0;overflow-wrap:anywhere}
@media (min-width:901px) and (min-height:501px){
  .c-head{flex-wrap:wrap}
  .c-head .gtitle{flex-basis:24em}
}
/* 中间右栏「这回合还能做什么」放不下时可以滚，底部淡出提示下面还有 */
@media (min-width:901px){
  #center .cright:has(.todo){-webkit-mask-image:linear-gradient(to bottom,#000 calc(100% - 22px),transparent);mask-image:linear-gradient(to bottom,#000 calc(100% - 22px),transparent);padding-bottom:18px;scrollbar-width:thin}
}
/* 矮屏（1280×720 这类笔记本、投影）：中间区收紧上下留白，右栏少截断 */
@media (min-width:1201px) and (max-height:800px){
  #center .stage{gap:6px!important}
  #center .stage .row.more button{min-height:38px;padding-top:4px;padding-bottom:4px}
  #center .stage .row.more button small.why{display:none}   /* 原因点按钮会弹出来，悬停也看得到 */
  #center .stage .who{font-size:16px}
  .todo{padding:3px 0;font-size:12px;line-height:1.35}
  .briefline{font-size:12px}
}
/* 宽屏：玩家卡整整齐齐排成两列（当前玩家用边框标出来，不再单独占一整行） */
@media (min-width:1800px){
  #side .plist .pl.cur{grid-column:auto}
  #side .plist{grid-auto-rows:min-content;align-items:stretch}
  /* 两列玩家卡每张只有约 220px 宽，支柱排三列放不下「● 卓越运营 1/2」，字会被拆开 */
  #side .plist .pillars{grid-template-columns:repeat(2,minmax(0,1fr))}
  #side .plist .pillar{white-space:nowrap}
  /* 总资产和估值分两行：中间的「 · 」用 font-size:0 藏掉，免得折到第二行行首 */
  #side .plist .cash .nw{font-size:0}
  #side .plist .cash .nw span{display:block;font-size:12px}
}
/* 竖着的平板、折叠屏内屏：棋盘中间够大，回合条和「你在哪一格」放进去，骰子小一点，不用往下翻 */
@media (min-width:600px) and (max-width:900px) and (orientation:portrait){
  #center .stage>.dice{grid-row:2/5}
  #center .stage>.dice .die{width:calc(var(--cw) * 1.9);height:calc(var(--cw) * 1.9)}
  #center .stage>.who{grid-row:5/6}
  #center .stage>.st{grid-row:6/7}
  #center>.turnbar{grid-row:7/9;grid-column:2/15;align-self:center;justify-self:center;justify-content:center;margin:0 10px;max-width:calc(var(--cw) * 12.4)}
  #center .stage>.here{grid-row:9/11;grid-column:2/15;align-self:center;justify-self:stretch;margin:0 14px}
}
/* 竖着的平板（iPad mini 744 到 900 宽）：还是手机那套布局（操作区在棋盘下面、底栏主按钮），但格子按桌面的比例排（外圈 1.75 格），
   名字、买价、主人和过路费写在格子上：900 和 901 宽原来一个只剩图标、一个全有字，格子宽度其实差不多。左右两列不写主人，看色条。
   手机排版把升级方块挪到了左下角，这里放回右上角，不然压字。手机（<740）和横屏不动。--cw 不加 !important，折叠屏双屏那两段照旧压得过 */
@media (min-width:740px) and (max-width:900px) and (orientation:portrait){
  #board{--cw:calc((100vw - 34px) / 16.5);grid-template-rows:calc(var(--cw) * 1.75) repeat(9,var(--cw)) calc(var(--cw) * 1.75)!important;grid-template-columns:calc(var(--cw) * 1.75) repeat(13,var(--cw)) calc(var(--cw) * 1.75)!important}
  .sq .txt,.corner .nm{display:flex!important}
  .sq{padding:.5cqw .3cqw!important;gap:.25cqw!important}
  .sq.l,.sq.r{flex-direction:row!important;justify-content:flex-start!important;padding:.4cqw .6cqw!important;gap:.6cqw!important}
  .sq.l .txt,.sq.r .txt{align-items:flex-start}
  .sq .art img.awsi{width:2.9cqw!important;height:2.9cqw!important}
  .sq.l .art img.awsi,.sq.r .art img.awsi{width:2.5cqw!important;height:2.5cqw!important}
  .corner .art img.awsi{width:4.2cqw!important;height:4.2cqw!important}
  .sq.t .lvh,.sq.b .lvh{left:auto;bottom:auto;right:.3cqw;top:.35cqw;flex-direction:column;gap:.12cqw}
  .sq.t .lvh i,.sq.b .lvh i{width:.6cqw;height:.6cqw}
}
/* 竖着的平板又是双屏折叠：双屏那两段的 --cw 按外圈 1.3 格（15.6 / 11.6）算，上面换成 1.75 格（16.5 / 12.5）后棋盘会宽出约 6%，除数跟着换。
   不认 viewport-segments 的浏览器整条不生效，本来也没有双屏 */
@media (min-width:740px) and (max-width:900px) and (orientation:portrait) and (vertical-viewport-segments:2){#board{--cw:min(calc((100vw - 34px) / 16.5), calc((env(viewport-segment-height 0 0, 50vh) - 56px) / 12.5))!important}}
@media (min-width:740px) and (max-width:900px) and (orientation:portrait) and (horizontal-viewport-segments:2){#board{--cw:calc((env(viewport-segment-width 0 0, 50vw) - 34px) / 16.5)!important}}
/* 手机横屏（高不到 500）：竖卡 419px 比整个窗口还高，免疫和知识点全压在按钮栏下面。标题、按钮栏收紧，发牌窗里那一张卡改成横卡；GameDay 并排挑两张的窄卡不动 */
@media (max-height:500px) and (orientation:landscape){
  .modal{padding:6px}
  /* 跟棋盘一样用 svh：真机上 100vh 按收起地址栏算，地址栏露着时长弹窗（买地、资产管理）上下各出屏一截；触屏开弹窗时又锁了整页滚动，没法划走地址栏。不认 svh 的浏览器丢掉第二条，用 vh */
  .box{max-height:calc(100vh - 12px);max-height:calc(100svh - 12px)}
  .box h3{padding:4px 16px;font-size:16px}   /* 「收起看棋盘」触屏上 40px 高，标题栏上下不用再留 8px */
  .box .btns{padding:6px 16px;margin-top:6px}
  .deal .pcard{--pw:min(560px,86vw);min-height:0}
  .deal .face.back{width:min(560px,86vw)}
  .deal .glow{aspect-ratio:auto;height:130%}   /* 光圈按卡宽画圆会比横卡高出一截，撑出一段能往下滚的空白 */
}
/* ===== 右侧玩家卡整理：头部两行（名字和标签 / 角色，现金 / 估值），状态只写不是 0 的，服务图标带状态小字和级别角标，
   角色说明平时一行、点开三行，架构进度一行汇总。卡片高度不跟着悬停、轮到谁变。这一段压过前面散落的旧规则 ===== */
/* 名字行：折叠箭头在名字前面（跟名字一起不换行），「电脑 · 代理商」是灰色小字，「（你）」跟在名字后面 */
#side .pl .pacc:is([onclick], [data-act]) .pn b::after{content:none}
#side .pl .pacc{padding:10px 14px 2px}
#side .pl .gb{padding:6px 14px 10px;gap:7px}
#side .pl .pacc .pn{flex:1 1 auto;max-width:none;min-width:0}
/* 名字太长时省略号截断，不要盖到右边的现金上：.pnm 是 nowrap 的，没有 overflow 就会直接溢出 */
#side .pl .pacc .pn b{min-width:0}
#side .pl .pacc .pn .pnm{overflow:hidden;text-overflow:ellipsis;min-width:0}
#side .pl .pacc .pn b{align-items:baseline;column-gap:6px}
#side .pl .pacc .pla{display:inline-block;width:13px;font-size:12px;font-weight:400;color:var(--mut)}
#side .pl .pacc .pme{margin-left:-5px;font-size:13px;font-weight:400;color:var(--ink2);white-space:nowrap}
#side .pl .pacc .pren{margin:0 2px;padding:0 4px;border:0;background:none;font:inherit;font-size:13px;font-weight:400;line-height:1;color:var(--ink2);cursor:pointer;border-radius:4px}
#side .pl .pacc .pren:hover,#side .pl .pacc .pren:focus-visible{color:var(--ink);background:var(--line,rgba(0,0,0,.08))}
#side .pl .pacc .ptags{font-size:12px;font-weight:400;color:var(--mut2);white-space:nowrap}
#side .pl .pacc .ptags .warn{color:var(--red);font-weight:700}
#side .pl .now{margin-left:0}
/* 现金大号，下面一行估值（悬停、触屏点一下看总资产和拆分）；有欠款时红字夹在中间 */
#side .pacc .cash{flex:none}
#side .pl .pacc .cash small,#side .pl.mini .pacc .cash small{display:block;white-space:nowrap;margin-top:1px}
#side .pl .pacc .cash small.nw{font-size:12px;font-weight:400;color:var(--mut)}
#side .pl .pacc .cash small.pdebt{font-size:12px;font-weight:700;color:var(--red)}
#side .plist .pacc .cash .nw{font-size:12px}
#side .plist .pacc .cash .nw span{display:inline;font-size:inherit}
/* 带说明的字：只在名称下面画点线；键盘停上来有焦点框 */
#side .tipx{cursor:help}
#side .tipx .lb{border-bottom:1px dotted #879596}
#side :is(.tipx,.pa,.pam,.psum,.pillar):focus-visible{outline:2px solid var(--focus);outline-offset:1px}
/* 服务图标：按钮，每个一样宽，右下角一个角标写级别（蓝）和容量（灰）。正常的排在前面，有状态的分组排在后面，
   组前一个小字写状态（下线 / Impaired / DDoS / Spot），不再往图标上压字 */
#side .svcs{align-items:center}
#side .svc{all:unset;position:relative;display:inline-flex;flex:none;cursor:pointer;line-height:0;border-radius:2px}
#side .svc .svi{position:relative;display:block;line-height:0}
#side .svc:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
#side .svc.off img.awsi{opacity:.4;filter:grayscale(1)}
#side .svc.imp img.awsi,#side .svc.ddos img.awsi{opacity:.55;outline:none}
#side .svgrp{display:inline-flex;align-items:center;column-gap:inherit;margin-left:4px}
#side .svgrp:first-child{margin-left:0}
#side .svgrp .sgl{margin-right:-2px;font-size:11.5px;line-height:16px;font-weight:700;white-space:nowrap;color:var(--mut)}
#side .svgrp.imp .sgl{color:var(--warning-ink)}
#side .svgrp.ddos .sgl{color:var(--red)}
#side .svgrp.spot .sgl{color:var(--blue)}
/* 触屏：图标 26px（手指点得准，收起的卡也一样大） */
@media (pointer:coarse){#side .svc img.awsi,#side .pl.mini .svcs img.awsi{width:26px;height:26px}}
#side .svc .svb{position:absolute;right:-6px;bottom:-6px;display:flex;height:14px;border-radius:7px;overflow:hidden;font-size:10px;font-weight:700;line-height:14px;color:#fff;pointer-events:none}
#side .svc .svb b{padding:0 4px;background:#0972d3}
#side .svc .svb i{padding:0 3px;font-style:normal;background:#545b64}
/* 状态行：一项一项不拆开，分隔点挂在前一项末尾；「明细和日志」是行尾的小字按钮 */
#side .res{display:flex;flex-wrap:wrap;align-items:baseline;column-gap:5px;font-size:12.5px;line-height:1.55;color:var(--ink2)}
#side .pl.mini .res{font-size:12px;color:var(--mut)}
#side .res .ri{white-space:nowrap}
#side .res .ri:has(+ .ri)::after{content:' ·';font-weight:400;color:var(--mut2)}
#side .res .ri.pa,#side .res .ri.psum{cursor:help}
#side .res .ri.pa{color:var(--green);font-weight:700;border-bottom:1px dotted #879596}
#side .res .ri.psum{border-bottom:1px dotted #879596}
#side .res .ri.psum.on{color:var(--green);font-weight:700}
#side .res .ri.go{color:var(--warning-ink);font-weight:700}
#side .res .ri.pout{color:var(--ink2);font-weight:700}
/* 展开的卡头部下面一行：总资产 · 估值 · 运行费，数字加粗 */
#side .res.pkv{color:var(--mut)}
#side .res.pkv b{font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums}
#side .ledbtn{all:unset;display:inline-block;margin-left:auto;padding:1px 0 1px 8px;font-size:12px;line-height:18px;color:var(--blue);cursor:pointer;white-space:nowrap}
#side .ledbtn:hover{text-decoration:underline}
#side .ledbtn:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
/* 收起的卡：「明细」贴在卡片右下角，状态行右边让出位置，不单独占一行；展开的卡放在角色那一行的右边 */
#side .pl.mini .res{min-height:18px;padding-right:40px}
#side .pl.mini .ledbtn{position:absolute;right:12px;bottom:7px;line-height:1.45}
#side .prole .prow{display:flex;align-items:baseline;gap:8px}
#side .prole .prow .rlt{flex:1 1 auto;min-width:0}
/* 保留卡、承诺折扣、客户各占一行；要提防的状态（被 DDoS、退回上一圈）红字单独一行，技能效果还是蓝色标签 */
#side .pline{font-size:12.5px;line-height:1.5;color:var(--ink2)}
#side .pwarn{font-size:12.5px;line-height:1.45;color:var(--red);font-weight:600}
#side .fxrow{display:flex;flex-wrap:wrap;gap:4px}
#side .fxrow .fxchip{margin:0}
/* 架构：一行汇总，名字悬停看这套架构，「全部 N 套」看每套差什么 */
#side .parch{font-size:12.5px;line-height:1.55;color:var(--mut)}
#side .parch .pa,#side .parch .pam{cursor:help;border-bottom:1px dotted #879596}
#side .parch .pa{color:var(--ink2)}
#side .parch .pnw{white-space:nowrap}
#side .parch .pa.done{color:var(--green);font-weight:700}
/* 支柱：窄卡自动排两列，长译文允许换行；不再用 ●○ */
#side .pillars{grid-template-columns:repeat(auto-fill,minmax(76px,1fr));gap:2px 10px;font-size:12px}
#side .plist .pillar{white-space:normal;overflow-wrap:anywhere;color:var(--mut);font-weight:400}
#side .pillar::before,#side .pillar.on::before{content:none}
#side .pillar.on{color:var(--green);font-weight:700}
#side .pillar small{font-size:12px;font-variant-numeric:tabular-nums}
/* 角色：一行「能力 · 弱点 · 技能」，点开三行 */
#side .prole{display:flex;flex-direction:column;gap:3px}
#side .prole .rlt{all:unset;cursor:pointer;padding:2px 0;font-size:12.5px;line-height:1.5;color:var(--mut)}
#side .prole .rlt:hover{color:var(--ink)}
#side .prole .rlt:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
#side .prole .pla{display:inline-block;width:13px;font-size:12px}
#side .prole .rlb{font-size:12.5px;line-height:1.5;color:var(--mut)}
#side .prole .rlb p{margin:0 0 3px}
#side .prole .rlb b{margin-right:6px;color:var(--ink2)}
#side .prole .rlb .rln{color:var(--mut2)}
#side .prole .rlh{font-size:12.5px;line-height:1.45;color:var(--red);font-weight:700}
@media (pointer:coarse){#side .prole .rlt{padding:6px 0}#side .ledbtn{padding:5px 0 5px 10px}}
/* 收起的卡上「明细」和状态行最后一行的字对齐：按钮底边 = 卡片内容底边减去按钮的下内边距，行高和状态行一样（触屏按钮高 28px，下内边距 5px） */
@media (pointer:coarse){#side .pl.mini .ledbtn{bottom:3px}}
/* 收起的卡：两行头部 + 图标一行 + 状态一行。图标和状态行之间留 10px，触屏点说明字不会被吸到图标上 */
#side .pl.mini .pacc{padding:7px 12px 0}
#side .pl.mini .gb{padding:5px 12px 7px;gap:10px}
#side .pl.mini .res{line-height:1.45}
#side .pl.mini .pacc .pn small{font-size:12px;line-height:1.3}
#side .pl.mini .pacc .cash{line-height:1.1}
/* 矮屏（1280×720 这类）：日志让出高度，4 张收起的卡放得下 */
@media (min-width:1201px) and (max-height:800px){
  #side .logpanel{flex:1 1 12vh;min-height:84px}
  #side.many .plist{gap:6px}
}
@media (min-width:1201px) and (max-height:800px) and (hover:hover){#side .pl.mini .gb{gap:7px}}
/* 平板、手机：日志占整行；卡片按内容高度排，不被同一行拉高；2 人局排两列 */
@media (max-width:1200px){
  #side .plist{align-items:start}
  #side>.logpanel{grid-column:1/-1}
}
@media (min-width:901px) and (max-width:1200px){#side:not(.many) .plist{grid-template-columns:repeat(2,minmax(0,1fr))}}
/* 悬停小卡在矮屏上也不出屏 */
#archtip{max-height:calc(100vh - 16px);overflow:hidden}
/* 回合条上的玩家点一下跳到他的玩家卡 */
#center .turnbar .tb:is([onclick], [data-act]){cursor:pointer}

/* 方案 A：清爽卡片 */
.setup-box{border-radius:14px;padding:30px 34px}
.setup-head h2{font-size:22px;letter-spacing:.5px}
.setup-head{display:flex;align-items:baseline;flex-wrap:wrap;gap:4px 12px}.setup-head .langsw{margin-left:auto;align-self:center}.langsw{font-weight:600}
.sec{margin-top:0;padding:18px 0 4px;border-top:1px solid var(--line2)}
.setup-head + #resume + .sec, .setup-head + .sec{border-top:0}
.sec h5{font-size:15px;margin-bottom:12px}
.sec h5 i{border-radius:999px;min-width:24px;text-align:center;background:#232f3e}
.tiles{gap:12px}
.tile{border:1px solid var(--line);border-radius:10px;box-shadow:0 1px 2px rgba(15,23,36,.04);transition:border-color .15s,box-shadow .15s}
.tile:hover{border-color:#8d99a8;box-shadow:0 2px 8px rgba(15,23,36,.08)}
.tile:has(>input:checked){border-color:#0972d3;background:var(--info-bg);box-shadow:0 0 0 1px #0972d3 inset,0 2px 10px rgba(9,114,211,.12)}
.tile.mode{border-left:1px solid var(--line)}
.tile.mode::after{content:'';position:absolute;left:-1px;top:10px;bottom:10px;width:3px;border-radius:0 3px 3px 0;background:#ec7211}
.tile b{font-size:14.5px}
.tile span{color:var(--mut)}
.nrow input[id^=nm]{border:1px solid var(--line);border-radius:8px;height:36px;padding:0 10px}
.nrow input[id^=nm]:focus{outline:2px solid #0972d3;outline-offset:0;border-color:#0972d3}
.mulrow{padding:10px 12px;border-radius:10px;background:var(--surface-soft)}
.sec .switch{padding:10px 12px;border-radius:10px;background:var(--surface-soft)}
.ugbar{border-radius:10px}
.mpbtns button{border-radius:8px}

/* 方案 A 补：卡牌倍率的说明挪到下一行，四个选项留在同一行 */
.mulrow>.muted{order:5;flex-basis:100%;font-size:12px}
.mulrow label{white-space:nowrap}

/* 通用界面语义色：卡面、层级、状态和文字分别定义，品牌图标与玩家原色保持原样。 */
:root{color-scheme:light;--surface:#fff;--surface-soft:#fafafa;--surface-muted:#eef1f4;--info-bg:#f1faff;--success-bg:#f2f8f0;--danger-bg:#fdf3f1;--warning-bg:#fff8f1;--purple-bg:#f7f1ff;--control-border:#879596;--warning-ink:#a34a00;--on-accent:#16191f;--danger-fill:#b52c31;--info-fill:#0972d3;--player-0:#c62a2f;--player-1:#1a62d6;--player-2:#15763f;--player-3:#7c3aed;--player-4:#b44708;--player-5:#0f766e;--player-6:#be185d;--player-7:#477309;--player-8:#0369a1;--player-9:#8a6200;--player-10:#475569;--player-11:#87592a;--group-text-storage:#5b790b;--group-text-iaas:#a84c00;--group-text-net:#6b35c8;--group-text-ctr:#a16207;--group-text-integ:#b80b60;--group-text-db:#9f1ca5;--group-text-ana:#1d5ebe;--group-text-sec:#b32740;--group-text-ai:#007d68;--group-text-util:#545b64}
/* 仅屏幕启用深色；浏览器打印继续使用浅色语义色。 */
@media screen{
:root[data-theme=dark]{color-scheme:dark;--ink:#e7edf5;--ink2:#c1cedf;--mut:#b7c4d4;--mut2:#9eafc3;--line:#4b5f76;--line2:#304258;--bg:#0c1420;--surface:#172333;--surface-soft:#202f43;--surface-muted:#101c2b;--info-bg:#17324b;--success-bg:#173629;--danger-bg:#3d252c;--warning-bg:#3c2c1b;--purple-bg:#302443;--control-border:#7d93ac;--blue:#85c7ff;--red:#ff9f93;--green:#94d883;--focus:#9ed3ff;--warning-ink:#ffbf79;--player-0:#ff9ea3;--player-1:#99c6ff;--player-2:#8cdda9;--player-3:#cbb0ff;--player-4:#ffb27a;--player-5:#7fe3d6;--player-6:#ffa3cf;--player-7:#bce67a;--player-8:#9bdcff;--player-9:#ffe27a;--player-10:#cbd5e1;--player-11:#e8c9a6;--group-text-storage:#bddb70;--group-text-iaas:#ffb56b;--group-text-net:#c5a2ff;--group-text-ctr:#f2ce65;--group-text-integ:#ff8dc3;--group-text-db:#ed98f5;--group-text-ana:#91bfff;--group-text-sec:#ff9ba9;--group-text-ai:#67d7c2;--group-text-util:#aebdce}
:root[data-theme=dark] #mbar{background:var(--surface);border-color:var(--line)}
:root[data-theme=dark] img.awsi[data-icon=users]{filter:brightness(0) invert(1);opacity:.9}
/* 老板键的编辑器和命令栏也随本机外观切换。 */
:root[data-theme=dark] #boss{background:var(--surface-muted);color:var(--ink)}
:root[data-theme=dark] #boss :is(.bs-top,.bs-act,.bs-side,.bs-tabs2,.bs-th){background:var(--surface-soft);border-color:var(--line2)}
:root[data-theme=dark] #boss :is(.bs-file,.bs-sh,.bs-ti,.bs-crumb,.bs-th,.bs-term pre,.ln code,.ln.cur i){color:var(--ink)}
:root[data-theme=dark] #boss :is(.bs-ti.on,.bs-tabs2 span.on,.ln.cur){background:var(--info-bg);color:var(--ink)}
:root[data-theme=dark] #boss :is(.bs-tabs2 span,.ln i){color:var(--mut2)}
:root[data-theme=dark] #boss :is(.bs-crumb,.bs-term,.bs-tabs2,.bs-tabs2 span){border-color:var(--line2)}
:root[data-theme=dark] #boss .kw{color:#9dcbff}:root[data-theme=dark] #boss .st{color:#e9bd9e}:root[data-theme=dark] #boss .cm{color:#a4c99b}:root[data-theme=dark] #boss .ty{color:#7cd8ce}:root[data-theme=dark] #boss .nu{color:#b7dfa9}
:root[data-theme=dark] #vimcmd{background:var(--surface);color:var(--ink);border-color:var(--line)}
:root[data-theme=dark] #vimcmd.err{color:var(--red)}:root[data-theme=dark] #vimcmd .hint{color:var(--mut2)}:root[data-theme=dark] #vimcmd .cur{background:var(--ink)}
:root[data-theme=dark] .modal{background:rgba(5,10,18,.8)}
:root[data-theme=dark] .tile::before{background:var(--surface)}
:root[data-theme=dark] .sq .pawn{box-shadow:0 0 0 .15cqw var(--surface)}
:root[data-theme=dark] .sq:hover{background:var(--surface-soft)}
:root[data-theme=dark] :is(.grp>.gt,.pchip){color:color-mix(in srgb,var(--gc,var(--ink)),white 30%)}
:root[data-theme=dark] :is(.bcard,.pl)>.gt{color:var(--ink)}
:root[data-theme=dark] :is(.sec h5 i,.mtoc button.on){background:#334860;color:var(--ink)}
:root[data-theme=dark] .pcard .ph{color:#fff}
:root[data-theme=dark] :is(input,textarea,select){accent-color:var(--blue)}
}
.tbar{color:var(--mut2)}
.pawn{color:var(--pawn-ink,#fff);font-weight:800}
.die:not(.red) i{background:var(--ink2)}   /* 原来写死 #232f3e，骰子面改成主题色后深色模式下点和面只有 1.17:1；--ink2 在浅色里就是 #232f3e，深色里是亮色 */
button.pri,button.pri:hover:not(:disabled){color:var(--on-accent)}
button.danger{background:var(--danger-fill);border-color:var(--danger-fill)}
.dlctabs .dlcn{color:var(--on-accent)}
/* 外观控件做成和旁边「语言」一样的小按钮：同样的边框、圆角、高度、字重，右边一个 ▾；图标放进框里，原生下拉箭头去掉 */
.theme-control{display:inline-flex;align-items:center;gap:5px;align-self:center;flex:none;position:relative;font-size:12px;font-weight:600;color:var(--mut);background:var(--surface);border:1px solid var(--mut);border-radius:2px;min-height:26px;padding:1px 22px 1px 12px;cursor:pointer}
.theme-control:hover{background:var(--surface-soft);color:var(--ink);border-color:var(--ink)}
.theme-control:has(select:focus-visible){outline:2px solid var(--focus);outline-offset:2px}
.theme-control>svg{width:16px;height:16px;flex:none}
.theme-control select{appearance:none;-webkit-appearance:none;font:inherit;font-weight:600;color:inherit;background:transparent;border:0;border-radius:0;margin:0;padding:0;min-height:0;max-width:130px;cursor:pointer;outline:none}
.theme-control select option{color:var(--ink);background:var(--surface)}
.theme-control::after{content:'▾';position:absolute;right:9px;top:50%;transform:translateY(-50%);pointer-events:none;font-size:10px;color:var(--mut2)}
@media (pointer:coarse){.theme-control{min-height:40px;padding:4px 22px 4px 12px}}
.setup-head .theme-control{margin-left:0}
.setup-head .hctl{margin-left:auto;align-self:center;display:inline-flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end}
@media print{.theme-control{display:none}}
</style>
<style id="i18n-css">html[lang=en] .tile.lock::after{content:"Required for Hell Mode"}
html[lang=ja] .tile.lock::after{content:"地獄モードでは必須"}
html[lang=en] .sq.need::after{content:"Complete"}
html[lang=ja] .sq.need::after{content:"補完"}
html[lang=en] .gfil .gf>span::after{content:": "}
html[lang=ja] .gfil .gf>span::after{content:"："}
html[lang=en] .gwild summary::after{content:"Expand"}
html[lang=ja] .gwild summary::after{content:"展開"}
html[lang=en] .gwild[open] summary::after{content:"Collapse"}
html[lang=ja] .gwild[open] summary::after{content:"折りたたむ"}</style>
</head>
<body>

<div id="setup">
  <section class="hero" id="hero"></section>
  <div class="setup-box">
    <div class="ugbar"><div><b>UG 活动局</b><span>线下活动用：娱乐模式 + 边玩边答题，打 12 轮或 30 分钟（先到为准），4 人一桌</span></div><button class="pri" type="button" data-act="ugPreset">一键开局</button></div>
    <div class="setup-head"><h2>新建一局</h2><span class="muted">五步设置，随时可以点「先看玩法」</span></div>
    <div id="resume"></div>
    <div class="sec">
      <h5 class="h5sw"><i>01</i>玩家<span class="h5ctl"><label class="switch hsw" title="开局每人发 3 张角色卡，自己挑一张；挑走的别人拿不到。不勾就随机分"><input type="checkbox" id="rolePick"><span class="tg"></span><b>三选一挑角色</b><span class="muted">不开就随机分</span></label><button type="button" class="sm" data-act="playerGallery" title="所有角色卡：起始资金、能力、弱点、专属技能">玩家图鉴</button></span></h5>
      <div class="tiles np">
        <label class="tile"><input type="radio" name="np" value="2" data-act-change="renderNames"><b>2 人</b></label>
        <label class="tile"><input type="radio" name="np" value="3" checked data-act-change="renderNames"><b>3 人</b></label>
        <label class="tile"><input type="radio" name="np" value="4" data-act-change="renderNames"><b>4 人</b></label>
      </div>
      <div id="npMore"></div>
      <div class="names" id="names"></div>
    </div>
    <div class="sec">
      <h5 class="h5sw"><i>02</i>难度<span class="h5ctl"><label class="switch hsw" title="付过路费、买服务时先答一道亚马逊云科技的题，答对就打折；难度选「学习模式」会自动打开"><input type="checkbox" id="learn"><span class="tg"></span><b>边玩边答题</b></label><label class="mulrow hmul" title="Health 卡和 re:Invent 卡上的金额（领钱、罚款）都乘这个倍率；每轮随机是每一轮在 0.5–2 倍之间换一次"><b>卡牌倍率</b><select id="cmul" aria-label="卡牌倍率"><option value="1" selected>1 倍</option><option value="1.5">1.5 倍</option><option value="2">2 倍</option><option value="rand">每轮随机</option></select></label></span></h5>
      <div class="tiles">
        <label title="只留 20 个常用服务，其余变成盲盒格；经过起点、掷出对子都送卡；没有技术债和下线；默认 10 轮" class="tile mode"><input type="radio" name="diff" value="party"><b>娱乐模式</b><span>20 个常用服务，其余是盲盒格；默认 10 轮，节奏最快</span></label>
        <label title="基础规则、卖回亚马逊云科技、运行费与请求费、维护窗口与复盘、Spot 购买" class="tile"><input type="radio" name="diff" value="basic"><b>入门局</b><span>只有基础规则：买服务、收过路费、运行费、维护窗口</span></label>
        <label title="再加升级附加费、技术债、新账户保护期（前 2 轮过路费最多 $50）、季度财报、旧版本停止支持" class="tile"><input type="radio" name="diff" value="std" checked><b>标准局</b><span>再加技术债、新账户保护期、季度财报</span></label>
        <label title="再加主动行动、完整交易、Savings Plans / RI" class="tile"><input type="radio" name="diff" value="full"><b>完整局</b><span>再加主动行动、完整交易、Savings Plans / RI</span></label>
        <label title="标准局规则 + 必答题、错题本；没勾题库 DLC 时自动用云从业者题库；不限轮数" class="tile mode"><input type="radio" name="diff" value="study"><b>学习模式</b><span>标准局 + 必答题、错题本，不限轮数</span></label>
        <label class="tile mode" title="完整局规则，4 个玩法 DLC、高速部署和全部题库都开，必须边玩边答题，卡牌 ×2；过路费每 5 轮 +1.5 倍、卡牌金额跟着全额涨，答对只减 30% 过路费；没有新账户保护期，起点只领 $150，卖回亚马逊云科技只有 6 折；Well-Architected 每条 2 分且共 18 分；每个角色多一条地狱限制"><input type="radio" name="diff" value="hell"><b>地狱模式</b><span>完整局 + 全部 DLC，必答题，卡牌 ×2</span></label>
      </div>
    </div>
    <div class="sec">
      <h5><i>03</i>胜利条件<span class="muted" title="经典胜利（只剩一个人没破产）一直生效；不勾轮数上限也最多打 50 轮，打满按估值排名（学习模式不限轮数）">可以多选，谁先达成谁赢；只剩一人没破产也直接赢</span></h5>
      <div class="tiles win">
        <label class="tile ck"><input type="checkbox" id="winWA"><b>Well-Architected</b><span>谁先凑齐六大支柱谁赢；难度越高每条要的分越多</span></label>
        <label class="tile ck"><input type="checkbox" id="winRounds" checked><b>轮数上限</b><span>打满 <input type="number" id="rounds" inputmode="numeric" value="15" min="5" max="50" aria-label="轮数"> 轮按估值排名</span></label>
        <label class="tile ck"><input type="checkbox" id="winTimed"><b>限时</b><span><input type="number" id="minutes" inputmode="numeric" value="90" min="5" max="600" aria-label="分钟数"> 分钟到了按估值算分</span></label>
      </div>
    </div>
    <div class="sec mp">
      <h5 class="h5sw"><i>04</i>联机<span class="muted">可选：各用各的电脑或手机，画面实时同步</span><span class="h5ctl"><button type="button" class="sm icotxt" data-act="mpNetDialog" title="连不上时先在两台设备上各测一次：信令服务器、点对点、公网地址、中继"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>联机设置和测试</button></span></h5>
      <div class="mprow"><div id="mpbox" class="mpbtns"><button data-act="mpUI" data-arg="host">创建房间</button><button data-act="mpUI" data-arg="join">加入房间</button></div></div>
    </div>
    <div class="sec">
      <h5><i>05</i>DLC 扩展包<span class="muted">可选，可以多选；每个包加一套规则、卡牌和题目</span></h5>
      <div class="dlctabs" role="tablist" aria-label="DLC 分类" id="dlcTabs"></div>
      <div class="tiles dlc" id="dlcTiles" role="tabpanel" data-cat="play" aria-labelledby="dlct-play"></div>
    </div>
    <div class="btns end actbar"><span class="sum" id="setupSum" aria-live="polite"></span><button class="lg" data-act="practice" title="不玩棋盘，只刷题；答错的进错题本">刷题模式</button><button class="lg" data-act="showManual">先看玩法</button><button class="pri lg" id="startBtn" data-act="startFromSetup">开始游戏</button></div>
  </div>
</div>

<div id="game" hidden>
  <button type="button" class="sr-only skipto" data-act="skipToMain">跳到操作按钮（掷骰子、轮到下一位）</button>
  <button type="button" class="sr-only skipto" data-act="skipToSide">跳到玩家栏</button>
  <div class="frame"><div id="board"></div></div>
  <aside id="side"></aside>
</div>

<div id="modal" class="modal" hidden><div class="box"></div></div>
<div id="vmodal" class="modal vmodal" hidden><div class="box"></div></div>
<!-- 手机：主按钮固定在屏幕底部（放在最外层，不受棋盘容器影响） -->
<div id="mbar" role="toolbar" aria-label="主操作"></div>
<div id="err" role="alert"></div>
<div id="srlive" class="sr-only" aria-live="polite" aria-atomic="true"></div>
<pre id="botout" hidden></pre>

<script type="module" src="./src/main.js"></script>
