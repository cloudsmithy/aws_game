<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>亚马逊云科技 User Group 云上大亨</title>
<meta name="color-scheme" content="light dark">
<script>
// 存储键名从 aws-monopoly-* 改成 aws-tycoon-*（2026-11）：一次性把老键搬过来，搬完删掉老的。
// 放在所有读取之前（外观脚本就在下面），这样老玩家的存档、语言、外观都不会丢。
(() => {
  const move = store => {
    let keys = []; try { keys = Object.keys(store); } catch (e) { return; }
    for (const k of keys) {
      if (k.indexOf('aws-monopoly-') !== 0) continue;
      const nk = 'aws-tycoon-' + k.slice(13);
      try { if (store.getItem(nk) === null) store.setItem(nk, store.getItem(k)); store.removeItem(k); } catch (e) { }
    }
  };
  try { move(localStorage); } catch (e) { }
  try { move(sessionStorage); } catch (e) { }
})();
</script>
<script>
// 外观是本机偏好，不进入游戏存档或联机状态；在首屏样式加载前确定，避免深色时闪白。
window.GameTheme = (() => {
  const key = 'aws-tycoon-theme', system = matchMedia('(prefers-color-scheme: dark)');
  let preference = 'auto';
  try { const saved = localStorage.getItem(key); if (['auto', 'light', 'dark'].includes(saved)) preference = saved; } catch (e) { }
  const apply = () => {
    document.documentElement.dataset.theme = preference === 'auto' ? (system.matches ? 'dark' : 'light') : preference;
    document.querySelectorAll('[data-theme-select]').forEach(el => { el.value = preference; });
  };
  const set = value => { if (!['auto', 'light', 'dark'].includes(value)) return; preference = value; try { localStorage.setItem(key, value); } catch (e) { } apply(); };
  system.addEventListener('change', () => { if (preference === 'auto') apply(); });
  document.addEventListener('change', e => { if (e.target.matches('[data-theme-select]')) set(e.target.value); });
  addEventListener('storage', e => { if (e.key === key) { preference = ['auto', 'light', 'dark'].includes(e.newValue) ? e.newValue : 'auto'; apply(); } });
  apply(); return { get preference() { return preference; }, set };
})();
</script>
<style>
:root{--ink:#16191f;--ink2:#232f3e;--mut:#545b64;--mut2:#687078;--line:#d5dbdb;--line2:#eaeded;--bg:#f2f3f3;--orange:#ec7211;--blue:#0972d3;--red:#d13212;--green:#1d8102;--focus:#0972d3;--sans:'Amazon Ember',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{font-family:var(--sans);font-size:14px;color:var(--ink);background:var(--bg)}
.muted{color:var(--mut2)}
svg{flex:none}
img.awsi{display:block}

/* ---------- 按钮：亚马逊云科技控制台样式 ---------- */
button{font:inherit;font-weight:700;font-size:14px;cursor:pointer;border-radius:2px;padding:4px 18px;min-height:32px;background:var(--surface);color:var(--mut);border:1px solid var(--mut);display:inline-flex;align-items:center;justify-content:center;gap:6px}
button:hover:not(:disabled){background:var(--surface-soft);color:var(--ink);border-color:var(--ink)}
button:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
button:disabled{background:var(--surface);color:#aab7b8;border-color:var(--line);cursor:not-allowed}
button svg{width:16px;height:16px}
/* 主按钮：白字配这个橙只有 3.0:1，字用深色（5.9:1，悬停 5.2:1），橙色底不动 */
button.pri{background:var(--orange);border-color:var(--orange);color:var(--ink)}
button.pri:hover:not(:disabled){background:#eb5f07;border-color:#eb5f07;color:var(--ink)}
button.pri:disabled{background:var(--surface);color:#aab7b8;border-color:var(--line)}
button.danger{color:#fff}
button.ghost{color:var(--mut)}
button.lg{min-height:38px;font-size:15px;padding:6px 26px}
button.sm{padding:1px 12px;min-height:26px;font-size:12px}
input[type=number],textarea,.inps select,.names input{font:inherit;background:var(--surface);color:var(--ink);border:1px solid var(--control-border);border-radius:2px;padding:5px 8px}
input[type=number]{width:110px;font-variant-numeric:tabular-nums}
input:focus-visible,textarea:focus-visible{outline:2px solid var(--focus);outline-offset:0;border-color:var(--focus)}
textarea{width:100%;margin-top:4px}
table{border-collapse:collapse;width:100%;font-size:13px}
td,th{border-bottom:1px solid var(--line2);padding:6px 8px;text-align:left;vertical-align:top}
th{color:var(--mut);font-weight:700;font-size:12px;background:var(--surface-soft)}

/* ---------- 架构图分组框 ---------- */
.grp{position:relative;border:1px solid var(--gc,#879596);background:var(--surface)}
.grp.dash{border-style:dashed}
.grp>.gt{position:absolute;top:-1px;left:-1px;display:flex;align-items:center;gap:6px;font-size:12px;font-weight:700;background:var(--surface);padding-right:8px}
.grp>.gt img.awsi{width:24px;height:24px}
.grp>.gb{padding:30px 12px 12px}

/* ---------- 开局页 ---------- */
#setup{justify-content:center}
.setup-box{background:var(--surface)}
.gtitle{display:flex;align-items:center;gap:12px}
.gtitle img.awsi{width:44px;height:44px}
.gtitle h1{margin:0;font-size:26px;font-weight:700;line-height:1.15}
.gtitle .sub{font-size:13px;color:var(--mut2);font-weight:400}
.setup-head p{margin:14px 0 0;line-height:1.6;color:var(--mut)}

.sec h5{margin:0 0 8px;font-weight:700}
.tiles{display:grid;grid-template-columns:repeat(3,1fr)}
.tiles:has(#winRounds){grid-template-columns:repeat(2,1fr)}
.tile{position:relative;display:block;background:var(--surface);cursor:pointer}
.tile::before{content:'';position:absolute;left:12px;top:14px;width:14px;height:14px;border-radius:50%;border:2px solid #7d8998;background:var(--surface)}
.tile>input[type=radio]{position:absolute;opacity:0;pointer-events:none}
.tile b{display:block}
.tile span{display:block;font-size:12px;margin-top:3px;line-height:1.5}
.tile span input{width:64px;padding:1px 6px;margin-right:2px}

.tile:has(>input:checked)::before{border:5px solid var(--blue)}
.tile:has(>input:focus-visible){outline:2px solid var(--focus);outline-offset:2px}

.names{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
#setup .tiles .tile>span{line-height:1.5}
.nrow{display:flex;align-items:center;gap:8px}
.nrow input{flex:1;min-width:0}
.switch{display:flex;align-items:center;gap:10px;margin-top:22px;cursor:pointer;position:relative}
.switch input{position:absolute;opacity:0}
/* 说明文字长，标题不加 nowrap 会被挤成「边玩 / 边答 / 题」 */
.switch b{white-space:nowrap;flex:none}
.sec .switch{margin-top:14px;flex-wrap:wrap}
/* 剩下不到 220px 宽（手机）就把说明折到开关下面一整行，不跟标题挤一排 */
.switch .muted{flex:1 1 220px}
.switch:has(>input:disabled){cursor:default}
.switch input:disabled+.tg{opacity:.6}
/* 学习模式不限轮数：轮数上限那格灰掉 */
.tile:has(>#winRounds:disabled){cursor:default;opacity:.55}
.switch .tg{width:32px;height:18px;border-radius:999px;background:#7d8998;position:relative;flex:none}
.switch .tg::after{content:'';position:absolute;left:2px;top:2px;width:14px;height:14px;border-radius:50%;background:var(--surface);transition:transform .15s}
.switch input:checked+.tg{background:var(--blue)}
.switch input:checked+.tg::after{transform:translateX(14px)}
.switch input:focus-visible+.tg{outline:2px solid var(--focus);outline-offset:2px}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.btns.end{justify-content:flex-end}

/* 编号圆圈 = 玩家棋子 */
.pawn{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:50%;background:var(--pc);font-size:12px;flex:none;line-height:1}

/* ---------- 棋盘 = 亚马逊云科技云分组 ---------- */
#game{display:flex;gap:20px;padding:16px;align-items:flex-start;justify-content:center;flex-wrap:wrap}
#game[hidden]{display:none}
/* 联机远端藏起来的「退出到开局页」「新游戏」：button 的 display:inline-flex 会盖掉 hidden 属性 */
#center button[hidden],#mbar button[hidden]{display:none}
.frame{position:relative;background:var(--surface);border:2px solid var(--ink2);padding:40px 14px 14px;flex:none}
.frame>.gt{position:absolute;top:-2px;left:-2px;display:flex;align-items:center;gap:8px;font-weight:700;font-size:14px;background:var(--surface);padding-right:10px}
.frame>.gt img.awsi{width:32px;height:32px}
#board{container-type:inline-size;display:grid}

/* ---------- 格子 ---------- */
.sq{background:var(--surface);color:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;overflow:hidden}
.sq:hover{background:var(--surface-soft)}
.sq:focus-visible{outline:2px solid var(--focus);outline-offset:1px;z-index:3}

.sq.g.dash{border-style:dashed}
.art{position:relative;flex:none}

.txt{display:flex;flex-direction:column;align-items:center;min-width:0}

.nm{text-align:center;word-break:keep-all;overflow-wrap:normal}

.pr{font-variant-numeric:tabular-nums}
.pr.neg{color:var(--red);font-weight:700}
.lvb{display:inline-flex;align-items:center;gap:.2cqw;font-weight:700;line-height:1;border:.12cqw dashed;white-space:nowrap}

.lvb.az{color:#147eba;border-color:#147eba}
.lvb.asg{color:#ed7100;border-color:#ed7100}
.lvb.reg{color:#00a4a6;border-color:#00a4a6}
.own{position:absolute;top:0;right:0;min-width:1.55cqw;height:1.55cqw;background:var(--oc);color:#fff;font-size:.85cqw;font-weight:700;align-items:center;justify-content:center}

.toks{position:absolute;left:0;right:0;bottom:.35cqw;display:flex;justify-content:center;gap:.15cqw;z-index:2}
.art .toks{left:auto;flex-direction:column-reverse;gap:.1cqw}
.sq .pawn{box-shadow:0 0 0 .15cqw var(--surface)}
.pawn.ghost{visibility:hidden}

.corner .nm{font-weight:700}

/* ---------- 中央画布 ---------- */
#center{display:grid;cursor:default;min-height:0}
.c-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}

.meta{display:flex}
.dice{display:flex;gap:10px}
.die{border:1.5px solid var(--ink2);border-radius:4px;background:var(--surface);display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr)}
.die i{border-radius:50%;background:var(--ink2);place-self:center;visibility:hidden}
.die i.on{visibility:visible}
.dice.idle .die{opacity:.35}
.dice.rolling .die{animation:roll .45s ease-out}
@keyframes roll{0%{transform:rotate(-120deg)}100%{transform:none}}
/* 掷骰子：原地的 3D 六面体（位置和角度每一帧由 FX.dice 按物理算），带地面影子；落定后换回平面骰子 */
.dice{perspective:1100px}
.dice.hid3d,.dice.hid3d *{visibility:hidden!important}   /* 点子单独设了 visibility:visible，不连子元素一起藏，会从 3D 骰子底下漏出来 */
.dwrap{position:relative;width:var(--ds);height:var(--ds);flex:none;transform-style:preserve-3d}
.dwrap.rolling3d{z-index:5}   /* 滚动时盖在下面的文字上，像从桌面上滚过 */
.dshadow{position:absolute;inset:6%;border-radius:8px;background:rgba(22,25,31,.5);opacity:.25;filter:blur(3px);pointer-events:none}
.dcube{position:absolute;inset:0;transform-style:preserve-3d;will-change:transform}
.dcube .die{position:absolute;inset:0;width:auto!important;height:auto!important;animation:none!important;opacity:1!important;-webkit-backface-visibility:hidden;backface-visibility:hidden}
.dcube .fr{transform:translateZ(calc(var(--ds) / 2))}.dcube .bk{transform:rotateY(180deg) translateZ(calc(var(--ds) / 2))}
.dcube .rt{transform:rotateY(90deg) translateZ(calc(var(--ds) / 2));background:#f1f2f3}.dcube .lf{transform:rotateY(-90deg) translateZ(calc(var(--ds) / 2));background:#f1f2f3}
.dcube .tp{transform:rotateX(90deg) translateZ(calc(var(--ds) / 2));background:#fafbfb}.dcube .bt{transform:rotateX(-90deg) translateZ(calc(var(--ds) / 2));background:#e9ebec}
.who{display:flex;align-items:center;gap:8px;font-size:15px}
.who b{font-weight:700}
.who .cash{color:var(--green);font-weight:700;font-variant-numeric:tabular-nums}
.st{font-size:12.5px;color:var(--mut);text-align:center}
.actions{display:flex;flex-direction:column;align-items:center;gap:8px}
.actions .row{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}

.lower .grp{display:flex;flex-direction:column;min-height:0}
.lower .grp>.gb{flex:1;min-height:0;overflow:auto;padding-top:30px}
.log{font-size:13px;line-height:1.6}

.legend{line-height:1.5;display:flex}
.legend .row{display:flex;align-items:center}
.legend .lvb{padding:1px 5px;border-width:1.5px}

.legend .own{position:static;width:16px;height:16px;min-width:16px;font-size:11px}
.legend .sw{width:22px;height:14px;border:2px solid var(--gc)}

/* ---------- 玩家 = 亚马逊云科技账户 分组 ---------- */
#side{display:flex;flex-direction:column;max-height:calc(100vh - 32px);overflow:auto;padding:10px 6px 10px}
.pl{flex:none}
.pl>.gt{top:-2px;left:-2px;color:var(--ink)}

/* 原来还有 opacity:.5，把整张卡的对比度砍半：小字名义 5.03:1，合成后只剩约 2:1。
   卡上本来就写着「已出局（破产）」，灰度足够表达出局，去掉透明度让字能看清 */
.pl.dead{filter:grayscale(1);background:var(--surface-soft)}
.pl .gb{display:flex;flex-direction:column;gap:8px}
.pl .now{font-size:12px;font-weight:700;margin-left:4px}
.debt{color:var(--red);font-weight:700}
.role{font-size:12px;color:var(--mut);line-height:1.5}
.role b{color:var(--ink)}
.res{font-size:12.5px;line-height:1.6}
.res .warn{color:var(--red);font-weight:700}
.res s{color:var(--mut2)}
.dg{display:flex;flex-direction:column;gap:2px;min-width:0}
.dl{font-size:10px;color:var(--mut2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dd{flex:1;height:10px;border:1px solid var(--gc);background:var(--surface);display:flex;align-items:center;justify-content:center;gap:1px}
.dd.on{background:var(--gc)}
.dd.stp{background:repeating-linear-gradient(45deg,var(--gc) 0 2px,var(--surface) 2px 5px)}
.dd i{width:3px;height:3px;background:#fff}
.dd i.x{width:7px}
.pillars{display:grid;grid-template-columns:repeat(3,1fr);gap:2px 8px;font-size:12px}
.pillar{color:var(--mut2)}
.pillar::before{content:'○ '}
.pillar.on{color:var(--green);font-weight:700}
.pillar.on::before{content:'● '}
/* 支柱分数和进度条：玩家卡上一眼看出每条差多少 */
.pillar small{font-weight:400;color:var(--mut)}.pillar .pb{display:block;height:3px;margin:1px 0 2px;background:var(--surface-muted);border-radius:2px;overflow:hidden}.pillar .pb i{display:block;height:100%;background:#879596}.pillar.on .pb i{background:var(--green)}
.ppop{width:340px;font-size:13px;line-height:1.45}
.pillar.hot{background:var(--info-bg);outline:1px solid #8fb2ff;border-radius:3px}
.ppop .pph{display:flex;align-items:baseline;gap:8px}.ppop .pph b{font-size:15px}.ppop .pps{font-variant-numeric:tabular-nums;font-weight:700}.ppop .ppst{margin-left:auto;font-size:12px;font-weight:700;color:var(--red)}.ppop .ppst.ok{color:var(--green)}
.ppbar{height:6px;background:var(--surface-muted);border-radius:3px;overflow:hidden;margin:6px 0}.ppbar i{display:block;height:100%;background:#d13212}.ppbar.on i{background:var(--green)}
.pprule{margin:0;color:var(--mut);font-size:12px}.ppsec{margin:10px 0 4px;font-size:12px;font-weight:700;color:var(--mut)}.ppmore{margin:4px 0 0;font-size:12px;color:var(--mut)}
.ppl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}.ppl li{display:flex;align-items:center;gap:8px}.ppl img{width:22px;height:22px;flex:none}.ppl .ppdot{width:22px;height:22px;flex:none;border:1px dashed #aab4be;border-radius:4px}.ppl .ppico{display:inline-flex;gap:3px;margin-left:6px;vertical-align:-4px}.ppl .ppico img{width:18px;height:18px;border-radius:3px}.ppl .ppico img.miss{filter:grayscale(1);opacity:.35;outline:1px dashed #8a96a3;outline-offset:1px}.ppl .ppico img.wild{outline:2px solid #0972d3;outline-offset:1px}
.ppl .pt{flex:1;min-width:0}.ppl .pt small{display:block;color:var(--mut);font-size:11.5px}.ppl .pg{flex:none;font-variant-numeric:tabular-nums;color:var(--green);font-size:13px}.ppl.have .pt{font-size:12.5px}
.pillar svg{display:none}

/* ---------- 弹窗 ---------- */
.modal{position:fixed;inset:0;background:rgba(242,243,243,.8);display:flex;align-items:center;justify-content:center;z-index:10;padding:16px}
.modal[hidden]{display:none}
/* 弹窗里滑到头不再带着背后的页面一起滚。摊开时整页也锁住：短弹窗不算滚动容器、在遮罩上滑，overscroll-behavior 管不到。
   只在触屏上锁：电脑上常驻滚动条的（Windows）锁了滚动条会消失，每开一个弹窗页面就左右跳一下；收起看棋盘时照常能滚 */
.box,#sqpop{overscroll-behavior:contain}
@media (pointer:coarse){html:has(#modal:not([hidden]):not(.min)),html:has(#vmodal:not([hidden])){overflow:hidden}}
/* 查资料的窗口（明细、图鉴、玩法、格子介绍、快捷键）单独一层，压在流程弹窗上面：别人的弹窗开在下面，不会把它顶掉 */
#vmodal{z-index:11}.vnote{display:flex;align-items:center;gap:10px;margin:12px 20px 0;padding:8px 12px;border-radius:8px;background:var(--warning-bg);border:1px solid #f5b971;font-size:13px;line-height:1.4;position:sticky;z-index:1;box-shadow:0 2px 6px rgba(0,28,36,.08)}.vnote span{flex:1;min-width:0}
.modal .box:focus{outline:none}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap;border:0}
.skipto:focus{position:fixed;left:12px;top:12px;z-index:30;width:auto;height:auto;margin:0;padding:8px 14px;clip-path:none;overflow:visible;background:var(--surface);border:2px solid var(--focus);border-radius:4px}
.box{background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:0;padding:0;max-width:600px;width:100%;max-height:90vh;overflow:auto;box-shadow:0 4px 20px 1px rgba(0,28,36,.25)}
.box.wide{max-width:960px}
#modal .box:has(.deal){overflow-x:hidden}   /* 发牌窗：背后的光圈放完停在 1.25 倍，手机横屏会把弹窗撑宽；不裁的话手指一划，标题、卡面和「执行」一起往左滑走 */
.box h3{margin:0;font-size:18px;font-weight:700;padding:16px 20px;border-bottom:1px solid var(--line2)}
.box .mb{padding:16px 20px 4px}
/* 只有标题和按钮的弹窗（选人、确认）不留一条空白正文 */
.box .mb:empty{display:none}
.box .inps{padding:0 20px}
.box .btns{padding:12px 20px 16px;margin:0;justify-content:flex-end;border-top:1px solid var(--line2);margin-top:12px}
.box h4{margin:16px 0 6px}
.box p{line-height:1.6;margin:8px 0}
.box.quiz .btns{flex-direction:column;align-items:stretch}
.box.quiz .btns button{justify-content:flex-start;text-align:left}
.q{font-size:16px;font-weight:700}
/* 答题结果：沿用题目窗的版式，选项改成不能点的行，正确的标绿、选错的标红（以前只写正确答案，看不出自己选了哪个） */
.qs{font-size:16px;font-weight:700;margin:0 0 10px}
.qres{list-style:none;margin:0 0 10px;padding:0;display:flex;flex-direction:column;gap:6px}
.qres li{border:1px solid var(--line);border-radius:2px;padding:8px 12px;color:var(--mut)}
.qres li.ok{border-color:var(--green);background:var(--surface-muted);color:var(--ink);font-weight:700}
.qres li.bad{border-color:var(--red);background:var(--danger-bg);color:var(--ink)}
.qres li em{float:right;margin-left:10px;font-style:normal;font-size:12px;font-weight:700}
.qres li.ok em{color:var(--green)}.qres li.bad em{color:var(--red)}
/* 买服务时答完题：结果放在买地窗顶上 */
.qbox{border-left:3px solid var(--green);background:var(--surface-muted);padding:8px 12px;margin:0 0 12px}
.qbox.bad{border-color:var(--red);background:var(--danger-bg)}
.qbox p{margin:4px 0}

.tile::before,.tile.ck::before{box-sizing:border-box;width:16px;height:16px;top:13px;left:13px;border-width:2px}

.tile:has(>input:checked)::before{border-width:5px}
.tile.ck:has(>input:checked)::before{border-width:2px}
.tiles.win,.tiles.win:has(#winRounds){grid-template-columns:repeat(3,1fr)}
.tiles.np{grid-template-columns:repeat(3,1fr)}
/* 多人（超过 4 人）：开关和不推荐的说明在人数格下面；打开后 2…12 人一排排小格子（选择器多一个 class，压过手机上一列、平板上三列的写法） */
#npMore{display:flex;align-items:center;flex-wrap:wrap;gap:4px 12px;margin-top:10px}
#npMore .switch{margin-top:0}
#npMore .npwarn{font-size:12px;color:var(--mut2)}
#npMore.on .npwarn{color:var(--warning-ink);font-weight:600}
.tiles.np.more{grid-template-columns:repeat(auto-fill,minmax(92px,1fr))}
.tiles.np.more b{white-space:nowrap}
@media (max-width:1220px){#setup{grid-template-columns:1fr;justify-items:center}.hero{max-width:660px;width:100%}}
@media (max-width:700px){.tiles.win,.tiles.win:has(#winRounds){grid-template-columns:1fr}#setup{grid-template-columns:1fr}.setup-box{min-width:0}.hero .flow .node:nth-child(n+7){display:none}}

/* ===== UI/UX 润色 ===== */
/* 棋盘格：计费类型在文字流里，最小字号 */
.bill{position:static!important;display:block;font-size:max(.58cqw,8px)!important;color:var(--mut2);line-height:1.2;margin-top:.15cqw}

.ownr{max-width:100%;overflow:hidden;text-overflow:ellipsis}
/* 小屏：侧栏变窄，棋盘让出宽度；棋盘太小时藏次要信息 */
@media (max-width:1500px){#side{width:300px}#board{width:min(calc((100vh - 88px)*1.345),calc(100vw - 390px));min-width:0}}
@container (max-width:1100px){.bill{display:none!important}.lower{display:none!important}.cright h5,.cright .ap .muted{display:none}}
/* 侧栏：日志固定在底部；非当前玩家折叠次要信息，悬停展开 */
#side{position:relative}
.logpanel{position:sticky;bottom:0;z-index:2;background:var(--surface);box-shadow:0 -6px 12px rgba(255,255,255,.9)}
.logpanel .log{max-height:170px}
/* 只在有悬停的设备上折：触屏没有悬停，展开了也看不到对手的弱点和差哪块；键盘 Tab 到卡上也不算悬停，有焦点时不折 */
@media (hover:hover){.pl:not(.cur):not(:hover):not(:has(:focus-visible)) .role,.pl:not(.cur):not(:hover):not(:has(:focus-visible)) .arch .ap:not(.done){display:none}}
/* 当前玩家「只差一块」的架构在中间右栏「这回合还能做什么」里写了，玩家卡上只留已经生效的，不然凑成以后在哪都看不到 */
.pl.cur .arch .ap:not(.done){display:none}
.pl .now{color:var(--warning-ink)}
/* 中间操作区 */
.stage .row.more{display:grid;grid-template-columns:repeat(2,minmax(120px,1fr));width:min(100%,320px)}
.stage .row.more button{width:100%}
button.off{background:var(--surface-muted);color:var(--mut2);border-color:var(--line);box-shadow:none;cursor:not-allowed;display:inline-flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.2}
button.off:hover{background:var(--surface-muted);color:var(--mut2);border-color:var(--line)}
button.off .why{display:block;font-size:11px;font-weight:400;color:var(--mut2);margin-top:2px;white-space:normal}
#sqpop{position:fixed;right:16px;top:16px;z-index:9;width:min(380px,calc(100vw - 32px));max-height:calc(100vh - 32px);overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:0 14px 40px rgba(22,25,31,.22)}
#sqpop .sp-h{position:sticky;top:0;display:flex;align-items:center;gap:8px;padding:10px 12px;background:var(--surface);border-bottom:1px solid var(--line2)}
@media (hover:hover){#sqpop .sp-h{cursor:move;touch-action:none}#sqpop .sp-h button{cursor:pointer}#sqpop.drag{user-select:none;box-shadow:0 10px 30px rgba(0,28,36,.25)}}#sqpop .sp-h b{flex:1;font-size:15px}#sqpop .sp-h .awsi{width:26px;height:26px;margin:0}
#sqpop .sp-b{padding:10px 12px 14px;font-size:13px}#sqpop h5{margin:12px 0 6px;font-size:13px}
#sqpop .sp-sub{color:var(--mut2);font-size:12.5px}#sqpop .sp-sub+.pstat{margin-top:8px}
#sqpop .lvt{width:100%;border-collapse:collapse;font-size:12.5px}#sqpop .lvt th,#sqpop .lvt td{padding:5px 6px;border-bottom:1px solid var(--line2);text-align:left;vertical-align:top}#sqpop .lvt th{color:var(--mut2);font-weight:600;background:var(--surface-soft)}
#sqpop .lvt td:nth-child(2){min-width:5em}
#sqpop .sp-n{margin:8px 0 0;color:var(--mut);font-size:12px;line-height:1.6}
#sqpop .sp-l{list-style:none;margin:0 0 10px;padding:0;display:flex;flex-direction:column;gap:6px}#sqpop .sp-l li{line-height:1.5;padding:6px 8px;border-radius:6px;background:var(--surface-soft)}#sqpop .sp-l em{font-style:normal;color:var(--mut2);margin-right:6px;font-size:12px}
@media (max-width:900px){#sqpop{left:8px;right:8px;top:auto;bottom:calc(var(--mbar-h,68px) + 8px);width:auto;max-height:60vh}}
/* 正在看的那一格：用蓝色描边，免得和橙色的「刚落下的格子」(.last) 混 */
.sq.sel{outline:2px solid var(--focus);outline-offset:-2px;z-index:3}
.svc-intro{margin:6px 0 8px;padding:7px 10px;background:var(--surface-soft);border-left:3px solid #0972d3;border-radius:2px;font-size:13px;line-height:1.6;color:var(--ink);text-align:left}
.svc-intro p{margin:0}.svc-intro p+p{margin-top:3px}.svc-intro b{margin-right:6px;color:var(--blue)}
/* 轮到你时，买下 / 拿到就能补齐一个架构的格子：右上角小角标。没人买的绿色，在别人手上的（要靠交易）橙色描边 */
.sq.need::after{content:'补齐';position:absolute;top:.25cqw;right:.25cqw;padding:0 .3cqw;font-size:max(9px,.85cqw);line-height:1.45;font-weight:700;color:#fff;background:#1d8102;border-radius:.3cqw;pointer-events:none;z-index:2}
.sq.need.owned::after{right:auto;left:.25cqw;color:var(--warning-ink);background:var(--surface);box-shadow:inset 0 0 0 1px #b35900}
/* 手机横屏：棋盘在中间、两边空着，面板竖着放到格子对面那一侧（at-l 由 placeSqPop 判断），不压住整块棋盘 */
@media (max-width:900px) and (orientation:landscape),(max-height:500px) and (orientation:landscape){#sqpop{top:8px;bottom:calc(var(--mbar-h,68px) + 8px);left:auto;right:8px;width:min(380px,calc(50vw - 24px));max-height:none}#sqpop.at-l{left:8px;right:auto}}
/* 高不到 500 的横屏主按钮在右边一竖条（192px）：面板停在它左边，不盖按钮 */
@media (max-height:500px) and (orientation:landscape){#sqpop{bottom:8px;right:200px}}
/* 照宣传片搬进来的格子小动画 */
.sq.fx-buy{animation:sqBuy .75s ease-out;z-index:2}
@keyframes sqBuy{0%{box-shadow:0 0 0 0 var(--oc),inset 0 0 0 4px var(--oc);transform:scale(1.08)}45%{transform:scale(.98)}100%{box-shadow:0 0 0 14px transparent,inset 0 0 0 0 transparent;transform:none}}
.sq.fx-hit{animation:sqHit .65s ease-out}
.sq.fx-land{animation:sqLand .9s ease-out}
@keyframes sqLand{0%{box-shadow:inset 0 0 0 0 rgba(236,114,17,0)}30%{box-shadow:inset 0 0 0 3px rgba(236,114,17,.9),0 0 16px rgba(236,114,17,.55)}100%{box-shadow:inset 0 0 0 0 rgba(236,114,17,0)}}
.sq.fx-combo{animation:sqCombo 1.6s ease-out;z-index:2}
@keyframes sqCombo{0%,100%{box-shadow:0 0 0 0 rgba(255,176,32,0)}25%,60%{box-shadow:0 0 0 3px rgba(255,176,32,.95),0 0 22px rgba(255,176,32,.7)}}
@keyframes sqHit{0%{transform:none}25%{transform:translateY(3px);box-shadow:0 0 0 3px rgba(209,50,18,.85),0 0 18px rgba(209,50,18,.6)}100%{transform:none;box-shadow:none}}
#board.intro .sq{animation:sqDrop .5s cubic-bezier(.2,.8,.3,1.2) both;animation-delay:calc(var(--k) * 22ms)}
@keyframes sqDrop{from{transform:translateY(-26px) scale(.9);opacity:0}to{transform:none;opacity:1}}
.turnbar .tb.gain{animation:tbGain .6s ease-out}
@keyframes tbGain{0%{box-shadow:0 0 0 0 rgba(255,176,32,.9);transform:scale(1.08)}100%{box-shadow:0 0 0 12px rgba(255,176,32,0);transform:none}}
@media (prefers-reduced-motion:reduce){.sq.fx-buy,.sq.fx-hit,.sq.fx-land,.sq.fx-combo,#board.intro .sq,.turnbar .tb.gain{animation:none}}
/* 格子上方的浮动标签 */
.callout{position:fixed;z-index:9;max-width:min(340px,80vw);padding:7px 12px;background:var(--surface);color:var(--ink);border:2px solid #232f3e;border-radius:6px;box-shadow:0 8px 22px rgba(22,25,31,.22);font-size:13px;line-height:1.4;pointer-events:none;animation:coIn .25s ease-out both}
.callout small{display:block;font-size:11.5px;color:var(--mut)}
.callout.org{border-color:#ec7211}.callout.org b{color:var(--warning-ink)}.callout.warn{border-color:#d13212}.callout.warn b{color:var(--red)}.callout.ok{border-color:#0972d3}.callout.ok b{color:var(--blue)}
.callout.out{opacity:0;transform:translateY(-6px);transition:opacity .35s,transform .35s}
@keyframes coIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
/* 升级方块 */
.lvh{position:absolute;left:.35cqw;bottom:.35cqw;display:flex;gap:.18cqw;z-index:1}
.lvh i{width:.75cqw;height:.75cqw;min-width:5px;min-height:5px;border-radius:2px;background:var(--oc);box-shadow:0 1px 0 rgba(0,0,0,.25),inset 0 0 0 1px rgba(255,255,255,.35)}
/* 部署点数条 */
.spbar{display:flex;gap:2px;margin-top:4px;width:100%}.spbar i{flex:1;height:5px;border-radius:1px;background:var(--surface-muted)}.spbar i.on{background:#ec7211}.spbar i.max{background:#d13212}
/* 部署点数按钮：按钮默认横排，条被挤成 0 宽、字往两边溢出被裁；改竖排让条落到字下面（灰掉时本来就是这样） */
.stage .row.more button:has(.spbar){flex-direction:column;gap:0}
@media (prefers-reduced-motion:reduce){.callout{animation:none}.callout.out{transition:none}}
#toast{position:fixed;left:50%;width:max-content;bottom:28px;transform:translate(-50%,20px);z-index:80;max-width:min(90vw,520px);padding:10px 16px;border-radius:8px;background:#232f3e;color:#fff;font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.25);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s}
#toast.on{opacity:1;transform:translate(-50%,0)}
@media (max-width:900px),(max-height:500px) and (orientation:landscape){#toast{bottom:calc(var(--mbar-h,72px) + 12px)}}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
.stack b,.stack span{white-space:nowrap}
.die{width:clamp(48px,4.6cqw,72px);height:clamp(48px,4.6cqw,72px)}
.stage .who{font-size:clamp(17px,1.6cqw,22px)}
.stage{gap:clamp(10px,1.2cqw,18px)}
.potbox{display:flex;align-items:center;gap:8px;border:1px solid var(--line);padding:8px 12px;background:var(--surface);cursor:help}
.potbox img.awsi{width:28px;height:28px}
.potbox span{font-size:13px;color:var(--mut)}
.potbox b{margin-left:auto;font:700 20px/1 "SF Mono",Menlo,ui-monospace,monospace;color:var(--red);font-variant-numeric:tabular-nums}
.meta{align-items:center;flex-wrap:wrap;justify-content:flex-end}
.meta .gap{width:10px}
button.ghost{border-color:transparent;background:transparent}
button.ghost:hover{border-color:var(--line)}
button.danger-lite{color:var(--red);border-color:var(--line)}
button.danger-lite:hover:not(:disabled){border-color:var(--red)}
/* 资产管理一格里的几个操作：换行后上下也留缝，手机上竖着叠时不会一指头按到隔壁的「卖回」。
   align-items 不能用默认的 stretch，不然「没集齐整组」那个虚线框会被拉成按钮那么高 */
.acts{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
/* 资产管理表：手机上「当前级别」别被操作列挤成一字一行（5em 刚好放下 12px 的表头「当前级别」）；运行费不拆行；
   「已下线…」「Spot 要先转按需…」这类原因标签允许换行，不然加上面两条会把表撑出弹窗、整框横滚 */
#modal .box table.mgt th:nth-child(2),#modal .box table.mgt td:nth-child(2){min-width:5em}
#modal .box table.mgt th:nth-child(3),#modal .box table.mgt td:nth-child(3){white-space:nowrap}
#modal .box table.mgt .tagm{white-space:normal}
/* 对比度：小号灰字加深 */
.aar,.aor i,.an.miss em,.arr,.or{color:var(--mut2)!important}
.grp>.gt{color:color-mix(in srgb,var(--gc,var(--ink2)) 72%,#000)}
/* 弹窗：标题和按钮栏固定，长内容滚动时也看得到 */
.box h3{position:sticky;top:0;background:var(--surface);z-index:1}
.box .btns{position:sticky;bottom:0;background:var(--surface);z-index:1}
.box.quiz .btns button{width:100%}

/* 牌堆做成竖版卡牌 */
.cleft{display:grid!important;gap:14px 16px}
.cleft .stack{flex-direction:column;justify-content:center;align-items:center;aspect-ratio:5/7;max-height:22cqw;text-align:center;gap:.6cqw;padding:.8cqw;border-top:4px solid var(--sc,#232f3e)}
.cleft .stack.inc{--sc:#e7157b}

/* 联机 */

.mpform label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--mut)}
