name: 贡献一道题
description: 不用写代码，提交一道原创四选一题，帮助扩充社区题库。
title: '[题目贡献] '
labels:
- quiz-contribution
body:
- type: markdown
  attributes:
    value: '欢迎给「云上大亨」贡献题目！一条 issue 提交一道题，便于逐题讨论和收录。


      只需使用一种语言填写，不要求代码或翻译。当前接收 **四个选项、只有一个正确答案** 的选择题；题目应考查一个明确知识点，适合游戏中快速阅读。请先搜索已有题目和 issue，避免重复；不要提交真实认证考试回忆题或复制付费题库。


      标题建议填写「[题目贡献] 服务名 / 知识点」，例如「[题目贡献] Amazon SQS / 消息处理」。已有题目纠错请使用「问题反馈」。题库分类和入库格式由维护者处理。'
- type: dropdown
  id: bank
  attributes:
    label: 建议放入哪个题库？（选填）
    description: 不确定就保留默认项；认证方向指原创练习题。
    options:
    - 不确定，由维护者归类
    - 游戏基础题 / 玩法 DLC
    - 云从业者（CLF-C02）
    - 解决方案架构师助理（SAA-C03）
    - AI 从业者（AIF-C01）
    default: 0
  validations:
    required: false
- type: input
  id: topic
  attributes:
    label: 相关服务或知识点（选填）
    placeholder: 例如：Amazon SQS、消息重试；可附建议难度（入门 / 进阶）。
  validations:
    required: false
- type: textarea
  id: question
  attributes:
    label: 题干
    description: 把判断答案所需的条件写在题干中；涉及区域、存储类别、配置或时间时请明确。建议 1–3 句话，避免不必要的长背景。
    placeholder: 在……条件下，希望实现……，以下哪项做法符合要求？
  validations:
    required: true
- type: textarea
  id: options
  attributes:
    label: 四个选项
    description: 请分别写 A、B、C、D。选项长度和语气尽量接近，每项单独成行；不要在选项中标注正确答案，也不要使用“以上都对/都不对”。游戏会打乱选项顺序，请避免“选项 A 所述”等相互引用。
    placeholder: 'A. ……

      B. ……

      C. ……

      D. ……'
  validations:
    required: true
- type: dropdown
  id: answer
  attributes:
    label: 正确答案
    description: 对应上面填写的选项；只选一项。
    options:
    - A
    - B
    - C
    - D
  validations:
    required: true
- type: textarea
  id: explanation
  attributes:
    label: 答案解析
    description: 说明正确项为什么成立，以及其他三项为什么不符合题干。相同错误原因可以合并解释；不必写长文。
    placeholder: '正确项：……，因为……

      其余选项：……

      如有例外或适用边界：……'
  validations:
    required: true
- type: textarea
  id: references
  attributes:
    label: 官方文档依据
    description: 至少提供一个直接支持答案的亚马逊云科技官方文档链接（不要只给首页），并指出相关章节或关键结论。用自己的话概括即可。涉及价格、配额或近期变化时，请注明适用区域 / 配置和查阅日期。
    placeholder: '文档链接：https://docs.aws.amazon.com/……

      对应章节 / 支持的结论：……

      适用条件和查阅日期（如需）：……'
  validations:
    required: true
- type: checkboxes
  id: confirmation
  attributes:
    label: 提交确认
    options:
    - label: 题干、选项和解析为我原创或我有权提交，不含真实认证考试回忆题或未经授权转载的题库内容。
      required: true
    - label: 我同意项目收录本次贡献，并为准确性、篇幅和多语言展示进行编辑、翻译。
      required: true
- type: markdown
  attributes:
    value: 提交后，维护者会检查重复题、答案和文档依据；有疑问会在本 issue 讨论。确认后通过关联 PR 入库，PR 合并后再关闭 issue。提交不代表已收录；不必另开 PR，也不要求自行完成翻译。
