name: Lint and layout
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    # 11-11 起 ubuntu-latest 在迁到 Ubuntu 26，playwright install --with-deps 的 apt 安装
    # 从几秒变成 9 分钟以上，10 分钟的上限会让 job 卡在装浏览器那一步，测试一个都跑不到
    timeout-minutes: 15
    defaults:
      run:
        working-directory: tests   # package.json 和检查的配置都在 tests/ 里
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: tests/package-lock.json
      - run: npm ci
      # 缓存浏览器和它的依赖：命中以后不用再走 apt
      - uses: actions/cache@v4
        id: pw-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('tests/package-lock.json') }}
      # 浏览器本体：只走 playwright 自己的 CDN，不碰 apt
      - run: npx playwright install chromium
        if: steps.pw-cache.outputs.cache-hit != 'true'
      # 系统字体等依赖：跑机偶发解析不到 archive.ubuntu.com / security.ubuntu.com，
      # apt 会整批 Failed to fetch。重试几次，失败也不阻断——缺字体最多让布局测试报出来，
      # 比整个 job 挂在这一步、测试一个都跑不到要好。
      - name: 系统依赖（apt 失败不阻断）
        continue-on-error: true
        timeout-minutes: 5   # 解析不到镜像时 apt 每次要耗 9 分钟才放弃，必须单独掐住；别加重试，三次就把整个 job 的时限吃光了
        run: npx playwright install-deps chromium
      - name: 体积检查（仅提醒）
        env:
          SIZE_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [[ -z "$SIZE_BASE_REF" || "$SIZE_BASE_REF" =~ ^0+$ ]]; then
            SIZE_BASE_REF="$DEFAULT_BRANCH"
          fi
          if ! git cat-file -e "$SIZE_BASE_REF:code/index.html" 2>/dev/null; then
            if git fetch --no-tags --depth=1 origin "$SIZE_BASE_REF"; then
              SIZE_BASE_REF=FETCH_HEAD
            fi
          fi
          npm run lint:size -- "$SIZE_BASE_REF"
      - run: npm run check
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: layout-failures
          path: tests/test-results/
