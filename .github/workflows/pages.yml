name: Publish site to GitHub Pages
# The site is code/ (walkthroughs with their audio, language entries, 404, manual/ = the manuals as web pages) plus docs/更新说明.html;
# the game page itself (index.html) is built here from web/ with Vite, not taken from the committed code/index.html.
# PDFs, Markdown and the translation tables (code/i18n/) stay in the repository and are not published (manual/ links the PDFs on GitHub).
# Requires Settings -> Pages -> Build and deployment -> Source: GitHub Actions.
on:
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  publish:
    # 上游默认发布；fork 需先配置 Pages（GitHub Actions），再设置仓库变量 PAGES_DEPLOY_ENABLED=true。
    if: >-
      github.repository == 'cloudsmithy/aws_game' ||
      vars.PAGES_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Assemble site
        run: |
          mkdir -p _site
          cp -R code/. _site/
          rm -rf _site/i18n
          mkdir -p _site/docs
          cp docs/更新说明.html _site/docs/
          # Old address /code/index.html -> site root (other old /code/... paths go through 404.html)
          mkdir -p _site/code
          printf '%s' '<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><script>location.replace("../index.html" + location.search + location.hash);</script><meta http-equiv="refresh" content="0; url=../index.html"></head><body><a href="../index.html">Cloud Tycoon</a></body></html>' > _site/code/index.html
          touch _site/.nojekyll
      - name: Build the game with Vite (replaces the committed index.html)
        working-directory: web
        run: |
          npm ci
          TYCOON_DIST="$RUNNER_TEMP/vite-dist" TYCOON_OUT="$GITHUB_WORKSPACE/_site/index.html" npm run build
          grep -q 'GAME_VERSION' "$GITHUB_WORKSPACE/_site/index.html"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          timeout: 1800000   # 30 minutes; the site is ~130 MB (PDFs, walkthrough audio) and the default 10 minutes has timed out
