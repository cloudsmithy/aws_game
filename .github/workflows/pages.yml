name: Publish site to GitHub Pages
# The site is code/ (game, walkthroughs, language entries, 404) with docs/ under /docs/.
# Requires Settings -> Pages -> Build and deployment -> Source: GitHub Actions.
on:
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble site
        run: |
          mkdir -p _site
          cp -R code/. _site/
          cp -R docs _site/docs
          # Old address /code/index.html -> site root (other old /code/... paths go through 404.html)
          mkdir -p _site/code
          printf '%s' '<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><script>location.replace("../index.html" + location.search + location.hash);</script><meta http-equiv="refresh" content="0; url=../index.html"></head><body><a href="../index.html">Cloud Tycoon</a></body></html>' > _site/code/index.html
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
