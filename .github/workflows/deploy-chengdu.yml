name: Validate and deploy chengdu

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Test release validation and rollback
        run: python3 -m unittest discover -s deploy -p 'test_*.py' -v
      - name: Build static release
        run: python3 deploy/package.py --revision "$GITHUB_SHA" --output /tmp/aws-game.tar.gz

  deploy:
    needs: validate
    if: >-
      github.repository == 'cloudsmithy/aws_game' &&
      github.ref == 'refs/heads/master' &&
      github.event_name != 'pull_request' &&
      vars.CHENGDU_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment:
      name: chengdu
      url: https://game.usergroup.cn/aws-game/
    concurrency:
      group: chengdu-aws-game-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Build static release
        run: python3 deploy/package.py --revision "$GITHUB_SHA" --output /tmp/aws-game.tar.gz
      - name: Publish and verify, or roll back
        env:
          DEPLOY_HOST: ${{ secrets.CHENGDU_HOST }}
          DEPLOY_KEY: ${{ secrets.CHENGDU_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.CHENGDU_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$DEPLOY_HOST" && test -n "$DEPLOY_KEY" && test -n "$DEPLOY_KNOWN_HOSTS"
          [[ "$DEPLOY_HOST" =~ ^[A-Za-z0-9][A-Za-z0-9.-]*$ ]]
          mkdir -p "$RUNNER_TEMP/aws-game-ssh"
          chmod 700 "$RUNNER_TEMP/aws-game-ssh"
          key="$RUNNER_TEMP/aws-game-ssh/key"
          hosts="$RUNNER_TEMP/aws-game-ssh/known_hosts"
          printf '%s\n' "$DEPLOY_KEY" > "$key"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$hosts"
          chmod 600 "$key" "$hosts"
          unset DEPLOY_KEY DEPLOY_KNOWN_HOSTS
          remote=(ssh -T -p 22 -i "$key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$hosts" -o ConnectTimeout=20 "aws-game-deploy@$DEPLOY_HOST")
          cleanup() { rm -f "$key" "$hosts"; }
          trap cleanup EXIT
          rollback() {
            trap - ERR
            echo 'Deployment or health check failed; restoring previous release if this revision is current.'
            "${remote[@]}" "rollback $GITHUB_SHA" </dev/null || true
            exit 1
          }
          trap rollback ERR
          "${remote[@]}" "deploy $GITHUB_SHA" < /tmp/aws-game.tar.gz
          base='https://game.usergroup.cn/aws-game'
          curl --fail --silent --show-error --retry 3 --retry-all-errors --max-time 30 "$base/_deployment.json?revision=$GITHUB_SHA" -o "$RUNNER_TEMP/aws-game-manifest.json"
          python3 -c 'import json,os,sys; assert json.load(open(sys.argv[1]))["revision"] == os.environ["GITHUB_SHA"], "unexpected live revision"' "$RUNNER_TEMP/aws-game-manifest.json"
          curl --fail --silent --show-error --retry 3 --max-time 30 "$base/code/index.html?revision=$GITHUB_SHA" -o /dev/null
          echo "Deployed $GITHUB_SHA to $base/" >> "$GITHUB_STEP_SUMMARY"
